<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Meridian · Console de bord</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Console HUD : rail de navigation à gauche, bandeau d'état en haut, téléscripteur du journal en bas.
   Thème unique sombre (console de vaisseau), choisi délibérément. */
:root{
  --bg:#03080c;--bg2:#06121a;--pn:#081720;--pn2:#0b1f2a;--ln:#14303b;--ln2:#22505e;
  --cy:#62e6f2;--cy2:#2fb3c2;--cyd:#0d3c47;--tx:#d3ebef;--mu:#7f9fa9;--dim:#405c66;
  --amb:#f5a83a;--red:#ff5266;--vio:#a88dff;--ok:#43d9a8;
  --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--f-disp);overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 55% -10%,rgba(47,179,194,.10),transparent 70%),
  linear-gradient(rgba(98,230,242,.035) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(98,230,242,.035) 1px,transparent 1px) 0 0/32px 32px}
.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.dim{color:var(--dim)}.cy{color:var(--cy)}.amb{color:var(--amb)}.red{color:var(--red)}.vio{color:var(--vio)}.okc{color:var(--ok)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ---------- Coque de l'application ---------- */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:200px 1fr}
.top{grid-column:1/-1;min-width:0}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ln);background:linear-gradient(180deg,rgba(8,23,32,.95),rgba(6,18,26,.85))}
.brand{font-weight:700;font-size:26px;letter-spacing:.24em;line-height:1;color:var(--tx);text-shadow:0 0 18px rgba(98,230,242,.25)}
.brand small{display:block;margin-top:5px;font-size:10.5px;font-weight:500;letter-spacing:.2em;color:var(--mu)}
.hsep{width:1px;align-self:stretch;background:var(--ln)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;font:600 12px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.chip i{width:7px;height:7px;background:currentColor;display:block}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--amb)}.chip.crit{color:var(--red);animation:blink 1.2s steps(2) infinite}.chip.off{color:var(--dim)}.chip.cy{color:var(--cy)}
@keyframes blink{50%{background:rgba(255,82,102,.16)}}
.clock{font:500 20px/1 var(--f-mono);letter-spacing:.06em}
.clock small{display:block;font:500 10px var(--f-disp);letter-spacing:.18em;color:var(--mu);margin-top:4px}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;text-align:right}
.who b{display:block;font-weight:600;font-size:14px}
.who span{font-size:11.5px;color:var(--mu);letter-spacing:.04em}
.lvl{font:600 18px/1 var(--f-mono);color:var(--cy);border:1px solid var(--cy2);padding:6px 9px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;padding-block:6px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ln);background:rgba(98,230,242,.04)}
.demo b{color:var(--cy);letter-spacing:.14em;font-size:11px;font-weight:600;margin-right:6px}
.demo select{min-height:30px;padding:4px 8px}
select,input[type=text],input[type=number],input[type=search],textarea{background:var(--bg2);border:1px solid var(--ln2);padding:7px 9px;min-height:36px;border-radius:0;max-width:100%}
select:hover,input:hover{border-color:var(--cy2)}

nav{border-right:1px solid var(--ln);padding:14px 0;overflow:auto;background:rgba(6,18,26,.6)}
nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--mu);text-decoration:none;font-weight:500;letter-spacing:.06em;font-size:13.5px;border-left:2px solid transparent;cursor:pointer}
nav a:hover{color:var(--tx);background:rgba(98,230,242,.04)}
nav a[aria-current=page]{color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,rgba(98,230,242,.12),transparent)}
nav a .n{font:500 10.5px var(--f-mono);color:var(--dim);width:18px}
nav a .bad{margin-left:auto;font:600 11px var(--f-mono);background:var(--red);color:var(--bg);padding:1px 6px}
nav .navsep{margin:14px 18px 6px;font-size:10px;letter-spacing:.2em;color:var(--dim)}

main{overflow:auto;padding-block:16px 24px;padding-left:16px;padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
footer{grid-column:1/-1;border-top:1px solid var(--ln);background:rgba(6,18,26,.92);font:12px var(--f-mono);color:var(--mu);display:flex;overflow:hidden;white-space:nowrap;padding-bottom:env(safe-area-inset-bottom,0px)}
footer .tl{padding:7px 14px;color:var(--cy);border-right:1px solid var(--ln);letter-spacing:.12em;flex:none}
footer .tk{overflow:hidden;flex:1;position:relative}
footer .tk div{display:inline-block;padding:7px 0;animation:tick 70s linear infinite}
footer .tk span{margin-right:42px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.banner{padding:8px 18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px}
.banner.red{background:rgba(255,82,102,.14);color:var(--red);border-bottom:1px solid var(--red)}
.banner.amb{background:rgba(245,168,58,.12);color:var(--amb);border-bottom:1px solid rgba(245,168,58,.5)}

/* ---------- Panneaux chanfreinés ---------- */
.pn{--c:12px;position:relative;padding:1px;background:linear-gradient(160deg,var(--ln2),var(--ln) 40%,var(--ln) 70%,var(--ln2));clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));min-width:0}
.pn>.pi{height:100%;background:linear-gradient(180deg,rgba(98,230,242,.035),transparent 120px),var(--pn);clip-path:inherit;padding:14px 16px 16px;min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.ph h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cy)}
.ph .code{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--dim);letter-spacing:.08em}
.grid{display:grid;gap:14px}
.g-ov{grid-template-columns:minmax(240px,1fr) minmax(360px,1.7fr) minmax(260px,1fr)}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g-2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.g-ov{grid-template-columns:1fr 1fr}.g-ov>.center{grid-column:1/-1;order:-1}}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:0}
  nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:10px 14px}
  nav a[aria-current=page]{border-bottom-color:var(--cy)}
  nav .navsep,nav a .n{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g-ov,.g-2,.g-2b{grid-template-columns:1fr}
  .brand{font-size:22px}.hsep{display:none}}

/* ---------- Éléments ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--ln);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--mu);font-size:13px}
.kv>b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.big{font:500 30px/1 var(--f-mono);letter-spacing:.02em}
.big small{font-size:13px;color:var(--mu);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--ln);padding:10px 12px;background:rgba(3,8,12,.4)}
.tile span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.bar{height:5px;background:var(--cyd);margin:5px 0 2px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cy2)}
.bar.seg{background:repeating-linear-gradient(90deg,var(--cyd) 0 6px,transparent 6px 8px);height:8px}
.bar.seg i{background:repeating-linear-gradient(90deg,var(--cy) 0 6px,transparent 6px 8px)}
.bar.warn i{background:var(--amb)}.bar.crit i{background:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{--bc:var(--cy2);--bt:var(--cy);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;background:rgba(98,230,242,.06);border:1px solid var(--bc);color:var(--bt);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.b:hover:not(:disabled){background:rgba(98,230,242,.16)}
.b.amb{--bc:var(--amb);--bt:var(--amb);background:rgba(245,168,58,.07)}.b.amb:hover:not(:disabled){background:rgba(245,168,58,.18)}
.b.red{--bc:var(--red);--bt:var(--red);background:rgba(255,82,102,.08)}.b.red:hover:not(:disabled){background:rgba(255,82,102,.2)}
.b.solid{background:var(--cy);color:var(--bg);border-color:var(--cy)}.b.solid:hover:not(:disabled){background:#8af0f8}
.b.ghost{--bc:var(--ln2);--bt:var(--mu);background:transparent}
.b.sm{min-height:28px;padding:3px 10px;font-size:11px}
.b:disabled{--bc:var(--ln);--bt:var(--dim);cursor:not-allowed;background:transparent}
.b .lk{font:500 10px var(--f-mono);letter-spacing:0;text-transform:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tab{padding:6px 12px;border:1px solid var(--ln);background:transparent;cursor:pointer;font-size:12px;letter-spacing:.08em;color:var(--mu)}
.tab[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:rgba(98,230,242,.1)}
.tab .s{display:inline-block;width:7px;height:7px;margin-right:6px;vertical-align:1px}
.st{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;background:currentColor}
.st.ok{color:var(--ok)}.st.warn{color:var(--amb)}.st.fire,.st.crit{color:var(--red)}.st.vac{color:var(--vio)}.st.gone{color:var(--dim)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--ln2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.m,th.r,td.r{text-align:right}
.tbl td:first-child{min-width:150px}
tr.sel td{background:rgba(98,230,242,.08)}
tbody tr{cursor:pointer}tbody tr:hover td{background:rgba(98,230,242,.04)}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.al:last-child{border-bottom:0}
.al .dot{width:9px;height:9px;flex:none;margin-top:5px}
.al b{font-weight:600;display:block}
.al small{color:var(--mu);font:12px var(--f-mono)}
.al.ack{opacity:.5}
.empty{color:var(--dim);padding:10px 0;font-size:13px}
.note{color:var(--mu);font-size:12.5px;margin:8px 0 0;max-width:70ch}
.lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px}
.pill{display:inline-block;padding:1px 7px;border:1px solid var(--ln2);font:500 11px var(--f-mono);color:var(--mu);margin:2px 4px 2px 0}
.pill.cy{border-color:var(--cy2);color:var(--cy)}.pill.amb{border-color:var(--amb);color:var(--amb)}.pill.red{border-color:var(--red);color:var(--red)}
.svgw{width:100%;overflow:hidden}
svg{display:block;width:100%;height:auto}
svg .hit{cursor:pointer}
svg .hit:hover{filter:brightness(1.45)}
.spin{transform-origin:300px 300px;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cd{font:600 54px/1 var(--f-mono);color:var(--red);letter-spacing:.04em;text-shadow:0 0 20px rgba(255,82,102,.4)}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.code{border:1px dashed var(--ln2);padding:10px;font:500 13px var(--f-mono)}
.code.ok{border:1px solid var(--ok);color:var(--ok)}
.gauge{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.gauge div{border:1px solid var(--ln);padding:8px 10px;background:rgba(3,8,12,.35)}
.gauge span{display:block;font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.gauge b{font:500 19px var(--f-mono)}
.gauge b.warn{color:var(--amb)}.gauge b.crit{color:var(--red)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ln)}
.sw{position:relative;width:46px;height:22px;border:1px solid var(--ln2);background:var(--bg2);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:left .15s}
.sw[aria-checked=true]{border-color:var(--cy2)}.sw[aria-checked=true]::after{left:27px;background:var(--cy)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.logl{display:grid;grid-template-columns:64px 130px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:13px}
.logl .t{font:12px var(--f-mono);color:var(--dim)}
.logl .w{color:var(--cy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logl.crit .w,.logl.crit .x{color:var(--red)}.logl.admin .w{color:var(--vio)}.logl.sys .w{color:var(--mu)}
@media(max-width:600px){.logl{grid-template-columns:54px 1fr}.logl .w{grid-column:2}.logl .x{grid-column:1/-1}}
.hp{display:inline-block;width:60px;height:5px;background:var(--cyd);vertical-align:middle;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.hp.warn i{background:var(--amb)}.hp.crit i{background:var(--red)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 14px;max-height:260px;overflow:auto;border:1px solid var(--ln);padding:8px}
.clause{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:520px){.clause{grid-template-columns:1fr}}
.feed{font:12px var(--f-mono);max-height:220px;overflow:auto;color:var(--mu)}
.feed div{padding:3px 0;border-bottom:1px solid var(--ln);white-space:pre-wrap;word-break:break-word}

/* ---------- Fenêtre modale et notifications ---------- */
/* Écrans en jeu (kiosque) */
body.kiosk #app{display:block}
body.kiosk::after{display:none}
.kio{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
.kio .khead{display:flex;align-items:center;gap:14px;padding:1.6vh 2.4vw;border-bottom:1px solid var(--ln);font-family:var(--f-mono);letter-spacing:.14em;font-size:max(11px,1.7vh);color:var(--mu)}
.kio .khead b{color:var(--cy);font-family:var(--f-disp);letter-spacing:.32em;font-size:max(13px,2.4vh)}
.kio .kbody{flex:1;min-height:0;overflow:hidden;padding:2vh 2vw;pointer-events:none}
.kio .kbody main{padding:0;overflow:visible;height:auto}
.kio .ktext{flex:1;display:grid;place-items:center;text-align:center;padding:4vh 4vw;white-space:pre-line;font-weight:500;letter-spacing:.04em;line-height:1.25}
.kio iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.kstat{flex:1;display:grid;place-items:center;text-align:center;gap:2vh;padding:3vh}
.kstat .big{font-size:8vh;letter-spacing:.3em;color:var(--cy);font-weight:300}
.kstat .clk{font-family:var(--f-mono);font-size:11vh;letter-spacing:.08em}
.kstat .sub{font-size:2.6vh;letter-spacing:.18em;color:var(--mu)}
.kstat .row{justify-content:center;gap:1.2vw}
body.glass,html.glass{background:transparent!important}
body.glass .kio{background:transparent}
body.glass .pn,body.glass .pn .pi{background:rgba(3,14,20,.42)!important}
body.glass .kio .khead{border-color:rgba(98,230,242,.25)}
.lvls{display:grid;gap:8px;margin-top:12px}
.lvls .lvlb{display:grid;grid-template-columns:28px 1fr;text-align:left;align-items:center;gap:2px 10px;padding:10px 12px;height:auto;white-space:normal}
.lvls .lvlb b{grid-row:span 2;font-size:22px;font-family:var(--f-mono)}
.lvls .lvlb span{font-size:13px;letter-spacing:.02em;text-transform:none}
.lvls .lvlb i{font-style:normal;font-size:11px;text-transform:none;letter-spacing:0}
.lvls .lvlb.on{box-shadow:0 0 0 2px #fff inset}
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(2,6,9,.72);padding:16px}
#modal .pn{width:min(640px,100%);max-height:calc(100% - 32px)}
#modal .pi{max-height:calc(100vh - 34px);overflow:auto}
#modal h3{margin:0 0 4px;font-size:18px;letter-spacing:.06em}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
label.f{display:block;margin-bottom:10px;font-size:12px;letter-spacing:.06em;color:var(--mu)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;color:var(--tx)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.f2{grid-template-columns:1fr}}
#toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#toast div{padding:9px 14px;background:var(--pn2);border:1px solid var(--cy2);font-size:13px;max-width:min(420px,calc(100vw - 32px))}
#toast div.err{border-color:var(--red);color:#ffc4cb}
.gate{display:grid;place-items:center;height:100%;text-align:center;padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const MC = (() => {
/* =====================================================================
   MERIDIAN · moteur commun
   Partagé à l'identique par le Worker (autorité) et la console (mode démo).
   Aucune dépendance. Toutes les fonctions qui modifient l'état le font en

/* ============================ Navigation ============================= */
/* Catalogue (systèmes, planètes, champs de météorites) : même JSON que le mod (meridian/shared/nav-default.json).

/* Message « nav » du mod : position réelle du vaisseau. */

/* ---------------------------- Permissions --------------------------- */
function levelOf(p) { return p ? (p.admin ? 99 : (p.level | 0)) : -1; }

function can(state, actor, action, term) {
  if (!actor) return false;
  if (actor.admin) return true;
  if (state.computer.refuse) return false;
  const meta = ACTIONS[action];
  if (!meta) return false;
  if (term && state.terminals[term] && !state.terminals[term].pages.includes(meta[2])) return false;
  return levelOf(actor) >= (state.perms[action] ?? meta[1]);
}

function effectiveRule(state, door) {
  if (door.rule) return door.rule;
  if (door.group && state.accessGroups[door.group]) return state.accessGroups[door.group].rule || null;
  return null;
}

function clauseMatch(c, p) {
  switch (c.t) {
    case "min": return levelOf(p) >= c.v;
    case "lv": return (c.v || []).includes(p.level | 0);
    case "p": return p.id === c.v;
    case "role": return (p.role || "") === c.v;
    case "job": return (p.job || "") === c.v;
    case "grp": return (p.group || "") === c.v;
    case "team": return (p.team || "") === c.v;
    case "tag": return (p.tags || []).includes(c.v);
    case "none": return false;
    default: return false;
  }
}

/* Peut-on ouvrir cette porte avec sa puce ? */
function canOpenDoor(state, p, door) {
  if (!p || !door) return { ok: false, why: "Inconnu" };
  if (p.admin) return { ok: true, why: "Admin" };
  if (p.vitals && p.vitals.alive === false) return { ok: false, why: "Puce inactive" };
  if (door.broken) return { ok: false, why: "Lecteur hors service" };
  if (door.state.lockdown) return { ok: false, why: "Porte scellée" };
  if (door.state.locked) return { ok: false, why: "Verrouillée" };
  if ((door.managers || []).includes(p.id)) return { ok: true, why: "Gestionnaire" };
  if ((door.grants || []).includes(p.id)) return { ok: true, why: "Autorisation spéciale" };
  const r = effectiveRule(state, door);
  if (!r || !r.any || !r.any.length) return { ok: true, why: "Accès libre" };
  return r.any.some(c => clauseMatch(c, p)) ? { ok: true, why: "Règle" } : { ok: false, why: "Accès refusé" };
}

function ruleText(state, rule) {
  if (!rule || !rule.any || !rule.any.length) return "Accès libre";
  return rule.any.map(c => {
    switch (c.t) {
      case "min": return "niv. " + c.v + " et plus";
      case "lv": return "niv. " + (c.v || []).join(", ");
      case "p": return state.people[c.v] ? state.people[c.v].name : "personne inconnue";
      case "role": return "rôle « " + c.v + " »";
      case "job": return "métier « " + c.v + " »";
      case "grp": return c.v;
      case "team": return "équipe de " + c.v;
      case "tag": return "#" + c.v;
      case "none": return "personne (gestionnaires seulement)";
      default: return "?";
    }
  }).join(" · ou ");
}

/* Liste d'accès compilée, envoyée au mod pour un contrôle local instantané. */
function compileAcl(state) {
  const people = Object.values(state.people);
  const doors = {};
  for (const d of Object.values(state.doors)) {
    const r = effectiveRule(state, d);
    doors[d.id] = {
      locked: !!d.state.locked, lockdown: !!d.state.lockdown, broken: !!d.broken,
      public: !r || !r.any || !r.any.length,
      allow: people.filter(p => !p.admin && canOpenDoor(state, p, d).ok).map(p => p.id)
    };
  }
  return { type: "acl", admins: people.filter(p => p.admin).map(p => p.id), doors };
}

/* ------------------------------ Alertes ----------------------------- */
function roomStatus(state, r) {
  if (!r) return "ok";
  const sec = r.section && state.sections[r.section];
  if (sec && sec.state === "ejected") return "gone";
  const e = r.env || {};
  if (r.flags && r.flags.fire) return "fire";
  if ((r.flags && r.flags.breach) || e.p < 60 || r.mode === "vent") return "vac";
  if (r.alarm || e.o2 < 18 || e.co2 > 1 || e.t < 5 || e.t > 40 || e.power === false || (r.flags && r.flags.alarm)) return "warn";
  return "ok";
}

function computeAlerts(state, withSilent = false) {
  const out = [];
  if (state.ship.alert) out.push({ key: "ship", lvl: (PA_LEVELS[state.ship.alert] || [0, "warn"])[1], text: "Alerte générale · " + (PA_LEVELS[state.ship.alert] ? PA_LEVELS[state.ship.alert][0] : state.ship.alert), room: null });
  for (const r of Object.values(state.rooms)) {
    const st = roomStatus(state, r), e = r.env || {};
    if (st === "gone") continue;
    if (r.flags && r.flags.fire) out.push({ key: "fire:" + r.id, lvl: "crit", text: "Incendie", room: r.id });
    if ((r.flags && r.flags.breach) || e.p < 60) out.push({ key: "vac:" + r.id, lvl: "crit", text: "Dépressurisation · " + Math.round(e.p) + " kPa", room: r.id });
    if (r.mode === "vent") out.push({ key: "vent:" + r.id, lvl: "warn", text: "Vidage en cours", room: r.id });
    if (e.o2 < 18) out.push({ key: "o2:" + r.id, lvl: e.o2 < 15 ? "crit" : "warn", text: "Oxygène bas · " + (+e.o2).toFixed(1) + " %", room: r.id });
    if (e.t < 5) out.push({ key: "cold:" + r.id, lvl: "warn", text: "Température · " + Math.round(e.t) + " °C", room: r.id });
    if (e.power === false) out.push({ key: "pwr:" + r.id, lvl: "warn", text: "Hors alimentation", room: r.id });
    if (r.alarm) out.push({ key: "man:" + r.id, lvl: "warn", text: "Alarme manuelle", room: r.id });
  }
  for (const f of state.faults) if (f.active && (withSilent || !f.silent) && f.target && f.target.kind === "door")
    out.push({ key: "f:" + f.id, lvl: "warn", text: FAULT_INDEX[f.key]?.name || f.key, room: null, door: f.target.id });
  for (const p of Object.values(state.people)) if (p.vitals && p.vitals.alive === false && !p.vitals.reported)
    out.push({ key: "dead:" + p.id, lvl: "crit", text: "Signal vital perdu · " + p.name, room: p.room || null });
  out.forEach(a => a.ack = state.acks.includes(a.key));
  return out;
}

/* ------------------------- Données du mod --------------------------- */
/* structure : { decks:[{id,name,kind,order,y0,y1}], rooms:[{id,name,deck,kind,rects:[[x1,z1,x2,z2]],volume}],
   doors:[{id,name,deck,x,z,rooms:[a,b],size,airtight}], valves:[{id,name,room,kind}],
   sections:[{id,name,ejectable,rooms:[]}], terminals:[{id,name,room}] } */

  if (state.ship.demo) {
    const keepPerms = state.perms, admins = Object.values(state.people).filter(p => p.admin && !p.demo);
    const fresh = emptyShip(state.ship.name);
    Object.assign(state, fresh);
    state.perms = keepPerms;
    for (const a of admins) state.people[a.id] = a;
    log(state, "SYSTÈME", "Première structure reçue du mod : la démo est remplacée.", "sys", now);
  }
  const keep = (old, neu, fields) => { if (old) for (const f of fields) if (old[f] !== undefined) neu[f] = old[f]; return neu; };
  const decks = [];
  for (const d of s.decks || []) {
    const old = state.decks.find(x => x.id === d.id);
    const n = { id: d.id, name: d.name || ("Pont " + d.id), kind: d.kind || "hull", order: d.order ?? decks.length, y0: d.y0, y1: d.y1 };
    if (old && old.named) { n.name = old.name; n.named = true; }
    decks.push(n);
  }
  state.decks = decks.sort((a, b) => a.order - b.order);

  const rooms = {};
  for (const r of s.rooms || []) {
    const old = state.rooms[r.id];
    const n = { id: r.id, name: r.name || r.id, deck: r.deck, kind: r.kind || "room", rects: r.rects || [], volume: r.volume || 0,
      env: old ? old.env : envDefault(), flags: old ? old.flags : {}, alarm: old ? old.alarm : false, mode: old ? old.mode : null, section: r.section || null };
    if (old && old.named) { n.name = old.name; n.named = true; }
    if (old && old.sectionSet) { n.section = old.section; n.sectionSet = true; }
    rooms[r.id] = n;
  }
  state.rooms = rooms;

  const doors = {};
  for (const d of s.doors || []) {
    const old = state.doors[d.id];
    const n = { id: String(d.id), name: d.name || ("Porte " + d.id), deck: d.deck, x: d.x, z: d.z, rooms: d.rooms || [], size: d.size || "",
      airtight: d.airtight !== false, state: old ? old.state : { open: false, locked: false, lockdown: false },
      rule: null, group: null, managers: [], grants: [] };
    keep(old, n, ["rule", "group", "managers", "grants", "broken"]);
    if (old && old.named) { n.name = old.name; n.named = true; }
    doors[n.id] = n;
  }
  state.doors = doors;

  const valves = {};
  for (const v of s.valves || []) {
    const old = state.valves[v.id];
    valves[v.id] = { id: v.id, name: (old && old.named) ? old.name : (v.name || v.id), named: !!(old && old.named), room: v.room, kind: v.kind || "gas", open: old ? old.open : !!v.open };
  }
  state.valves = valves;

  for (const sec of s.sections || []) {
    const old = state.sections[sec.id];
    state.sections[sec.id] = { id: sec.id, name: (old && old.named) ? old.name : (sec.name || sec.id), named: !!(old && old.named),
      ejectable: old ? old.ejectable : !!sec.ejectable, state: old ? old.state : "attached", fromMod: true };
    for (const rid of sec.rooms || []) if (state.rooms[rid] && !state.rooms[rid].sectionSet) state.rooms[rid].section = sec.id;
  }
  for (const t of s.terminals || []) {
    const old = state.terminals[t.id];
    state.terminals[t.id] = { id: t.id, name: (old && old.named) ? old.name : (t.name || t.id), named: !!(old && old.named), room: t.room || null,
      pages: old ? old.pages : Object.keys(PAGES).filter(k => !ADMIN_PAGES.includes(k)) };
  }
  state.ship.lastStructure = now;
  log(state, "SYSTÈME", `Structure synchronisée : ${state.decks.length} ponts, ${Object.keys(rooms).length} pièces, ${Object.keys(doors).length} portes.`, "sys", now);
}

/* Un joueur a saisi son nom à la connexion. */
/* name : nom à bord choisi par le joueur. mcName : pseudo Minecraft, utilisé tant qu'aucun nom n'est choisi. */
function registerPlayer(state, { uuid, name, mcName }, now = Date.now()) {
  if (!uuid) return null;
  let p = state.people[uuid];
  if (!p) {
    p = state.people[uuid] = { id: uuid, name: name || mcName || "Inconnu", mcName: mcName || "", level: 0, rank: "", job: "", role: "Non assigné", group: "", team: "aucune", tags: [], online: true, room: null, vitals: null, joined: now };
    log(state, "SYSTÈME", `Nouvel arrivant : ${p.name}. Affectation en attente.`, "crew", now);
  } else if (mcName && p.mcName !== mcName) p.mcName = mcName;
  if (p && name && p.name !== name) {
    log(state, "SYSTÈME", `${p.name} s’identifie désormais comme ${name}.`, "crew", now);
    p.name = name;
  }
  return p;
}

/* telemetry : { rooms:{id:{p,o2,co2,t,g,power,fire,breach}}, doors:{id:{open}}, players:[{uuid,name,room,vitals}], stocks:{} , full:true } */
function applyTelemetry(state, m, now = Date.now()) {
  for (const [id, e] of Object.entries(m.rooms || {})) {
    const r = state.rooms[id]; if (!r) continue;
    const { fire, breach, ...env } = e;
    Object.assign(r.env, env);
    if (fire !== undefined) r.flags.fire = !!fire;
    if (breach !== undefined) r.flags.breach = !!breach;
    if (r.mode === "pressurize" && r.env.p >= 100) r.mode = null;
    if (r.mode === "vent" && r.env.p <= 0.5) r.mode = null;
  }
  for (const [id, d] of Object.entries(m.doors || {})) if (state.doors[id]) Object.assign(state.doors[id].state, { open: !!d.open });
  if (m.players) {
    const seen = new Set();
    for (const pl of m.players) {
      const p = registerPlayer(state, pl, now); if (!p) continue;
      seen.add(p.id);
      const wasAlive = !p.vitals || p.vitals.alive !== false;
      p.online = pl.online !== false; p.room = pl.room || null; p.vitals = Object.assign(p.vitals || {}, pl.vitals || {});
      if (wasAlive && p.vitals.alive === false) log(state, "SYSTÈME", `Signal vital perdu : ${p.name}${p.room && state.rooms[p.room] ? " (" + state.rooms[p.room].name + ")" : ""}.`, "crit", now);
      if (!wasAlive && p.vitals.alive !== false) { p.vitals.reported = false; log(state, "SYSTÈME", `${p.name} est de nouveau en vie.`, "crew", now); }
    }
    if (m.full) for (const p of Object.values(state.people)) if (!seen.has(p.id) && !p.demo) p.online = false;
  }
  if (m.stocks) Object.assign(state.stocks, m.stocks);
}

/* ------------------------------ Actions ----------------------------- */
const ERR = (error) => ({ ok: false, error, cmds: [] });

function apply(state, actor, a, ctx = {}) {
  const now = ctx.now || Date.now(), term = ctx.term || null;
  if (!actor) return ERR("Session inconnue.");
  if (!a || !a.type) return ERR("Action vide.");
  if (state.computer.refuse && !actor.admin) return ERR(state.computer.message || "ORDINATEUR : commande refusée.");
  const who = actor.name, cmds = [];
  const need = (perm) => { if (!can(state, actor, perm, term)) throw new Error("Niveau ou terminal insuffisant : " + ACTIONS[perm][0].toLowerCase() + "."); };
  const room = (id) => { const r = state.rooms[id]; if (!r) throw new Error("Pièce inconnue."); if (roomStatus(state, r) === "gone") throw new Error("Pièce éjectée."); return r; };
  const door = (id) => { const d = state.doors[id]; if (!d) throw new Error("Porte inconnue."); return d; };
  const person = (id) => { const p = state.people[id]; if (!p) throw new Error("Personne inconnue."); return p; };
  const L = (t, k) => log(state, who, t, k, now);
  try {
    switch (a.type) {
      /* Portes */
      case "door.open": {
        const d = door(a.door); need("door.remote");
        if (d.state.lockdown && !can(state, actor, "door.lockdown", term)) throw new Error("Porte scellée.");
        d.state.open = !!a.open; cmds.push({ type: "door.set", door: d.id, open: d.state.open });
        L(`${d.state.open ? "ouvre" : "ferme"} ${d.name}.`, "door"); break;
      }
      case "door.lock": {
        const d = door(a.door);
        if (!(d.managers || []).includes(actor.id)) need("door.lock");
        d.state.locked = !!a.locked; if (a.locked) d.state.open = false;
        cmds.push({ type: "door.set", door: d.id, locked: d.state.locked, open: d.state.open });
        L(`${d.state.locked ? "verrouille" : "déverrouille"} ${d.name}.`, "door"); break;
      }
      case "door.lockdown": {
        need("door.lockdown");
        const ids = a.room ? Object.values(state.doors).filter(d => d.rooms.includes(a.room)).map(d => d.id) : [a.door];
        for (const id of ids) { const d = door(id); d.state.lockdown = !!a.on; if (a.on) d.state.open = false; cmds.push({ type: "door.set", door: d.id, lockdown: d.state.lockdown, open: d.state.open }); }
        L(`${a.on ? "scelle" : "lève le scellé de"} ${a.room ? "toutes les portes de " + state.rooms[a.room].name : state.doors[a.door].name}.`, "door"); break;
      }
      case "door.setRule": { const d = door(a.door); need("access.edit"); d.rule = sanitizeRule(a.rule); L(`règle de ${d.name} : ${ruleText(state, effectiveRule(state, d))}.`, "access"); break; }
      case "door.setGroup": { const d = door(a.door); need("access.edit"); if (a.group && !state.accessGroups[a.group]) throw new Error("Groupe inconnu."); d.group = a.group || null; L(`${d.name} → groupe ${a.group ? state.accessGroups[a.group].name : "aucun"}.`, "access"); break; }
      case "door.setManagers": { const d = door(a.door); need("access.edit"); d.managers = (a.managers || []).filter(id => state.people[id]); L(`gestionnaires de ${d.name} : ${d.managers.map(id => state.people[id].name).join(", ") || "aucun"}.`, "access"); break; }
      case "door.grant": {
        const d = door(a.door), p = person(a.person);
        if (!(d.managers || []).includes(actor.id)) need("access.edit");
        d.grants = (d.grants || []).filter(x => x !== p.id); if (a.on) d.grants.push(p.id);
        L(`${a.on ? "autorise" : "retire l’autorisation de"} ${p.name} sur ${d.name}.`, "access"); break;
      }
      case "door.rename": { const d = door(a.door); need("structure.edit"); d.name = clean(a.name, 40) || d.name; d.named = true; break; }
      case "group.save": {
        need("access.edit");
        const id = a.id && state.accessGroups[a.id] ? a.id : "g" + (state.seq++);
        const g = state.accessGroups[id] = { id, name: clean(a.name, 40) || "Groupe " + id, rule: sanitizeRule(a.rule) };
        const set = new Set((a.doors || []).map(String));
        for (const d of Object.values(state.doors)) { if (set.has(d.id)) d.group = id; else if (d.group === id) d.group = null; }
        L(`enregistre le groupe d’accès « ${g.name} » (${set.size} portes, ${ruleText(state, g.rule)}).`, "access"); break;
      }
      case "group.delete": {
        need("access.edit"); const g = state.accessGroups[a.id]; if (!g) throw new Error("Groupe inconnu.");
        for (const d of Object.values(state.doors)) if (d.group === a.id) d.group = null;
        delete state.accessGroups[a.id]; L(`supprime le groupe « ${g.name} ».`, "access"); break;
      }
      /* Atmosphère */
      case "valve.set": {
        need("valve.set"); const v = state.valves[a.valve]; if (!v) throw new Error("Vanne inconnue."); room(v.room);
        v.open = !!a.open; cmds.push({ type: "valve.set", valve: v.id, open: v.open });
        L(`${v.open ? "ouvre" : "ferme"} la vanne ${v.name} (${state.rooms[v.room].name}).`, "atmos"); break;
      }
      case "room.pressurize": { need("room.pressurize"); const r = room(a.room); r.mode = "pressurize"; cmds.push({ type: "room.pressurize", room: r.id }); L(`lance la pressurisation de ${r.name}.`, "atmos"); break; }
      case "room.vent": { need("room.vent"); const r = room(a.room); r.mode = "vent"; cmds.push({ type: "room.vent", room: r.id }); L(`lance le vidage de l’air de ${r.name}.`, "crit"); break; }
      case "room.stop": { const r = room(a.room); need(r.mode === "vent" ? "room.vent" : "room.pressurize"); r.mode = null; cmds.push({ type: "room.stop", room: r.id }); L(`arrête le cycle d’air de ${r.name}.`, "atmos"); break; }
      case "room.alarm": { need("room.alarm"); const r = room(a.room); r.alarm = !!a.on; cmds.push({ type: "alarm.set", room: r.id, on: r.alarm, level: "4" }); cmds.push(paStateCmd(state)); if (!a.on) state.acks = state.acks.filter(k => k !== "man:" + r.id); L(`${a.on ? "déclenche" : "coupe"} l’alarme de ${r.name}.`, "alarm"); break; }
      case "room.rename": { need("structure.edit"); const r = state.rooms[a.room]; if (!r) throw new Error("Pièce inconnue."); r.name = clean(a.name, 40) || r.name; r.named = true; break; }
      case "room.setSection": { need("structure.edit"); const r = state.rooms[a.room]; if (!r) throw new Error("Pièce inconnue."); if (a.section && !state.sections[a.section]) throw new Error("Section inconnue."); r.section = a.section || null; r.sectionSet = true; break; }
      case "deck.rename": { need("structure.edit"); const d = state.decks.find(x => x.id === a.deck); if (!d) throw new Error("Pont inconnu."); d.name = clean(a.name, 40) || d.name; d.named = true; break; }
      case "section.save": {
        need("structure.edit");
        const id = a.id && state.sections[a.id] ? a.id : "s" + (state.seq++);
        const old = state.sections[id];
        state.sections[id] = { id, name: clean(a.name, 40) || id, named: true, ejectable: !!a.ejectable, state: old ? old.state : "attached", fromMod: old ? old.fromMod : false };
        if (a.rooms) for (const r of Object.values(state.rooms)) { if (a.rooms.includes(r.id)) { r.section = id; r.sectionSet = true; } else if (r.section === id) { r.section = null; r.sectionSet = true; } }
        L(`enregistre la section « ${state.sections[id].name} »${a.ejectable ? " (éjectable)" : ""}.`, "struct"); break;
      }
      case "terminal.save": { need("structure.edit"); const t = state.terminals[a.id]; if (!t) throw new Error("Terminal inconnu."); if (a.name) { t.name = clean(a.name, 40); t.named = true; } if (a.pages) t.pages = a.pages.filter(p => PAGES[p] && !ADMIN_PAGES.includes(p)); L(`configure le terminal ${t.name}.`, "struct"); break; }
      case "perms.set": {
        need("perms.edit"); if (!ACTIONS[a.action]) throw new Error("Action inconnue.");
        const v = Math.max(0, Math.min(7, a.level | 0));
        if (!actor.admin && (v > levelOf(actor) || state.perms[a.action] > levelOf(actor))) throw new Error("Impossible de régler un niveau au-dessus du vôtre.");
        state.perms[a.action] = v; L(`« ${ACTIONS[a.action][0]} » exige désormais le niveau ${v}.`, "struct"); break;
      }
      /* Alertes */
      case "alarm.general": {
        need("alarm.general");
        const lv = a.level != null && PA_LEVELS[String(a.level)] ? String(a.level) : null;
        state.ship.alert = lv;
        if (!state.pa) state.pa = paEmpty();
        state.pa.alert = lv ? { level: lv, target: cleanTarget(a.target), since: now, by: actor.name } : null;
        cmds.push({ type: "alarm.set", room: null, on: !!lv, level: lv });
        cmds.push(paStateCmd(state));
        L(lv ? `déclare l’alerte de ${PA_LEVELS[lv][0].toLowerCase()} (${paTargetLabel(state, state.pa.alert.target)}).` : "lève l’alerte générale.", "alarm");
        break;
      }
      case "pa.play": {
        need("pa.play");
        const snd = PA_SOUNDS[a.sound] ? a.sound : null; if (!snd) throw new Error("Signal inconnu.");
        const t = cleanTarget(a.target);
        cmds.push({ type: "pa.play", sound: snd, speakers: paTargets(state, t) });
        L(`diffuse « ${PA_SOUNDS[snd]} » (${paTargetLabel(state, t)}).`, "alarm");
        break;
      }
      case "admin.pa.meta": case "admin.pa.msg.save": case "admin.pa.msg.delete": case "admin.pa.mic": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const pa = state.pa || (state.pa = paEmpty());
        if (a.type === "admin.pa.meta") {
          const ids = (Array.isArray(a.ids) ? a.ids : []).map(x => clean(x, 24)).filter(Boolean).slice(0, 1000);
          for (const id of ids) { const m = pa.meta[id] || (pa.meta[id] = {}); if (a.name !== undefined) m.name = clean(a.name, 40); if (a.group !== undefined) m.group = clean(a.group, 40); if (a.enabled !== undefined) m.enabled = !!a.enabled; }
          if (a.groupEnable !== undefined && a.group) for (const id of Object.keys(pa.list)) { if ((pa.meta[id] || {}).group === a.group) (pa.meta[id] || (pa.meta[id] = {})).enabled = !!a.groupEnable; }
          if (a.allEnable !== undefined) for (const id of Object.keys(pa.list)) (pa.meta[id] || (pa.meta[id] = {})).enabled = !!a.allEnable;
        } else if (a.type === "admin.pa.mic") {
          const id = clean(a.id, 24); (pa.meta[id] || (pa.meta[id] = {})).target = cleanTarget(a.target);
          if (a.name !== undefined) pa.meta[id].name = clean(a.name, 40);
        } else if (a.type === "admin.pa.msg.save") {
          const lv = PA_LEVELS[String(a.level)] ? String(a.level) : null; if (!lv) throw new Error("Niveau d’alerte inconnu.");
          if (!a.audio) throw new Error("Aucun enregistrement.");
          pa.msgs[lv] = { audio: clean(a.audio, 40), name: clean(a.name || "Message", 60), interval: Math.max(10, Math.min(600, a.interval | 0 || 30)), dur: Math.max(0, +a.dur || 0), at: now };
          L(`enregistre le message du niveau ${lv} (toutes les ${pa.msgs[lv].interval} s).`, "admin");
        } else {
          const lv = String(a.level); delete pa.msgs[lv]; L(`supprime le message du niveau ${lv}.`, "admin");
        }
        cmds.push(paStateCmd(state));
        break;
      }
      case "alarm.ack": { need("alarm.ack"); if (!state.acks.includes(a.key)) state.acks.push(a.key); if (a.key.startsWith("dead:") && state.people[a.key.slice(5)]) state.people[a.key.slice(5)].vitals.reported = true; L(`acquitte une alarme.`, "alarm"); break; }
      case "announce": { need("announce"); const text = clean(a.text, 280); if (!text) throw new Error("Annonce vide."); cmds.push({ type: "announce", text, from: who }); L(`annonce : « ${text} »`, "announce"); break; }
      /* Procédures */
      case "proc.eject.start": {
        need("proc.eject"); const s = state.sections[a.section];
        if (!s) throw new Error("Section inconnue."); if (!s.ejectable) throw new Error("Cette section n’est pas éjectable."); if (s.state !== "attached") throw new Error("Section déjà éjectée.");
        if (state.procs.some(p => p.target === s.id && (p.status === "wait" || p.status === "countdown"))) throw new Error("Une procédure est déjà en cours sur cette section.");
        state.procs.unshift({ id: "pr" + (state.seq++), type: "eject", target: s.id, codes: [{ id: actor.id, name: who, t: now }], need: 2, status: "wait", createdAt: now, endsAt: null });
        L(`saisit le code 1 pour l’éjection de ${s.name}.`, "crit"); break;
      }
      case "proc.confirm": {
        need("proc.eject"); const p = state.procs.find(x => x.id === a.id); if (!p || p.status !== "wait") throw new Error("Procédure introuvable ou close.");
        if (p.codes.some(c => c.id === actor.id)) throw new Error("Le second code doit venir d’une autre personne.");
        p.codes.push({ id: actor.id, name: who, t: now });
        if (p.codes.length >= p.need) { p.status = "countdown"; p.endsAt = now + EJECT_COUNTDOWN_MS; cmds.push({ type: "countdown", target: p.target, ms: EJECT_COUNTDOWN_MS }); }
        L(`saisit le code ${p.codes.length} pour l’éjection de ${state.sections[p.target].name}.${p.status === "countdown" ? " Compte à rebours lancé." : ""}`, "crit"); break;
      }
      case "proc.cancel": {
        const p = state.procs.find(x => x.id === a.id); if (!p || (p.status !== "wait" && p.status !== "countdown")) throw new Error("Procédure introuvable ou close.");
        if (!p.codes.some(c => c.id === actor.id)) need("proc.eject");
        p.status = "cancelled"; p.endsAt = null; cmds.push({ type: "countdown.cancel", target: p.target });
        L(`annule l’éjection de ${state.sections[p.target].name}.`, "crit"); break;
      }
      /* Équipage */
      case "crew.assign": {
        need("crew.assign"); const p = person(a.person), f = a.fields || {};
        if (!actor.admin && p.id !== actor.id && levelOf(p) >= levelOf(actor)) throw new Error("Vous ne pouvez pas modifier un supérieur ou un égal.");
        if (f.level !== undefined) { const lv = Math.max(0, Math.min(7, f.level | 0)); if (!actor.admin && (lv >= levelOf(actor) || p.id === actor.id)) throw new Error("Niveau au-delà de vos droits."); p.level = lv; }
        for (const k of ["rank", "job", "role", "group", "team"]) if (f[k] !== undefined) p[k] = clean(f[k], 40);
        if (f.tags) p.tags = f.tags.map(t => clean(t, 20)).filter(Boolean);
        if (f.name) p.name = clean(f.name, 32);
        L(`affecte ${p.name} : niv. ${p.level}, ${p.job || p.role || "sans poste"}${p.team && p.team !== "aucune" ? ", équipe de " + p.team : ""}.`, "crew"); break;
      }
      case "crew.remove": { need("crew.assign"); const p = person(a.person); if (!actor.admin && levelOf(p) >= levelOf(actor)) throw new Error("Vous ne pouvez pas retirer un supérieur."); delete state.people[p.id]; for (const d of Object.values(state.doors)) { d.managers = d.managers.filter(x => x !== p.id); d.grants = d.grants.filter(x => x !== p.id); } L(`retire ${p.name} du registre.`, "crew"); break; }
      /* Admin */
      case "admin.fault": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const f = FAULT_INDEX[a.key]; if (!f) throw new Error("Avarie inconnue.");
        const target = a.target || { kind: "ship" };
        const fault = { id: "f" + (state.seq++), key: f.key, target, silent: !!a.silent, active: true, t: now };
        state.faults.unshift(fault); faultEffect(state, fault, true);
        cmds.push({ type: "fault", id: fault.id, key: f.key, target, on: true, silent: fault.silent });
        log(state, "ORDINATEUR", `avarie « ${f.name} »${targetName(state, target)}${fault.silent ? " (silencieuse)" : ""}.`, "admin", now); break;
      }
      case "admin.clearFault": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const fault = state.faults.find(x => x.id === a.id); if (!fault) throw new Error("Avarie inconnue.");
        fault.active = false; faultEffect(state, fault, false); cmds.push({ type: "fault", id: fault.id, key: fault.key, target: fault.target, on: false });
        log(state, "ORDINATEUR", `avarie « ${FAULT_INDEX[fault.key]?.name} » résolue.`, "admin", now); break;
      }
      case "admin.computer": { if (!actor.admin) throw new Error("Réservé au poste admin."); state.computer.refuse = !!a.refuse; state.computer.message = clean(a.message, 140); log(state, "ORDINATEUR", a.refuse ? "refuse désormais les commandes de l’équipage." : "obéit de nouveau à l’équipage.", "admin", now); break; }
      case "admin.setAdmin": { if (!actor.admin) throw new Error("Réservé au poste admin."); const p = person(a.person); p.admin = !!a.on; log(state, "ORDINATEUR", `${p.name} ${a.on ? "reçoit" : "perd"} l’accès admin.`, "admin", now); break; }
      case "admin.env": { if (!actor.admin) throw new Error("Réservé au poste admin."); const r = room(a.room); cmds.push({ type: "env.set", room: r.id, env: a.env }); Object.assign(r.env, a.env); log(state, "ORDINATEUR", `force l’environnement de ${r.name}.`, "admin", now); break; }

function faultEffect(state, f, on) {

  const d = f.target && f.target.kind === "door" ? state.doors[f.target.id] : null;
  if (r) {

    if (f.key === "hull.breach" || f.key === "ring.hull") r.flags.breach = on;
    if (f.key === "power.surge" || f.key === "power.breaker") r.env.power = !on;
    if (f.key === "alarm.false" && !f.silent) r.flags.alarm = on;
  }

  if (d && f.key === "airlock.open") { d.state.open = on; d.state.locked = false; }
}
function targetName(state, t) {
  if (!t || t.kind === "ship") return " sur tout le vaisseau";
  const o = t.kind === "room" ? state.rooms[t.id] : t.kind === "door" ? state.doors[t.id] : state.sections[t.id];

/* Simulateur d'environnement : sert la démo et les tests sans mod.
   En production, c'est le mod qui calcule la physique et envoie la télémétrie. */
function simulate(S, dt, now = Date.now()) {
  navSimulate(S, now);
  const valveOpen = (rid, kind) => { const v = Object.values(S.valves).filter(x => x.room === rid && x.kind === kind); return v.length ? v.some(x => x.open) : kind === "o2"; };
  for (const r of Object.values(S.rooms)) {
    const e = r.env, gone = roomStatus(S, r) === "gone";
    if (gone) { e.p = 0; e.o2 = 0; e.t = -120; continue; }
    const vent = r.mode === "vent" || valveOpen(r.id, "vent"), o2 = valveOpen(r.id, "o2");
    if (vent) e.p = Math.max(0, e.p - 9 * dt);
    else if (r.flags.breach) e.p = Math.max(0, e.p - 0.5 * dt);
    else if (r.mode === "pressurize") e.p = Math.min(101.3, e.p + 7 * dt);
    else if (o2 && e.p < 101.3) e.p = Math.min(101.3, e.p + 0.25 * dt);
    if (r.flags.fire && e.p > 30) { e.o2 = Math.max(9, e.o2 - 0.04 * dt); e.t = Math.min(85, e.t + 0.3 * dt); e.co2 = Math.min(4, e.co2 + 0.01 * dt); }
    else if (o2 && e.p > 40) { e.o2 += (20.9 - e.o2) * 0.03 * dt; e.co2 += (0.04 - e.co2) * 0.03 * dt; }
    else e.o2 = Math.max(0, e.o2 - 0.03 * dt);
    if (e.p < 2) e.o2 = 0;
    const tt = (r.flags.breach || e.p < 20) ? -30 : r.flags.fire ? e.t : 21;
    e.t += (tt - e.t) * 0.01 * dt;
    if (r.mode === "pressurize" && e.p >= 101) r.mode = null;
    if (r.mode === "vent" && e.p <= 0.5) r.mode = null;
  }
  for (const p of Object.values(S.people)) {
    if (!p.vitals || p.vitals.alive === false || !p.room || !S.rooms[p.room]) continue;
    const r = S.rooms[p.room], e = r.env, v = p.vitals, gone = roomStatus(S, r) === "gone";
    const bad = gone || e.p < 45 || e.o2 < 13;
    v.o2 = bad ? Math.max(0, v.o2 - 6 * dt) : Math.min(100, v.o2 + 4 * dt);
    if (v.o2 <= 0 || r.flags.fire) v.hp = Math.max(0, v.hp - (gone ? 20 : 0.25) * dt);
    if (v.hp <= 0) { v.alive = false; log(S, "SYSTÈME", `Signal vital perdu : ${p.name} (${r.name}).`, "crit", now); }
  }
}

/* Horloge : comptes à rebours des procédures. */
function tick(state, now = Date.now()) {
  const cmds = [];
  for (const p of state.procs) {
    if (p.status === "countdown" && p.endsAt <= now) {
      const s = state.sections[p.target];
      p.status = "done"; s.state = "ejected";
      const rooms = Object.values(state.rooms).filter(r => r.section === s.id);
      const aboard = Object.values(state.people).filter(x => rooms.some(r => r.id === x.room));
      cmds.push({ type: "section.eject", section: s.id, rooms: rooms.map(r => r.id) });
      log(state, "ORDINATEUR", `Section ${s.name} éjectée${aboard.length ? " avec " + aboard.length + " personne(s) à bord" : ""}.`, "crit", now);
    }
  }
  if (state.procs.length > 30) state.procs.length = 30;

/* Vue filtrée pour une session donnée. */
function viewFor(state, actor, term) {
  const v = clone(state);
  const adm = !!(actor && actor.admin);
  const perms = Object.fromEntries(Object.keys(ACTIONS).map(k => [k, can(state, actor, k, term)]));
  const termPages = term && state.terminals[term] ? state.terminals[term].pages : Object.keys(PAGES);
  let pages = Object.keys(PAGES).filter(p => adm || (termPages.includes(p) && !ADMIN_PAGES.includes(p)));
  if (!adm && !perms["structure.edit"] && !perms["perms.edit"]) pages = pages.filter(p => p !== "structure");
  if (!adm && !perms["alarm.general"] && !perms["pa.play"]) pages = pages.filter(p => p !== "pa");
  v.alerts = computeAlerts(state, adm);
  if (!adm) {
    v.faults = []; v.computer = { refuse: state.computer.refuse, message: state.computer.refuse ? state.computer.message : "" };
    for (const sf of state.faults) if (sf.active && sf.silent && sf.key === "sensor.lie" && sf.target.kind === "room" && v.rooms[sf.target.id]) Object.assign(v.rooms[sf.target.id].env, { p: 101.3, o2: 20.9, t: 21 });
    if (!perms["crew.vitals"]) for (const p of Object.values(v.people)) { if (p.id !== (actor && actor.id)) { p.vitals = null; p.room = null; } }
    for (const p of Object.values(v.people)) if (p.id !== (actor && actor.id)) delete p.joined;
    if (v.nav) for (const sys of v.nav.catalog.systems || []) {
      for (const pl of sys.planets || []) { pl.info = (pl.info || []).filter(i => i.show !== false); delete pl.env; }
      sys.fields = (sys.fields || []).filter(f => f.show !== false);
    }
    delete v.screens;
  }
  v.me = actor ? {
    id: actor.id, name: actor.name, level: actor.level | 0, admin: adm, role: actor.role, job: actor.job, rank: actor.rank, group: actor.group, team: actor.team,
    perms, pages, term: term || null,

    manages: Object.values(state.doors).filter(d => (d.managers || []).includes(actor.id)).map(d => d.id)
  } : null;
  return v;
}

function makeRemote(token) {

  const open = async () => {
    try { const chk = await fetch(API + "/api/state?t=" + encodeURIComponent(token) + SCREEN_Q); if (chk.status === 401 || chk.status === 403) { const j = await chk.json().catch(() => ({})); try { sessionStorage.removeItem("meridian.t"); } catch {} document.getElementById("app").innerHTML = `<div class="gate" style="grid-column:1/-1;grid-row:1/-1"><div><div class="brand">MERIDIAN</div><p class="red" style="margin-top:18px;letter-spacing:.12em">ACCÈS REFUSÉ</p><p class="mu">${esc(j.error || "Session invalide.")}</p></div></div>`; return; } } catch {}

    g += `<text x="${C - 100}" y="${y + bh / 2 + 4}" fill="var(--tx)" font-size="11" font-weight="600" pointer-events="none" font-family="IBM Plex Mono,monospace">${esc(d.id)}</text><text x="${C - 72}" y="${y + bh / 2 + 4}" fill="var(--tx)" font-size="11" pointer-events="none">${esc(d.name.length > 26 ? d.name.slice(0, 25) + "…" : d.name)}</text>`;

  if (!V.decks.length) g += `<text x="${C}" y="${C}" fill="var(--mu)" text-anchor="middle" font-size="13">Aucune structure reçue</text>`;
  return `<svg viewBox="0 0 600 600" role="img" aria-label="Schéma du vaisseau : ponts au centre, anneaux autour">${g}</svg>`;
}

/* ---------------------------- Plan d'un pont ---------------------------- */
function deckPlan(did) {
  const list = roomsOf(did), deck = V.decks.find(d => d.id === did);
  // Coque réelle à la hauteur de ce pont, si le scan la couvre.
  const hullUrl = HULL && deck && deck.kind !== "ring" && deck.y0 != null && !String(deck.id).includes("/") ? hullDeckUrl(deck.y0, deck.y1) : null;
  if (!list.length && !hullUrl) return `<p class="empty">Aucune pièce sur ce pont.</p>`;
  const P = HULL ? hullP : (x, z) => [x, z];
  const R = ([a, b, c, d]) => { const p = P(a, b), q = P(c, d); return [Math.min(p[0], q[0]), Math.min(p[1], q[1]), Math.max(p[0], q[0]), Math.max(p[1], q[1])]; };
  let x0 = 1e9, z0 = 1e9, x1 = -1e9, z1 = -1e9;
  list.forEach(r => r.rects.forEach(q => { const [a, b, c, d] = R(q); x0 = Math.min(x0, a); z0 = Math.min(z0, b); x1 = Math.max(x1, c); z1 = Math.max(z1, d); }));
  if (hullUrl) { const B = hullBox(); x0 = Math.min(x0, B.u0); z0 = Math.min(z0, B.v0); x1 = Math.max(x1, B.u1); z1 = Math.max(z1, B.v1); }
  const W = x1 - x0, H = z1 - z0, pad = Math.max(10, W * 0.04), fs = Math.max(4, Math.min(W, H * 3) / 70);
  let g = "";
  if (hullUrl) g += hullImage(hullUrl, ` opacity=".9"`);
  else if (deck && deck.kind !== "ring") {
    const m = pad * 0.5;
    g += `<path d="M${x0 - m} ${z0 - m}L${x1 + m} ${z0 - m}L${x1 + pad * 1.8} ${(z0 + z1) / 2}L${x1 + m} ${z1 + m}L${x0 - m} ${z1 + m}L${x0 - m - pad * .4} ${z1 - H * .2}L${x0 - m - pad * .4} ${z0 + H * .2}Z" fill="rgba(98,230,242,.025)" stroke="var(--cy2)" stroke-width="${fs * .25}"/>`;
  }
  for (const r of list) {
    const s = rs(r), sel = ui.room === r.id, cor = r.kind === "corridor";
    for (const q of r.rects) { const [a, b, c, d] = R(q); g += `<rect class="hit" data-room="${esc(r.id)}" x="${a}" y="${b}" width="${c - a}" height="${d - b}" fill="${COL[s]}" fill-opacity="${cor ? .06 : s === "ok" ? .14 : s === "gone" ? .05 : .45}" stroke="${sel ? "#fff" : COL[s]}" stroke-opacity="${sel ? 1 : .7}" stroke-width="${(sel ? .5 : .25) * fs}"><title>${esc(r.name)} · ${ST[s]}</title></rect>`; }
    const big = r.rects.length ? R(r.rects.reduce((m, q) => (Math.abs(q[2] - q[0]) * Math.abs(q[3] - q[1]) > Math.abs(m[2] - m[0]) * Math.abs(m[3] - m[1]) ? q : m), r.rects[0])) : null;
    if (big && !cor) {
      const w = big[2] - big[0], h = big[3] - big[1], cx = (big[0] + big[2]) / 2, cz = (big[1] + big[3]) / 2;
      const vert = h > w * 1.6, max = Math.floor((vert ? h : w) / (fs * .58));
      const label = r.name.length > max ? r.name.slice(0, Math.max(3, max - 1)) + "…" : r.name;
      g += `<text x="${cx}" y="${cz}" fill="var(--tx)" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" pointer-events="none"${vert ? ` transform="rotate(-90 ${cx} ${cz})"` : ""}>${esc(label)}</text>`;
      if (perm("crew.vitals")) { const o = occupants(r.id); o.slice(0, 6).forEach((p, i) => { const dead = p.vitals && p.vitals.alive === false; g += `<circle cx="${cx - (o.length - 1) * fs * .45 + i * fs * .9}" cy="${cz + fs * 1.3}" r="${fs * .28}" fill="${dead ? "var(--red)" : hpCls(p.vitals) ? "var(--amb)" : "var(--ok)"}" pointer-events="none"/>`; }); }
    }
  }
  for (const d of Object.values(V.doors).filter(x => x.deck === did)) {
    const c = d.state.lockdown ? "var(--red)" : d.state.locked ? "var(--amb)" : d.state.open ? "var(--cy)" : "var(--mu)", sz = fs * .9, sel = ui.door === d.id, [dx, dz] = P(d.x, d.z);
    g += `<rect class="hit" data-door="${esc(d.id)}" x="${dx - sz / 2}" y="${dz - sz / 2}" width="${sz}" height="${sz}" fill="${d.state.open ? c : "var(--bg)"}" stroke="${sel ? "#fff" : c}" stroke-width="${fs * .18}"><title>Porte ${esc(d.id)} · ${esc(d.name)}</title></rect>`;
    g += `<text x="${dx}" y="${dz - sz * .9}" fill="${c}" font-size="${fs * .62}" text-anchor="middle" font-family="IBM Plex Mono,monospace" pointer-events="none">${esc(d.id)}</text>`;
  }
  const extra = deck && deck.kind !== "ring" && !hullUrl ? pad * 2.2 : pad;
  return `<svg viewBox="${x0 - pad} ${z0 - pad} ${W + pad + extra} ${H + pad * 2}" role="img" aria-label="Plan de ${esc(deck ? deck.name : did)}">${g}</svg>`;
}

/* ---------------------------- Détails ---------------------------- */
function envCls(k, v) {
  if (v == null) return "";
  if (k === "p") return v < 60 ? "crit" : v < 90 ? "warn" : "";
  if (k === "o2") return v < 15 ? "crit" : v < 18 ? "warn" : "";
  if (k === "co2") return v > 2 ? "crit" : v > 1 ? "warn" : "";
  if (k === "t") return v < -5 || v > 50 ? "crit" : v < 5 || v > 35 ? "warn" : "";
  if (k === "g") return v > 1.6 || v < .2 ? "warn" : "";
  return "";
}

/* ---------------------------- Équipage ---------------------------- */
PAGE.crew = () => {
  const vit = perm("crew.vitals");
  const F = { all: () => true, on: p => p.online, new: p => !p.level, lost: p => p.vitals && p.vitals.alive === false, hurt: p => p.vitals && p.vitals.alive !== false && hpCls(p.vitals) };
  const q = (ui.q.crew || "").toLowerCase();
  const list = people().filter(F[ui.crewF]).filter(p => !q || (p.name + " " + p.job + " " + p.role + " " + p.group).toLowerCase().includes(q)).sort((a, b) => (b.level - a.level) || a.name.localeCompare(b.name));
  const tabs = [["all", "Tous"], ["on", "En ligne"], ["new", "Non assignés"], ["hurt", "Blessés"], ["lost", "Signal perdu"]].filter(([k]) => vit || k === "all" || k === "on" || k === "new").map(([k, l]) => `<button class="tab" data-fn="crewF" data-arg="${k}" aria-pressed="${ui.crewF === k}">${l} · ${people().filter(F[k]).length}</button>`).join("");
  const rows = list.map(p => `<tr data-person="${esc(p.id)}" class="${ui.person === p.id ? "sel" : ""}"><td><b style="font-weight:600">${esc(p.name)}</b>${!p.level ? ` <span class="pill amb">à affecter</span>` : ""}<div class="mu" style="font-size:12px">${esc([p.rank, p.job || p.role].filter(Boolean).join(" · ") || "—")}</div></td><td class="m">${p.level}</td><td>${esc(p.group || "—")}</td><td>${esc(p.team === "aucune" ? "—" : p.team)}</td>${vit ? `<td>${p.vitals ? `<span class="hp ${hpCls(p.vitals)}"><i style="width:${p.vitals.alive === false ? 0 : (p.vitals.hp / (p.vitals.maxHp || 20) * 100)}%"></i></span>` : "—"}</td><td>${vitalState(p)}</td><td style="font-size:12.5px">${esc(roomName(p.room))}</td>` : ""}<td>${p.online ? `<span class="st ok">En ligne</span>` : `<span class="st gone">Hors ligne</span>`}</td></tr>`).join("");
  return `<div class="grid g-2">${panel("Registre du personnel", "CREW." + people().length, `<div class="tabs">${tabs}</div><div class="toolbar"><input type="search" id="q-crew" data-fn="q" data-arg="crew" placeholder="Rechercher un nom, un métier, un groupe" aria-label="Rechercher une personne"></div><div class="tbl"><table><thead><tr><th>Personne</th><th>Niv.</th><th>Groupe</th><th>Équipe</th>${vit ? "<th>Santé</th><th>État</th><th>Position</th>" : ""}<th>Liaison</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="empty">Personne.</td></tr>`}</tbody></table></div><p class="note">Le mod demande son nom à chaque joueur à la première connexion. Il apparaît ici « à affecter » jusqu’à ce qu’un responsable lui donne son grade, son métier et son niveau.</p>`)}${personPanel(ui.person)}</div>`;
};
function personPanel(pid) {
  const p = V.people[pid];
  if (!p || p.admin) return panel("Fiche", "—", `<p class="empty">Sélectionnez une personne.</p>`);
  const v = p.vitals, vit = perm("crew.vitals") || p.id === V.me.id;
  let b = `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="big" style="font-size:22px">${esc(p.name)}</span><span class="lvl">${p.level}</span></div>`;
  b += kv("Grade", esc(p.rank || "—")) + kv("Métier", esc(p.job || "—")) + kv("Rôle à bord", esc(p.role || "—")) + kv("Groupe", esc(p.group || "—")) + kv("Équipe", esc(p.team || "—")) + ((p.tags || []).length ? kv("Étiquettes", p.tags.map(t => "#" + esc(t)).join(" ")) : "");
  if (vit && v) {
    const pct = v.alive === false ? 0 : v.hp / (v.maxHp || 20) * 100;
    b += `<div class="lbl">Constantes</div><div class="gauge"><div><span>Santé</span><b class="${hpCls(v)}">${v.alive === false ? "0" : n0(v.hp)}</b><small class="mu"> / ${v.maxHp || 20}</small>${bar(pct, hpCls(v))}</div><div><span>Faim</span><b>${n0(v.food)}</b><small class="mu"> / 20</small>${bar((v.food || 0) / 20 * 100)}</div><div><span>Réserve O₂</span><b class="${v.o2 < 30 ? "crit" : v.o2 < 60 ? "warn" : ""}">${n0(v.o2)}</b><small class="mu"> %</small>${bar(v.o2 || 0, v.o2 < 30 ? "crit" : v.o2 < 60 ? "warn" : "")}</div><div><span>Temp. corps</span><b class="${v.temp < 35 || v.temp > 39 ? "warn" : ""}">${n1(v.temp)}</b><small class="mu"> °C</small></div></div>`;
    b += kv("État", vitalState(p)) + kv("Position", p.room ? `<a data-room="${esc(p.room)}" data-go="plan" style="cursor:pointer" class="cy">${esc(roomName(p.room))}</a>` : "—");
  } else if (!vit) b += `<p class="note">Constantes et position réservées (niv. ${need("crew.vitals")}).</p>`;
  const nd = Object.values(V.doors).filter(d => MC.canOpenDoor(V, p, d).ok).length;
  b += kv("Portes accessibles", `${nd} / ${Object.keys(V.doors).length}`);
  b += `<div class="btns" style="margin-top:14px">${btn("Affecter", null, { perm: "crew.assign", fn: "assign", arg: p.id, cls: p.level ? "" : "solid" })}${btn("Retirer du registre", { type: "crew.remove", person: p.id }, { perm: "crew.assign", cls: "red sm", confirm: `Retirer ${p.name} du registre ? Ses autorisations seront supprimées.` })}${V.me.admin ? btn(p.admin ? "Retirer admin" : "Donner l’accès admin", { type: "admin.setAdmin", person: p.id, on: !p.admin }, { cls: "ghost sm" }) : ""}</div>`;
  return panel("Fiche personnel", p.id.slice(0, 12).toUpperCase(), b);
}

/* ---------------------------- Procédures ---------------------------- */
PAGE.procs = () => {
  const active = V.procs.filter(p => p.status === "wait" || p.status === "countdown");
  const secs = Object.values(V.sections);
  const act1 = active.map(p => {
    const s = V.sections[p.target], rooms = Object.values(V.rooms).filter(r => r.section === p.target), occ = people().filter(x => rooms.some(r => r.id === x.room));
    const mine = p.codes.some(c => c.id === V.me.id);
    return panel("Éjection · " + (s ? s.name : p.target), p.id.toUpperCase(), `${p.status === "countdown" ? `<div class="lbl">Compte à rebours</div><div class="cd">T-<span data-cd="${p.endsAt}">--</span></div>` : `<p class="amb" style="letter-spacing:.1em;font-weight:600">EN ATTENTE DU CODE ${p.codes.length + 1}</p>`}
<div class="codes">${Array.from({ length: p.need }, (_, i) => p.codes[i] ? `<div class="code ok">CODE ${i + 1} · ${esc(p.codes[i].name)}<br><span style="font-size:11px">${fmtT(p.codes[i].t)} · validé</span></div>` : `<div class="code">CODE ${i + 1}<br><span class="dim" style="font-size:11px">niv. ${need("proc.eject")} requis, autre personne</span></div>`).join("")}</div>
${kv("Pièces concernées", esc(rooms.map(r => r.name).join(", ") || "—"))}${perm("crew.vitals") ? kv("Personnes présentes", `<span class="${occ.length ? "red" : "okc"}">${occ.length}${occ.length ? " · " + esc(occ.map(x => x.name).join(", ")) : ""}</span>`) : ""}
<div class="btns" style="margin-top:12px">${p.status === "wait" ? btn("Saisir mon code", { type: "proc.confirm", id: p.id }, { perm: "proc.eject", cls: "red", disabled: mine, title: mine ? "Votre code est déjà saisi" : "", confirm: `Valider votre code pour éjecter ${s ? s.name : ""} ?` }) : ""}${btn("Annuler la procédure", { type: "proc.cancel", id: p.id }, { cls: "amb" })}</div>
${DEMO && p.status === "wait" ? `<p class="note">Démo : changez de puce en haut de page pour saisir le second code.</p>` : ""}`);
  }).join("");
  const rows = secs.map(s => { const rooms = Object.values(V.rooms).filter(r => r.section === s.id), occ = people().filter(x => rooms.some(r => r.id === x.room)), busy = active.some(p => p.target === s.id); return `<tr data-fn="sec" data-arg="${esc(s.id)}"><td>${esc(s.name)}</td><td>${s.state === "ejected" ? `<span class="st gone">Éjectée</span>` : `<span class="st ok">Arrimée</span>`}</td><td class="m">${rooms.length}</td><td class="m ${occ.length ? "amb" : ""}">${perm("crew.vitals") ? occ.length : "—"}</td><td>${s.ejectable && s.state !== "ejected" ? btn("Code 1", { type: "proc.eject.start", section: s.id }, { perm: "proc.eject", cls: "red sm", disabled: busy, confirm: `Lancer l’éjection de ${s.name} ? Un second officier devra confirmer, puis un compte à rebours de ${MC.EJECT_COUNTDOWN_MS / 1000} s démarrera.` }) : `<span class="dim">${s.ejectable ? "—" : "non éjectable"}</span>`}</td></tr>`; }).join("");
  return `<div class="grid g-2"><div class="stack">${panel("Sections du vaisseau", "SEC." + secs.length, `<div class="tbl"><table><thead><tr><th>Section</th><th>État</th><th>Pièces</th><th>Présents</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="empty">Aucune section définie.</td></tr>`}</tbody></table></div><p class="note">Éjecter une section exige deux codes de deux personnes différentes de niveau ${need("proc.eject")} ou plus, puis un compte à rebours de ${MC.EJECT_COUNTDOWN_MS / 1000} s annulable.</p>`)}</div><div class="stack">${act1 || panel("Procédure en cours", "PRC", `<p class="empty">Aucune procédure en cours.</p>`)}</div></div>`;
};

PAGE.admin = () => {
  if (!V.me.admin) return panel("Ordinateur de bord", "ADM", `<p class="empty">Réservé au poste admin.</p>`);
  const targets = (kind) => kind === "room" ? Object.values(V.rooms).filter(r => r.kind !== "corridor" && rs(r) !== "gone").map(r => [r.id, r.deck + " · " + r.name]) : kind === "door" ? Object.values(V.doors).map(d => [d.id, "Porte " + d.id + " · " + d.name]) : kind === "section" ? Object.values(V.sections).map(s => [s.id, s.name]) : [];
  const cats = MC.FAULTS.map(([cat, list]) => `<div class="lbl">${esc(cat)}</div>` + list.map(([k, name, tk, eff]) => {
    const opts = targets(tk);
