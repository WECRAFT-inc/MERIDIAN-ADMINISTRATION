            Object.assign(s, { name: clean(x.name, 60) || s.name || s.id, x: num(x.x, s.x || 0), y: num(x.y, s.y || 0), star: clean(x.star, 60), color: /^#[0-9a-f]{6}$/i.test(x.color || "") ? x.color : (s.color || "#ffd080"), description: clean(x.description, 400) });
            log(state, "ORDINATEUR", `enregistre le système ${s.name}.`, "admin", now); break;
          }
          case "admin.nav.system.delete": {
            if (a.id === state.nav.system) throw new Error("Impossible de supprimer le système où se trouve le vaisseau.");
            const s = sysOf(a.id); cat.systems = cat.systems.filter(x => x !== s); if (cat.start === s.id) cat.start = state.nav.system;
            log(state, "ORDINATEUR", `supprime le système ${s.name}.`, "admin", now); break;
          }
          case "admin.nav.planet.save": {
            const s = sysOf(a.system); const old = (a.planet && a.planet.id) ? s.planets.find(p => p.id === a.planet.id) : null;
            const p = cleanPlanet(a.planet || {}, old);
            if (!old && cat.systems.some(sy => sy.planets.some(q => q.id === p.id))) throw new Error("Identifiant de planète déjà utilisé.");
            if (old) s.planets[s.planets.indexOf(old)] = p; else s.planets.push(p);
            log(state, "ORDINATEUR", `enregistre la planète ${p.name} (${s.name}).`, "admin", now); break;
          }
          case "admin.nav.planet.delete": { const s = sysOf(a.system); s.planets = s.planets.filter(p => p.id !== a.id); log(state, "ORDINATEUR", `retire une planète de ${s.name}.`, "admin", now); break; }
          case "admin.nav.field.save": {
            const s = sysOf(a.system), f = a.field || {}; const old = f.id && s.fields.find(x => x.id === f.id);
            const n = { id: old ? old.id : "f" + (state.seq++), name: clean(f.name, 60) || "Champ de météorites", pos: [num((f.pos || [])[0], 0), num((f.pos || [])[1], 0)],
              radius: Math.max(10, num(f.radius, 200)), density: ["faible", "moyenne", "forte"].includes(f.density) ? f.density : "moyenne", show: f.show !== false };
            if (old) s.fields[s.fields.indexOf(old)] = n; else s.fields.push(n);
            log(state, "ORDINATEUR", `enregistre le champ « ${n.name} » (${s.name}).`, "admin", now); break;
          }
          case "admin.nav.field.delete": { const s = sysOf(a.system); s.fields = s.fields.filter(f => f.id !== a.id); break; }
          case "admin.nav.rules": {
            const j = cat.jump || (cat.jump = {});
            for (const k of ["maxLy", "fuelPerLy", "baseSeconds", "secondsPerLy", "maxSeconds"]) if (a[k] !== undefined && isFinite(+a[k])) j[k] = Math.max(0, +a[k]);
            if (a.ship) cat.ship = { x: num(a.ship.x, 0), y: num(a.ship.y, 100), z: num(a.ship.z, 0) };
            log(state, "ORDINATEUR", "modifie les règles de saut.", "admin", now); break;
          }
          case "admin.nav.catalog": {
            const c = typeof a.catalog === "string" ? JSON.parse(a.catalog) : a.catalog;
            if (!c || !Array.isArray(c.systems) || !c.systems.length) throw new Error("Catalogue invalide.");
            c.systems.forEach(sy => { sy.planets = (sy.planets || []).map(p => cleanPlanet(p)); sy.fields = sy.fields || []; });
            state.nav.catalog = c; log(state, "ORDINATEUR", `importe un catalogue de ${c.systems.length} systèmes.`, "admin", now); break;
          }
          case "admin.nav.reset": state.nav.catalog = clone(NAV_JSON); log(state, "ORDINATEUR", "recharge le catalogue de navigation par défaut.", "admin", now); break;
        }
        cmds.push({ type: "nav.catalog", catalog: state.nav.catalog }); break;
      }
      default: return ERR("Action inconnue : " + a.type);
    }
  } catch (e) { return ERR(e.message); }
  return { ok: true, cmds };
}

function faultEffect(state, f, on) {
  const r = f.target && f.target.kind === "room" ? state.rooms[f.target.id] : null;
  const d = f.target && f.target.kind === "door" ? state.doors[f.target.id] : null;
  if (r) {
    if (f.key === "fire") r.flags.fire = on;
    if (f.key === "hull.breach" || f.key === "ring.hull") r.flags.breach = on;
    if (f.key === "power.surge" || f.key === "power.breaker") r.env.power = !on;
    if (f.key === "alarm.false" && !f.silent) r.flags.alarm = on;
  }
  if (d && (f.key === "perms.corrupt")) d.broken = on;
  if (d && f.key === "airlock.open") { d.state.open = on; d.state.locked = false; }
}
function targetName(state, t) {
  if (!t || t.kind === "ship") return " sur tout le vaisseau";
  const o = t.kind === "room" ? state.rooms[t.id] : t.kind === "door" ? state.doors[t.id] : state.sections[t.id];
  return o ? " · " + o.name : "";
}
function clean(s, n) { return String(s ?? "").replace(/[<>]/g, "").trim().slice(0, n); }
function sanitizeRule(r) {
  if (!r || !Array.isArray(r.any) || !r.any.length) return null;
  const ok = ["min", "lv", "p", "role", "job", "grp", "team", "tag", "none"];
  const any = r.any.filter(c => c && ok.includes(c.t)).slice(0, 20).map(c => ({ t: c.t, v: c.t === "lv" ? [].concat(c.v).map(x => x | 0) : c.t === "min" ? c.v | 0 : c.t === "none" ? null : clean(c.v, 64) }));
  return any.length ? { any } : null;
}

/* Simulateur d'environnement : sert la démo et les tests sans mod.
   En production, c'est le mod qui calcule la physique et envoie la télémétrie. */
function simulate(S, dt, now = Date.now()) {
  navSimulate(S, now);
  const valveOpen = (rid, kind) => { const v = Object.values(S.valves).filter(x => x.room === rid && x.kind === kind); return v.length ? v.some(x => x.open) : kind === "o2"; };
  for (const r of Object.values(S.rooms)) {
    const e = r.env, gone = roomStatus(S, r) === "gone";
    if (gone) { e.p = 0; e.o2 = 0; e.t = -120; continue; }
    const vent = r.mode === "vent" || valveOpen(r.id, "vent"), o2 = valveOpen(r.id, "o2");
    if (vent) e.p = Math.max(0, e.p - 9 * dt);
    else if (r.flags.breach) e.p = Math.max(0, e.p - 0.5 * dt);
    else if (r.mode === "pressurize") e.p = Math.min(101.3, e.p + (r.modeForce ? 7 : 1.2) * dt);
    else if (o2 && e.p < 101.3) e.p = Math.min(101.3, e.p + 0.25 * dt);
    if (r.suppressUntil && r.suppressUntil > Date.now()) { e.o2 = Math.max(12, e.o2 - 0.5 * dt); e.p = Math.min(140, e.p + 0.8 * dt); if (e.o2 < 15) r.flags.fire = false; }
    if (r.flags.fire && e.p > 30) { e.o2 = Math.max(9, e.o2 - 0.04 * dt); e.t = Math.min(85, e.t + 0.3 * dt); e.co2 = Math.min(4, e.co2 + 0.01 * dt); }
    else if (o2 && e.p > 40) { e.o2 += (20.9 - e.o2) * 0.03 * dt; e.co2 += (0.04 - e.co2) * 0.03 * dt; }
    else e.o2 = Math.max(0, e.o2 - 0.03 * dt);
    if (e.p < 2) e.o2 = 0;
    const tt = (r.flags.breach || e.p < 20) ? -30 : r.flags.fire ? e.t : 21;
    e.t += (tt - e.t) * 0.01 * dt;
    if (r.mode === "pressurize" && e.p >= 101) r.mode = null;
    if (r.mode === "vent" && e.p <= 0.5) r.mode = null;
  }
  for (const p of Object.values(S.people)) {
    if (!p.vitals || p.vitals.alive === false || !p.room || !S.rooms[p.room]) continue;
    const r = S.rooms[p.room], e = r.env, v = p.vitals, gone = roomStatus(S, r) === "gone";
    const bad = gone || e.p < 45 || e.o2 < 13;
    v.o2 = bad ? Math.max(0, v.o2 - 6 * dt) : Math.min(100, v.o2 + 4 * dt);
    if (v.o2 <= 0 || r.flags.fire) v.hp = Math.max(0, v.hp - (gone ? 20 : 0.25) * dt);
    if (v.hp <= 0) { v.alive = false; log(S, "SYSTÈME", `Signal vital perdu : ${p.name} (${r.name}).`, "crit", now); }
  }
}

/* Horloge : comptes à rebours des procédures. */
function tick(state, now = Date.now()) {
  const cmds = [];
  for (const p of state.procs) {
    if (p.status === "countdown" && p.endsAt <= now) {
      const s = state.sections[p.target];
      p.status = "done"; s.state = "ejected";
      const rooms = Object.values(state.rooms).filter(r => r.section === s.id);
      const aboard = Object.values(state.people).filter(x => rooms.some(r => r.id === x.room));
      cmds.push({ type: "section.eject", section: s.id, rooms: rooms.map(r => r.id) });
      log(state, "ORDINATEUR", `Section ${s.name} éjectée${aboard.length ? " avec " + aboard.length + " personne(s) à bord" : ""}.`, "crit", now);
    }
  }
  if (state.procs.length > 30) state.procs.length = 30;
  return cmds;
}
const needsTick = (state) => state.procs.some(p => p.status === "countdown");

/* Vue filtrée pour une session donnée. */
function viewFor(state, actor, term) {
  const v = clone(state);
  const adm = !!(actor && actor.admin);
  const perms = Object.fromEntries(Object.keys(ACTIONS).map(k => [k, can(state, actor, k, term)]));
  const tPages = termPages(state, term);
  let pages = Object.keys(PAGES).filter(p => adm || (tPages.includes(p) && !ADMIN_PAGES.includes(p)));
  if (!adm && !perms["med.view"]) pages = pages.filter(p => p !== "medical");
  if (!adm && !perms["power.breaker"] && !perms["power.device"] && !perms["power.config"]) pages = pages.filter(p => p !== "energy");
  if (actor && !pages.includes("chat")) pages.push("chat");
  if (!adm && !perms["structure.edit"] && !perms["perms.edit"]) pages = pages.filter(p => p !== "structure");
  if (!adm && !perms["alarm.general"] && !perms["pa.play"]) pages = pages.filter(p => p !== "pa");
  v.alerts = computeAlerts(state, adm);
  if (!adm) {
    v.faults = []; v.computer = { refuse: state.computer.refuse, message: state.computer.refuse ? state.computer.message : "" };
    for (const sf of state.faults) if (sf.active && sf.silent && sf.key === "sensor.lie" && sf.target.kind === "room" && v.rooms[sf.target.id]) Object.assign(v.rooms[sf.target.id].env, { p: 101.3, o2: 20.9, t: 21 });
    if (!perms["crew.vitals"]) for (const p of Object.values(v.people)) { if (p.id !== (actor && actor.id)) { p.vitals = null; p.room = null; } }
    for (const p of Object.values(v.people)) if (p.id !== (actor && actor.id)) delete p.joined;
    if (v.nav) for (const sys of v.nav.catalog.systems || []) {
      for (const pl of sys.planets || []) { pl.info = (pl.info || []).filter(i => i.show !== false); delete pl.env; }
      sys.fields = (sys.fields || []).filter(f => f.show !== false);
    }
    delete v.screens;
    delete v.craft;
    delete v.security;
    if (!perms["med.view"]) for (const p of Object.values(v.people)) if (p.id !== (actor && actor.id) && p.vitals) { delete p.vitals.body; delete p.vitals.diseases; delete p.vitals.symptoms; delete p.vitals.blood; }
    for (const p of Object.values(v.people)) if (p.vitals) delete p.vitals.infections;   // vue admin seulement
    if (!perms["power.breaker"] && v.power && v.power.telem) v.power = { telem: { mode: v.power.telem.mode, prod: v.power.telem.prod, demand: v.power.telem.demand } };
    if (v.power && !perms["power.breaker"]) delete v.power.events;
    /* Les maladies ne sont connues de l’équipage qu’à travers la bibliothèque (fiches publiées) et les diagnostics. */
    delete v.diseases;
    for (const p of Object.values(v.people)) if (p.id !== (actor && actor.id) && p.vitals) delete p.vitals.known;
    v.chats = { [actor ? actor.id : "_"]: ((state.chats || {})[actor && actor.id] || []).map(m => ({ t: m.t, from: m.from, text: m.text })) };
    delete v.chatUnread;
    for (const p of Object.values(v.people)) { delete p.chip; delete p.carriedBy; delete p.notifyAi; }
  }
  if (!(actor && (adm || actor.id === "display" || can(state, actor, "cam.view")))) delete v.cameras;
  /* Inventaire : chiffres comptés (avec erreurs) pour tous ; vrais chiffres et erreurs pour l’admin. */
  delete v.inv;
  if (state.inv && state.inv.real) v.inv = { t: state.inv.t, ref: state.inv.ref, counted: invCounted(state), recount: canRecount(actor), ...(adm ? { real: state.inv.real, err: state.inv.err } : {}) };
  /* Vie de bord : canal de l’équipage réservé à l’équipage. */
  if (state.bord) { v.bord = clone(state.bord); if (!adm && !isCrew(actor)) v.bord.crew = []; v.bord.volunteer = !!actor && (state.bord.volunteers || []).includes(actor.id); delete v.bord.volunteers; }
  v.bh = actor && state.bh && state.bh[actor.id] ? clone(state.bh[actor.id]) : { names: [], pop: [] };
  /* Bibliothèque : seulement ce que l’on a le droit de lire. Abysse : pseudonymes seulement. */
  v.kb = { articles: (state.kb ? state.kb.articles : []).filter(a => kbCanRead(state, actor, a)).map(a => Object.assign({}, a, { mine: !!actor && a.author === actor.id })) };
  v.darkweb = { posts: (state.darkweb ? state.darkweb.posts : []).map(p => { const o = { id: p.id, t: p.t, alias: p.alias, text: p.text, img: p.img, parent: p.parent, mine: !!actor && p.aid === actor.id }; if (adm) o.real = (state.people[p.aid] || {}).name || p.aid; return o; }),
    me: actor ? dwAlias(state, actor.id) : "" };
  v.me = actor ? {
    id: actor.id, name: actor.name, level: actor.level | 0, admin: adm, intrus: !!actor.intrus, role: actor.role, job: actor.job, rank: actor.rank, group: actor.group, team: actor.team,
    perms, pages, term: term || null, ws: wsJob(term),
    doors: Object.values(state.doors).filter(d => canOpenDoor(state, actor, d).ok).map(d => d.id),
    manages: Object.values(state.doors).filter(d => (d.managers || []).includes(actor.id)).map(d => d.id)
  } : null;
  return v;
}

- Le lifepack (n’importe où dans l’inventaire) prend le relais dès que l’air devient irrespirable : environ 13 minutes (dans le vide, seule la combinaison EVA protège le corps).
! Gardez toujours un lifepack chargé sur vous.`],
["Décompression et brèche", `Quand une pièce s’ouvre sur le vide, tout l’air s’en échappe en quelques secondes et emporte ce qui n’est pas attaché.
1. Accrochez-vous : câble SAFELINE sur une poignée (6 blocs de longueur).
2. Votre lifepack prend le relais.
3. Sortez par une porte étanche et refermez-la derrière vous.
> Une pièce percée ferme ses clapets d’air : le reste du vaisseau ne se vide pas avec elle.`],
["En cas d’incendie", `Le feu brûle l’oxygène de la pièce et rejette du CO₂ ; il s’étend sur n’importe quel sol, même sans bois.
1. Donnez l’alerte (le détecteur incendie le fait s’il y en a un).
2. Si le foyer est petit : extincteur, clic droit maintenu vers les flammes.
3. Sinon, évacuez et fermez les portes : l’équipe de sécurité noiera la pièce à l’azote ou la videra de son air.
! Un feu qui dure perce la coque : la pièce se dépressurise ensuite.`],
["Demander de l’aide", `- N › Demander de l’aide : une question, un souci de rôle, un bug ou une urgence. Vous pouvez rester anonyme.
- La page Discussion de la console : écrire à l’ordinateur de bord, qui vous répond.
> Les demandes d’aide arrivent au staff, pas aux autres joueurs.`],
["Gestes et tenue", `- G : salut militaire. H : garde-à-vous (on le rompt en bougeant). U : marche au pas.
- Les mêmes gestes sont dans le menu N.
- /repos arrête le garde-à-vous ou la marche.`],
],
colon: [
["La vie à bord", `Le Meridian III emmène une colonie : chacun y a un métier, un niveau d’accès et des règles.
- Votre niveau (0 à 7) décide des portes et des actions de console autorisées. Les colons sont au niveau 1.
- Les portes s’ouvrent par clic droit avec votre puce : refusé = pas le droit, ou porte verrouillée.
- Certaines fabrications sont réservées à des métiers : si une recette ne donne rien, elle ne vous est pas autorisée.`],
["Où aller en cas d’alerte", `- Niveau 1 : rejoignez le point de rassemblement de votre section.
- Niveaux 2 à 4 : éloignez-vous de la zone en alarme, fermez les portes derrière vous.
- Niveau 5 : zone sécurisée la plus proche, lifepack à la ceinture.
> Suivez les ordres de l’équipage : ils voient le vaisseau entier sur la console.`],
["Les consoles", `Les terminaux ouvrent la console de bord avec vos droits. Un terminal n’affiche que les pages prévues pour son poste.
- Plan du vaisseau : où vous êtes, l’état des pièces.
- Discussion : écrire à l’ordinateur de bord.
- Les pages que vous ne pouvez pas voir n’apparaissent pas.`],
],
ingenieur: [
["Réseau électrique et plombs", `Un seul réseau pour tout le vaisseau : réacteur à fusion, piles de secours et batteries d’un côté, les pièces de l’autre.
- Chaque pièce a son panneau (plomb de pièce, 8 kW). Au-dessus : la section (60 kW), puis le pont (600 kW).
- Un dépassement fait sauter le plomb ; un gros dépassement fait souvent sauter aussi celui du dessus.
- Plomb de pont sauté ou production insuffisante : secours. Seuls les appareils vitaux restent alimentés.
! Un panneau abîmé ou surchargé peut mettre le feu. Réparation : accroupi + clic avec la trousse à outils.
> Page Énergie : arbre des plombs, calibres, appareils coupables à distance. Page Réseaux : câbles, gaz, eau, chaleur, respirabilité.`],
["Trousse à outils", `Rien ne marche tant que ce n’est pas branché.
1. Trousse : clic sur l’appareil, puis sur le panneau de la pièce.
2. Diffuseur anti-incendie : clic sur le diffuseur, puis sur un tuyau de gaz proche.
3. Sas : panneau, porte intérieure, porte extérieure, puis les bouches.
> Trousse en main, les câbles proches s’affichent.`],
["Machines centrales", `Deux ou trois grosses machines suffisent au vaisseau.
- Électrolyseur industriel : 1 mol/s d’eau, de quoi faire respirer ~35 personnes.
- Recycleur atmosphérique : CO₂ des pièces reliées → méthane et eau (Sabatier).
- Climatisation : tient la consigne de température des pièces reliées.
- Réacteur à fusion : 1,5 MW à l’hydrogène ; piles à combustible et batteries en secours.
- Moteur de saut : se charge sur le réseau ; antimatière produite à partir d’exotite (Io-2b, HD 188753 Ab, Néo-Titan).`],
["Le circuit de l’air", `L’air n’est pas fabriqué à partir de rien : chaque atome passe par une machine, et chaque transformation coûte de l’énergie.
[[schema:chaine-gaz]]
- Électrolyseur : 2 H₂O → 2 H₂ + O₂. ≈ 14 kW à plein régime, de quoi faire respirer 1,7 personne.
- Filtreur à CO₂ : capte le CO₂ de l’air (≈ 1,5 personne) et l’envoie au séparateur.
- Séparateur : CO₂ → C + O₂, rendement 80 %. Il use une cartouche filtrante (≈ 3 h 20 à plein régime).
- Catalyseur à méthane : C + 2 H₂ → CH₄. Il consomme l’hydrogène de l’électrolyseur.
- Centrifugeuse : nettoie les cartouches encrassées et rend leur carbone.
! Ne reliez jamais le réseau d’O₂ et celui d’H₂.`],
["Distribution centralisée", `Une salle des machines produit et recycle l’air de tout le vaisseau ; des tuyaux le distribuent aux pièces.
[[schema:distribution]]
- Chaque pièce : une bouche en SOUFFLAGE (arrivée) et une bouche en REPRISE (retour). Accroupi + clic droit sur la bouche pour changer.
- Soufflage : le gaz n’entre que jusqu’à 101,3 kPa et 21,2 kPa d’O₂ (détendeur intégré).
- Reprise : l’air vicié ne fait que sortir, vers le filtreur central.
- Retour de l’air propre : un tuyau directionnel ALIMENTÉ (pompe) du réseau de reprise vers le réseau de soufflage.
- Une brèche ferme les deux clapets de la pièce : le reste du réseau tient.
! Une bouche en mode LIBRE sur un réseau commun mélange les pièces et vide tout le réseau en cas de brèche.`],
["Tuyaux, ports et cuves", `- Tuyau : passif. Les pressions s’égalisent (400 mol/s au plus), les compositions se mélangent.
- Tuyau directionnel : clapet anti-retour sans énergie, pompe jusqu’à 40 mol/s avec du FE.
- Ports des machines : entrée à l’arrière (bleu), sortie au-dessus (orange), sortie secondaire sur le côté. Chaque port contient 1 m³ et s’arrête à 1 000 kPa.
- Cuve de gaz : 2 m³, six faces, vanne au-dessus (accroupi + clic droit).
- Compresseur : jusqu’à 20 MPa, au prix du travail de compression réel.
> Clic droit sur un tuyau : tous les volumes reliés, avec leur pression et leur composition.`],
["Pressuriser une pièce", `Depuis la console, « Pressuriser » ne crée pas d’air : les électrolyseurs qui desservent la pièce passent à 4 fois leur débit pendant 10 minutes (et consomment 4 fois plus d’eau et d’énergie).
- Électrolyseurs pris en compte : collés à la pièce, ou reliés à ses bouches par les tuyaux, les cuves et les tuyaux directionnels.
- Une pièce vidée a perdu son azote : sans cuve de N₂ sur le réseau de soufflage, elle ne remonte qu’en O₂ et la pression totale reste basse.
> Seul le poste admin remplit une pièce instantanément.`],
["Énergie", `- Toutes les machines consomment des FE. 1 FE/t = 50 W.
- L’énergie suit la chimie réelle : décomposer l’eau ou le CO₂ coûte cher. Prévoyez la production avant d’ajouter des machines.
- Une machine sans énergie s’arrête simplement : clic droit pour voir son état et la cause.`],
["Gravité", `- Le générateur de gravité agit sur le compartiment qu’il touche : il en faut un par pièce, ce n’est pas centralisable.
- Consigne de 0 à 6 g (accroupi + clic droit), montée de 0,1 g/s. La plus forte consigne l’emporte.
- Au-delà de 1 g : faim accrue ; 1,5 g : lenteur ; 2,5 g : faiblesse ; 4 g : voile gris ; 6 g : perte de connaissance.`],
["Portes pressurisées", `- Fermée : étanche, elle sépare deux compartiments. Ouverte : les deux pièces partagent leur air.
- Redstone sur une de ses cases : ouvre ou ferme.
- Verrouillée : plus d’ouverture à la main. Scellée : fermée, même la redstone ne l’ouvre plus.
- Elle ne se referme pas sur quelqu’un, sauf scellé d’urgence.`],
["Sécurité incendie", `[[schema:incendie]]
- Détecteur incendie : au plafond, rayon de 10 blocs. Il bipe, donne un signal redstone et prévient l’ordinateur de bord, qui déclenche l’alarme de la section.
- Diffuseur anti-incendie : au plafond, raccordé par l’arrière à un réseau d’azote. Il s’ouvre sur redstone ou sur ordre de la console (60 s).
- Le feu meurt sous 10 kPa d’O₂ ou 15 % d’O₂ dans l’air.
! Le détecteur ne déclenche pas l’extinction : il prévient. Câblez-le vous-même au diffuseur si vous voulez une extinction automatique.`],
["Réparer une brèche", `1. Pièce isolée : fermez et faites sceller les portes voisines.
2. Équipe en lifepack, attachée par SAFELINE.
3. Rebouchez le trou : la pièce redevient étanche… mais vide.
4. Repressurisez : azote depuis la cuve de N₂, O₂ depuis le soufflage, ou ordre « Pressuriser ».
> Un bloc de coque remplacé repart à froid : il ne garde pas la fatigue due au feu.`],
["Dépannage rapide", `- Machine à l’arrêt : énergie, sortie pleine (1 000 kPa) ou entrée vide.
- Électrolyseur : plus d’eau, hydrogène non évacué, ou pièce déjà à 21 kPa d’O₂.
- Filtreur : CO₂ déjà au niveau naturel, ou bouche non raccordée.
- Séparateur : cartouche absente ou encrassée.
- Réseau inactif : une bouche ne se raccorde que par l’arrière ; une pièce « Analyse en cours » n’échange pas encore.`],
],
medecin: [
["Santé localisée", `Les blessures touchent une partie du corps.
- Bandage : saignement. Attelle : fracture (6 min). Trousse : +5 sur une partie. Morphine : douleur masquée 3 min. Poche de sang : +1,5 L.
- Touche K : fiche médicale. Objet de soin en main sur un patient : sa fiche s’ouvre, cliquez la partie à soigner.
! Sous 2 L de sang le patient perd la vue ; sous 1,2 L il meurt.`],
["Maladies et laboratoire", `Diagnostic en quatre temps.
1. Seringue : prélèvement sur le patient.
2. Microscope : forme du pathogène.
3. Analyseur sanguin : rapport, diagnostic transmis à la console.
4. Synthétiseur pharmaceutique : 3 doses de traitement (une fiole vide).
> Approchez les malades contagieux en combinaison de protection sanitaire. Page Médical : fiches de tout l’équipage.`],
["Lire les signes vitaux", `La console (page Équipage) donne pour chaque personne : santé, faim, réserve du lifepack, pièce occupée.
- « Signal vital perdu » apparaît dans les alertes et le journal à chaque décès.
- La pièce occupée permet de remonter à la cause : air, feu, décompression.`],
["Hypoxie", `Manque d’oxygène, mesuré en pression partielle d’O₂.
- Sous 16 kPa : lenteur, gestes ralentis.
- Sous 10 kPa : faiblesse, nausée, blessures.
- Sous 6 kPa : asphyxie.
> Traitement : air respirable ou lifepack. Une pièce noyée à l’azote reste dangereuse même quand le feu est éteint.`],
["Décompression", `- Sous 50 kPa : basse pression, lenteur.
- Sous 20 kPa : décompression, blessures importantes.
- Une décompression explosive projette les victimes vers la brèche : cherchez-les près du trou ou dehors.
! Le lifepack ne protège que la respiration : dans le vide, le corps subit la décompression et ne tient que quelques secondes. Pour sortir, il faut la combinaison EVA complète.`],
["Combinaison EVA", `Les quatre pièces (casque, torse, jambes, bottes) forment une enveloppe étanche : dans le vide, plus de décompression, et vous respirez la réserve du torse (≈ 53 min), puis vos lifepacks.
- Le torse se recharge dans un compresseur LIFEPACK, comme un lifepack.
- Sous 20 % de réserve, la combinaison vous prévient toutes les dix secondes : regagnez un sas.
- Une pièce manquante = plus d’étanchéité : le lifepack seul ne vous laisse que quelques secondes dans le vide.
- Avec un uniforme attribué, la combinaison prend les couleurs de votre métier ; le grade se lit aux bandes du casque, du sac dorsal et des cuisses, et les écussons restent sur les bras.
> Recettes : laine blanche et fer ; le torse demande un lifepack, le casque un bloc de verre.`],
["Intoxication au CO₂", `- Au-dessus de 2 kPa : faiblesse. Au-dessus de 5 kPa : intoxication et blessures.
- Causes : filtreur à l’arrêt, pièce surpeuplée, incendie, extincteur vidé dans un petit local.
> Traitement : quitter la pièce, faire relancer le filtreur.`],
["Brûlures", `- Marcher dans un foyer enflamme et blesse.
- L’extincteur éteint aussi une personne en feu : visez-la.`],
["Gravité et organisme", `- Au-dessus de 1 g : faim accrue. 1,5 g : lenteur. 2,5 g : faiblesse. 4 g : voile gris et blessures légères. 6 g : perte de connaissance.
- Sur les planètes, la gravité change (Kepler-442b : 1,5 g ; Néo-Titan : 0,14 g).`],
],
pilote: [
["Sauter d’un système à l’autre", `Le vaisseau saute par l’hyperespace. Les planètes du départ disparaissent, celles de l’arrivée apparaissent à la sortie.
- Portée : 12 années-lumière par saut au plus.
- Carburant : 0,5 g d’antimatière par année-lumière, prélevés dans toutes les cuves.
- Durée : 5 min + 2 min par année-lumière, 1 h au plus. Un saut de 10 al dure environ 25 minutes.
- Lancement : carte interstellaire de la console, les systèmes atteignables sont en surbrillance.
> Un saut en cours à la fin d’une session reprend à la session suivante.`],
["La région", `- Rex Magna 1 est le carrefour : Kepler-442, Gliese 581, TRAPPIST-1 et Kronos sont à un saut.
- Jovia-2 et HD 188753 : deux sauts.
- Alpha Centauri (Proxima b) : six sauts au moins, par une chaîne de systèmes relais.
- Le système solaire est à environ 3 000 al, hors de portée.`],
["Antimatière", `- Chaque Cuve à Antimatière Pressurisée contient 10 g ; la somme des cuves donne le carburant du vaisseau.
- Une capsule ajoute 2 g. Il n’y a pas de production à bord : c’est une ressource rare.
> Avant un saut, vérifiez qu’il restera assez d’antimatière pour revenir.`],
["Étoiles", `Le vaisseau n’est jamais au centre d’un système : il arrive quelque part sur son orbite.
- À 4 rayons de l’étoile : alerte de proximité.
- À 2,5 rayons : alerte rouge.
- À 1,6 rayon : on brûle, et au bout de 5 secondes on explose, navette comprise.`],
["Carte stellaire", `- Planètes, champs de météorites, navettes équipées d’une liaison com, position du vaisseau.
- Molette pour zoomer, glisser pour déplacer, bouton VAISSEAU pour recentrer.`],
],
explorateur: [
["Descendre sur une planète", `- Entrez dans l’atmosphère (les couches translucides) : vous passez sur la planète.
- Une navette passe entière avec ses passagers.
- Chaque planète a sa gravité et son air : respirable sur Proxima b ou à l’équateur de Gliese 581 c, mortel ailleurs sans lifepack.
- Pour repartir : montez tout en haut, vous ressortez dans l’espace au-dessus de la planète.`],
["Rethium", `Beaucoup de planètes non habitables ont une atmosphère chargée de Rethium, un gaz qui ronge les coques.
! 15 secondes après l’arrivée, la navette explose avec ses passagers. Ressortez avant.`],
["Si le vaisseau part sans vous", `- Vous ressortez dans l’espace profond : les planètes et l’étoile du système, sans le vaisseau.
- De là, on peut redescendre sur n’importe quelle planète du système.
- Au retour du vaisseau, tout ce qui attend dans l’espace profond est ramené près de lui.
! L’espace profond est le vide : combinaison EVA complète ou navette pressurisée obligatoires.`],
["Sortie dans le vide (EVA)", `1. Entrez dans le sas, fermez la porte intérieure.
2. Attachez-vous à une poignée SAFELINE, lifepack chargé.
3. Videz le sas (dépressuriseur), puis ouvrez la porte extérieure.
4. Au retour : porte extérieure fermée, sas repressurisé, puis porte intérieure.`],
["Liaison com", `Posée sur une navette, la balise affiche sa position en direct sur la carte stellaire, même sur une planète. Nommez-la sur une enclume avant de la poser.`],
],
militaire: [
["Armurerie et portiques", `Cinq armes réglementaires, chacune avec son calibre :
- Pistolet P-9 « Alterra » (9 mm) : arme de service, 15 coups.
- Pistolet-mitrailleur « Vigile » (.45 ACP) : automatique, 30 coups.
- Fusil d’assaut AR-7 « Meridian » (5,56 mm) : automatique, 30 coups, viseur holographique.
- Fusil à pompe « Breacher 12 » (calibre 12) : chevrotine (8 plombs) ou balle.
- Fusil de précision LR-338 « Horizon » (.338) : 5 coups, lunette ×4.
- Clic droit : tirer (maintenu pour les automatiques). Accroupi : viser. R : recharger. Accroupi + R : changer de munition.
! À bord, préférez les munitions frangibles (9 mm, .45) : elles se brisent à l’impact et ne percent ni les vitres ni la coque. Les balles ordinaires et perforantes brisent le verre.
- Portique de sécurité : deux blocs de haut, on le traverse. Arme, munition, pièce d’arme, arme blanche ou boîtier d’intrusion sur soi : il sonne, passe au rouge, envoie un signal de redstone et l’ordinateur de bord journalise le passage.
> Fabrication : canon, mécanisme, carcasse, crosse, lunette ; les munitions demandent cuivre et poudre. L’ordinateur de bord peut réserver ces recettes à certains métiers (page Fabrication).`],
["Contrôle des accès", `Les portes appliquent les règles de la console.
- Niveau minimum, niveaux précis, personnes nommées, rôle, métier, groupe, équipe ou étiquette (#armurerie…).
- Groupes d’autorisation : une règle commune à plusieurs portes.
- Verrouiller : plus d’ouverture à la main. Isoler (sceller) : fermée et bloquée, même par redstone.
- Plan du vaisseau : un pont ou une section entière se verrouille ou s’isole d’un clic.`],
["Puces volées, fausses identités", `- Une puce ramassée sur un mort donne ses accès à celui qui la porte. Sur la console, le poste admin voit qui porte la puce de qui.
- Réémettre la puce (fiche personnel) : l’ancienne devient inutilisable, une nouvelle est remise au propriétaire.
- Un pseudonyme ne change pas la puce : seuls les noms connus changent.
> Tout passage de porte est journalisé avec le nom de la puce portée.`],
["Intrusion informatique", `Un terminal peut être piraté avec un boîtier d’intrusion : l’opération prend plusieurs minutes, sur place.
- L’ordinateur de bord peut repérer l’intrusion avant la fin : alerte « Intrusion détectée » et emplacement du terminal.
- Réagissez vite : l’intrus doit rester près du terminal jusqu’au bout.`],
["Éjection d’une section", `Pour larguer une section en dernier recours :
1. Un premier officier saisit son code (page Procédures).
2. Un second officier, une autre personne, saisit le sien.
3. Un compte à rebours de 15 s démarre ; il peut encore être annulé.
! La console indique combien de personnes se trouvent dans la section. Évacuez avant.`],
["Incendie : intervention", `- L’alarme de toute la section sonne quand un détecteur voit un feu, et l’alerte apparaît à la passerelle.
- Évacuez la section, fermez les portes.
- Petit foyer : extincteurs. Feu installé : « Extinction à l’azote » sur la fiche de la pièce (il faut un diffuseur), ou vider la pièce.
! L’azote et le vide tuent aussi l’équipage resté dans la pièce.`],
["Gestes et ordre", `- G : salut. H : garde-à-vous. U : marche au pas (allure réduite, pas de course).
- Le garde-à-vous se rompt en bougeant.`],
],
commandement: [
["Vie de bord : canaux et mobilisation", `Page « Vie de bord » de la console.
- Déroulé de session : horaires du briefing, des quarts, de la relève et du rapport (heure de Paris). Il règle l’horloge des puces et l’éclairage. Une ambiance peut être imposée.
- Canal général : réservé à la passerelle. Canal de l’équipage : officiers.
- Mobilisation : choisissez les groupes, le motif, un point de rendez-vous. Réservé aux urgences réelles, noté au journal. Les réponses « J’arrive » s’affichent en direct.`],
["Réserves et soute", `L’inventaire est automatique : toutes les 30 s, le mod compte les coffres et réservoirs des pièces du vaisseau.
- Vivres, médical et pièces : comptés dans les coffres. Le comptage peut dériver : un magasinier ou le chef de soute fait un recompte (page Réserves et soute) pour corriger l’écart.
- Eau, ergols, oxygène et antimatière : jaugés dans les réservoirs, sans erreur possible.`],
["Niveaux et permissions", `- 0 non assigné, 1 colon, 2 travailleur, 3 technicien ou militaire, 4 officier, 5 chef de service, 6 second, 7 capitaine.
- Chaque action de la console exige un niveau minimum, réglable sur la page Structure.
- On ne peut pas donner un niveau égal ou supérieur au sien, ni modifier un supérieur.`],
["Alertes générales", `- Page Diffusion : alerte niveaux 1 à 5 sur tous les haut-parleurs, un groupe ou une pièce.
- Signaux : changement de quart, début et fin de communication.
- La page Alertes est faite pour l’écran de la passerelle : tout ce qui est en cours, en grand.`],
["Ponts et sections", `- Une section est un groupe de pièces d’un pont (ou une section d’anneau). L’alarme incendie et les actions groupées s’appliquent à toute la section.
- Plan du vaisseau : vue de face des ponts et des anneaux. On isole, verrouille, met en alarme, pressurise ou vide un pont ou une section entière.`],
["Le Meridian", `[[schema:meridian]]
- L’ordinateur de bord fait autorité : registre, règles d’accès, journal.
- Le vaisseau (le mod) mesure et applique : air, portes, alarmes, navigation.
- Liaison coupée : les portes et la fabrication gardent les dernières règles reçues.`],
],
};

};

function brandRng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* ---------- Alterra : identité de compagnie ----------
   Un monogramme « A » sans barre, d'un seul trait épais, tranché par la ligne d'horizon qui file vers la droite :
   la compagnie qui pousse au-delà de l'horizon. Le nom est dessiné lettre par lettre (aucune police nécessaire),
   sur une grille de 40 unités de haut et un fût de 8. */
const ALTERRA_GLYPHS = {
  A: [40, `<path d="M15.5 0h9L40 40h-9.2L20 12.6 9.2 40H0z"/>`],
  L: [27, `<path d="M0 0h8v32h19v8H0z"/>`],
  T: [32, `<path d="M0 0h32v8H20v32h-8V8H0z"/>`],
  E: [28, `<path d="M0 0h28v8H8v8h17v8H8v8h20v8H0z"/>`],
  R: [33, `<path fill-rule="evenodd" d="M0 0h20c7.2 0 12 4.6 12 12 0 5.8-3 9.8-8 11.3L33 40h-9.2l-8.3-16H8v16H0zM8 8v8h12c2.6 0 4-1.5 4-4s-1.4-4-4-4z"/>`]
};
/* Le mot ALTERRA à la hauteur de capitale h, posé en (x, y = haut des lettres). */
function alterraWord(x, y, h, fill, track = 9) {
  const k = h / 40; let cx = 0, g = "";
  for (const ch of "ALTERRA") { const [w, p] = ALTERRA_GLYPHS[ch]; g += `<g transform="translate(${cx} 0)">${p}</g>`; cx += w + track; }
  const width = (cx - track) * k;
  return { width, svg: `<g transform="translate(${x} ${y}) scale(${k})" fill="${fill}">${g}</g>` };
}
const alterraWordWidth = (h, track = 9) => alterraWord(0, 0, h, "#000", track).width;

/* ---------- Oriflamme verticale ----------
   Largeur fixe de 300 unités, hauteur selon le rapport (r = hauteur / largeur) : la mise en page se resserre ou
   s'aère, et les éléments secondaires disparaissent quand la place manque. pointed : pointe en bas (planche) ;
   sinon rectangle plein avec frange (toile accrochée en jeu). */
function missionPennant(opts = {}) {
  const B = brandOf(opts.brand), P = BRAND_PAL, r = opts.ratio || 8 / 3, W = 300, H = Math.round(W * r), pointed = opts.pointed !== false;
  const id = "pn" + Math.random().toString(36).slice(2, 7), words = B.mission.toUpperCase().split(" "), big = words.slice(1).join(" "), first = words[0];
  const tail = pointed ? 80 : 46, avail = H - 22 - tail;
  const markS = Math.max(120, Math.min(200, avail * 0.3));
  const items = [["mark", markS], ["word", 26], ["rule", 3], ["mission", 34]];
  if (big) items.push(["big", 52]);
  items.push(["code", 20]);
  if (avail > 640) items.push(["spark", 70]);
  const fixed = items.reduce((s, x) => s + x[1], 0), gap = Math.max(10, (avail - fixed) / (items.length + 1));
  let y = 22 + gap, g = "";
  for (const [k, h] of items) {
    if (k === "mark") g += `<g transform="translate(${(W - h) / 2} ${y}) scale(${h / 120})">${alterraMarkG(P.ivory, P.ochre, id + "m")}</g>`;
    if (k === "word") { const w = alterraWordWidth(h, 7); g += alterraWord((W - w) / 2, y, h, P.ivory, 7).svg; }
    if (k === "rule") g += `<rect x="${W / 2 - 40}" y="${y}" width="80" height="3" fill="${P.signal}"/>`;
    if (k === "mission") g += `<text x="${W / 2}" y="${y + h * 0.85}" text-anchor="middle" font-family="${BRAND_FONT}" font-size="${Math.min(h * 1.1, 330 / Math.max(1, first.length) / 0.75).toFixed(1)}" font-weight="700" letter-spacing="5" fill="${P.ivory}">${brandEsc(first)}</text>`;
    if (k === "big") g += `<text x="${W / 2}" y="${y + h * 0.88}" text-anchor="middle" font-family="${BRAND_FONT}" font-size="${h * 1.05}" font-weight="700" letter-spacing="6" fill="${P.sand}">${brandEsc(big)}</text>`;
    if (k === "code") g += `<text x="${W / 2}" y="${y + h * 0.85}" text-anchor="middle" font-family="${BRAND_FONT}" font-size="${h * 1.1}" letter-spacing="8" fill="${P.signal}">${brandEsc(B.code)}</text>`;
    if (k === "spark") g += `<path d="M${W / 2} ${y} V${y + h - 20}" stroke="${P.ivory}" stroke-width="1.5" opacity=".5"/>${brandSpark(W / 2, y + h - 10, 12, P.signal)}`;
    y += h + gap;
  }
  const shape = pointed ? `<path d="M0 0 H${W} V${H - 80} L${W / 2} ${H} L0 ${H - 80} Z" fill="${P.navy}"/>`
    : `<rect width="${W}" height="${H}" fill="${P.navy}"/><rect y="${H - 34}" width="${W}" height="34" fill="${P.ochre}"/>${Array.from({ length: 15 }, (_, i) => `<rect x="${i * 20 + 4}" y="${H - 34}" width="12" height="34" fill="${P.sand}" opacity=".55"/>`).join("")}<rect y="${H - 40}" width="${W}" height="6" fill="${P.sand}"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Oriflamme ${brandEsc(B.mission)}">
${shape}<rect width="${W}" height="22" fill="${P.ochre}"/><rect x="14" y="22" width="2" height="${H - tail - 26}" fill="${P.ochre}" opacity=".6"/><rect x="${W - 16}" y="22" width="2" height="${H - tail - 26}" fill="${P.ochre}" opacity=".6"/>
${brandStars(Math.round(70 * r / 2.7), W, H - tail, 9, 1.3)}
${g}
</svg>`;
}

/* Fond plein (toiles en jeu, écussons isolés). */
function brandPlaque(inner, vw, vh, w, h, bg = BRAND_PAL.night, pad = 0.08) {
  const s = Math.min(w * (1 - 2 * pad) / vw, h * (1 - 2 * pad) / vh);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="${bg}"/><g transform="translate(${(w - vw * s) / 2} ${(h - vh * s) / 2}) scale(${s})">${inner.replace(/<svg[^>]*>|<\/svg>/g, "")}</g></svg>`;
}

/* Les planches de la page Branding : [clé, titre, usage, fonction de dessin]. */
const BRAND_BOARDS = [
  ["patch", "Écusson de mission", "Épaule gauche des uniformes, écrans d’accueil, documents officiels de la mission.", (b) => missionPatch({ brand: b })],
  ["banner", "Bannière de mission", "Écran du hangar, page d’accueil, en-tête de communiqué.", (b) => missionBanner({ brand: b })],
  ["lockup", "Alterra · logotype horizontal", "En-tête des documents de la compagnie, écrans des terminaux.", (b) => alterraLockup({ brand: b })],
  ["lockup-light", "Alterra · version claire", "Impression, fonds clairs.", (b) => alterraLockup({ brand: b, dark: false })],
  ["stacked", "Alterra · logotype vertical", "Avatar, icône, tampon.", (b) => alterraStacked({ brand: b })],
  ["pennant", "Oriflamme", "Couloirs, hangar, écrans en portrait. En jeu : 2, 3, 4, 5, 7 et 9 blocs de haut.", (b) => missionPennant({ brand: b })],
  ["mark", "Alterra · monogramme", "Petits formats, gravure sur les portes et les caisses.", () => brandPlaque(alterraMark(120), 120, 120, 400, 400, BRAND_PAL.night, 0.14)]
];

/* Toiles en jeu (tableaux du mod) : [nom, largeur, hauteur en blocs, dessin]. Rendues à 64 pixels par bloc. */
const BRAND_PAINTINGS = (b) => {
  const out = [];
  for (const h of [2, 3, 4, 5, 7, 9]) { const w = Math.max(1, Math.round(h * 0.375)); out.push([`oriflamme_${h}`, w, h, () => missionPennant({ brand: b, ratio: h / w, pointed: false })]); }
  for (const n of [1, 2, 3, 4]) out.push([`ecusson_mission_${n}`, n, n, () => brandPlaque(missionPatch({ brand: b }), 400, 400, 400, 400, BRAND_PAL.night, 0.03)]);
  for (const n of [1, 2, 3, 4, 5]) out.push([`banniere_mission_${n}`, 3 * n, n, () => missionBanner({ brand: b })]);
  for (const n of [1, 2, 3]) { out.push([`alterra_${n}`, 3 * n, n, () => alterraLockup({ brand: b, ratio: 3 })]); out.push([`alterra_clair_${n}`, 3 * n, n, () => alterraLockup({ brand: b, ratio: 3, dark: false })]); }
  for (const n of [1, 2, 3, 4]) out.push([`alterra_vertical_${n}`, n, n, () => alterraStacked({ brand: b })]);
  for (const n of [1, 2, 3]) out.push([`alterra_monogramme_${n}`, n, n, () => brandPlaque(alterraMark(120), 120, 120, 400, 400, BRAND_PAL.night, 0.14)]);
  for (const [k] of BRAND_SERVICES) for (const n of [1, 2]) out.push([`service_${k}_${n}`, n, n, () => brandPlaque(servicePatch(k, { brand: b }), 120, 150, 400, 400, BRAND_PAL.night, 0.06)]);
  return out;
};

<script>
"use strict";
/* =====================================================================
   Transport : DÉMO (tout tourne dans la page) ou CONNECTÉ (Worker).
   ===================================================================== */
const Q = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
/* Poste admin mémorisé sur cet appareil (adresse fixe de la console). */
const ls = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };

let V = null, OFF = 0, LINK = "demo", DEMO = null, MODFEED = [];
/* Adresse de l'ordinateur de bord (Worker). La console peut être hébergée ailleurs (GitHub Pages) : elle s'y connecte à distance. */
const API = (Q.get("api") || (/workers\.dev$|^localhost|^127\.0\.0\.1/.test(location.hostname) ? location.origin : "https://rebirthproject.refugeemeraudien-direction.workers.dev")).replace(/\/+$/, "");
const now = () => Date.now() + OFF;
/* Écran en jeu : ?screen=ID (lecture seule). Le fond devient transparent pour les écrans transparents. */
const SCREEN = (Q.get("screen") || "").slice(0, 24);
const SCREEN_Q = SCREEN ? "&screen=" + encodeURIComponent(SCREEN) : "";
/* Ordinateur en jeu : ?mirror=CLÉ → la console publie ce qu'elle affiche, les écrans en recopie la suivent. */
const MIRROR_KEY = (Q.get("mirror") || "").slice(0, 24);
let MIRROR = null, mirrorLast = "", mirrorTimer = 0;
function mirrorState() {
  const m = document.getElementById("main"), max = m ? m.scrollHeight - m.clientHeight : 0;
  return { page: ui.page, deck: ui.deck, room: ui.room, door: ui.door, person: ui.person, sec: ui.sec, system: ui.system, planet: ui.planet, field: ui.field, comlink: ui.comlink, crewF: ui.crewF, logF: ui.logF, scroll: max > 0 ? Math.round(m.scrollTop / max * 1000) / 1000 : 0 };
}
function mirrorPush() {
  if (!MIRROR_KEY || !T || !T.mirror) return;
  clearTimeout(mirrorTimer);

function makeRemote(token) {
  const R = { token, ws: null, pend: new Map(), seq: 1, retry: 0 };
  const open = async () => {
    try { const chk = await fetch(API + "/api/state?t=" + encodeURIComponent(token) + SCREEN_Q); if (chk.status === 401 || chk.status === 403) { const j = await chk.json().catch(() => ({})); try { sessionStorage.removeItem("meridian.t"); } catch {} if (token === ls.get("meridian.admin")) { ls.del("meridian.admin"); return loginGate("Session admin expirée : reconnectez-vous."); } document.getElementById("app").innerHTML = `<div class="gate" style="grid-column:1/-1;grid-row:1/-1"><div><div class="brand">MERIDIAN</div><p class="red" style="margin-top:18px;letter-spacing:.12em">ACCÈS REFUSÉ</p><p class="mu">${esc(j.error || "Session invalide.")}</p></div></div>`; return; } } catch {}
    const ws = R.ws = new WebSocket(API.replace(/^http/, "ws") + "/api/ws?t=" + encodeURIComponent(token) + SCREEN_Q);
    ws.onopen = () => { R.retry = 0; LINK = "live"; renderChrome(); CAM_WATCH = ""; camSync(); };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === "state") update(m.state, m.now);
      if (m.type === "hull") { setHull(m.hull); if (V) render(); }
      if (m.type === "mirror") { MIRROR = m.ui || null; if (V) render(); }
      if (m.type === "img") { IMG_CACHE[m.id] = m.data || ""; if (V) render(); }
      if (m.type === "cam") camFrame(m);
      if (m.type === "craftItems") { CRAFT_ITEMS = m.items || []; if (V && ui.page === "craft") render(); }
      if (m.type === "result" && R.pend.has(m.reqId)) { R.pend.get(m.reqId)(m); R.pend.delete(m.reqId); }
    };
    ws.onclose = (ev) => { LINK = "lost"; renderChrome(); if (ev.code === 1008) return; setTimeout(open, Math.min(15000, 800 * 2 ** R.retry++)); };
  };
  open();
  setInterval(() => { if (R.ws && R.ws.readyState === 1) R.ws.send('{"type":"ping"}'); }, 25000);
  R.mirror = (ui) => { if (R.ws && R.ws.readyState === 1) R.ws.send(JSON.stringify({ type: "mirror", key: MIRROR_KEY, ui })); };
  R.raw = (obj) => { if (R.ws && R.ws.readyState === 1) { R.ws.send(JSON.stringify(obj)); return true; } return false; };
  R.as = (person) => { if (R.ws && R.ws.readyState === 1) R.ws.send(JSON.stringify({ type: "as", person: person || null })); };
  R.send = (action) => new Promise(res => {
    if (!R.ws || R.ws.readyState !== 1) return res({ ok: false, error: "Liaison perdue avec l’ordinateur de bord." });
    const reqId = R.seq++; R.pend.set(reqId, res); R.ws.send(JSON.stringify({ type: "action", reqId, action }));
    setTimeout(() => { if (R.pend.has(reqId)) { R.pend.delete(reqId); res({ ok: false, error: "Pas de réponse de l’ordinateur de bord." }); } }, 8000);
  });
  return R;
}

/* Mise à jour sans tout reconstruire : on ne modifie que ce qui a changé. Un élément en cours d'utilisation
   (liste déroulante ouverte, champ en saisie) n'est jamais touché ; les défilements et animations sont conservés. */
function morph(target, html) {
  const tpl = document.createElement("div");
  tpl.innerHTML = html;
  patchChildren(target, tpl);
}
function patchChildren(a, b) {
  const an = Array.from(a.childNodes), bn = Array.from(b.childNodes);
  for (let i = 0; i < bn.length; i++) {
    if (i >= an.length) a.appendChild(bn[i]);
    else patchNode(an[i], bn[i]);
  }
  for (let i = bn.length; i < an.length; i++) an[i].remove();
}
function patchNode(x, y) {
  if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName || ((x.id || y.id) && x.id !== y.id)) { x.replaceWith(y); return; }
  if (x.nodeType === 3 || x.nodeType === 8) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
  if (x.nodeType !== 1) return;
  const busy = x === document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(x.nodeName);
  if (busy) return;
  const oldValueAttr = x.getAttribute("value");
  for (const at of Array.from(x.attributes)) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of Array.from(y.attributes)) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  if (x.nodeName === "INPUT") {
    if ((x.type === "checkbox" || x.type === "radio")) x.checked = y.hasAttribute("checked");
    else if (y.getAttribute("value") !== oldValueAttr) x.value = y.getAttribute("value") ?? "";
    return;
  }
  if (x.nodeName === "TEXTAREA" || x.hasAttribute("data-keep")) return;
  patchChildren(x, y);
  if (x.nodeName === "SELECT") {
    const sel = Array.from(x.options).findIndex(o => o.hasAttribute("selected"));
    if (sel >= 0 && x.selectedIndex !== sel) x.selectedIndex = sel;
  }
}

/* Conserver la saisie en cours quand l'état se rafraîchit. */
function snapshotForm() {
  const a = document.activeElement, o = { vals: {}, focus: a && a.id, sel: null, scroll: document.getElementById("main")?.scrollTop || 0 };
  document.querySelectorAll("#main [id]").forEach(el => { if ("value" in el && el.tagName !== "BUTTON") o.vals[el.id] = el.type === "checkbox" ? el.checked : el.value; });
  if (a && a.id && "selectionStart" in a) try { o.sel = [a.selectionStart, a.selectionEnd]; } catch {}
  return o;
}
function restoreForm(o) {
  for (const [id, v] of Object.entries(o.vals)) { const el = document.getElementById(id); if (!el) continue; if (el.type === "checkbox") el.checked = v; else el.value = v; }
  const m = document.getElementById("main"); if (m) m.scrollTop = o.scroll;
  if (o.focus) { const el = document.getElementById(o.focus); if (el && el !== document.activeElement) { el.focus(); if (o.sel) try { el.setSelectionRange(o.sel[0], o.sel[1]); } catch {} } }
}

/* ---------------------------- Forme réelle (scan de coque) ----------------------------
   Le mod envoie une vue de dessus, une vue de profil et une silhouette par pont, en codage par plages.
   Le grand axe du vaisseau est toujours affiché à l'horizontale. */
let HULL = null;
function unrle(b64, n) {
  const bin = atob(b64 || ""), out = new Uint8Array(n);
  let o = 0;
  for (let i = 0; i + 1 < bin.length && o < n; i += 2) { const run = bin.charCodeAt(i), v = bin.charCodeAt(i + 1); out.fill(v, o, Math.min(n, o + run)); o += run; }
  return out;
}
function hexRgb(h) { const n = parseInt(String(h).slice(1), 16) || 0; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function setHull(h) {
  if (!h || !h.w || !h.d) { HULL = null; return; }
  const n = h.w * h.d, L = h.axis === "x" ? h.w : h.d;
  HULL = Object.assign({}, h, {
    rot: h.axis === "z", pal: (h.palette || []).map(hexRgb),
    tc: unrle(h.top.col, n), ty: unrle(h.top.y, n), sc: unrle(h.side.col, L * h.h), sd: unrle(h.side.depth, L * h.h),
    dk: (h.decks || []).map(d => ({ y0: d.y0, y1: d.y1, occ: d.occ, m: null })), url: {}
  });

  return panel(r.name, r.id, b);

function doorState(d) {
  if (d.broken) return `<span class="pill red">lecteur HS</span>`;

function insigniaSvg(ins, x, y, s = 1) {

    const yy = y + i * 4 * s;
    if (ins.kind === "bar") g += `<rect x="${x}" y="${yy}" width="${8 * s}" height="${2 * s}" fill="${ins.color}"/>`;
    else if (ins.kind === "chevron") g += `<path d="M${x} ${yy} l${4 * s} ${3 * s} l${4 * s} ${-3 * s}" fill="none" stroke="${ins.color}" stroke-width="${1.6 * s}"/>`;
    else g += `<path d="M${x + 4 * s + i * 0} ${yy - 1 * s} l${1.2 * s} ${2.4 * s} l${2.6 * s} 0 l${-2.1 * s} ${1.6 * s} l${0.8 * s} ${2.6 * s} l${-2.5 * s} ${-1.6 * s} l${-2.5 * s} ${1.6 * s} l${0.8 * s} ${-2.6 * s} l${-2.1 * s} ${-1.6 * s} l${2.6 * s} 0z" fill="${ins.color}"/>`;
  }
  return g;
}

   --------------------------------------------------------------------------- */
const LOGIN = { done: false };
function mailOf(name) {
  const base = String(name || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
  return (base || "commandement") + ".meridian@alterra.com";
}
function loginAnim() {
  LOGIN.done = true;
  const me = V.people[V.me.id], hack = !!V.me.intrus;
  const name = V.me.admin && !me ? "Commandement" : (me ? me.name : V.me.name);
  const mail = hack ? "unknown@" + Math.random().toString(16).slice(2, 8) + ".null" : mailOf(name);
  const ov = document.createElement("div");
  ov.className = "login-ov";
  const BR = brandOf(V.branding);
  ov.innerHTML = `<div class="login-box"><div style="width:64px;height:64px;margin:0 auto" aria-hidden="true">${alterraMark(64)}</div>
<div class="login-brand">ALTERRA</div><div class="login-sub">${esc(BR.mission.toUpperCase())} · ${esc(BR.code)} · SYSTÈME DE BORD</div>
<label class="login-l">Identifiant</label><div class="login-f m" id="lg-mail"></div>
<label class="login-l">Mot de passe</label><div class="login-f m" id="lg-pw"></div>
<div class="login-bar"><i id="lg-bar"></i></div><div class="login-st m" id="lg-st">&nbsp;</div></div>`;
  document.body.appendChild(ov);
  let stop = false;
  const end = () => { if (stop) return; stop = true; ov.classList.add("out"); setTimeout(() => ov.remove(), 450); };
  ov.addEventListener("click", end);
  document.addEventListener("keydown", end, { once: true });
  const $ = (id) => ov.querySelector("#" + id), wait = (ms) => new Promise(r => setTimeout(r, ms));
  (async () => {
    await wait(250);
    $("lg-mail").classList.add("on");
    for (let i = 1; i <= mail.length && !stop; i++) { $("lg-mail").textContent = mail.slice(0, i); await wait(28 + Math.random() * 30); }
    await wait(160);
    $("lg-mail").classList.remove("on"); $("lg-pw").classList.add("on");
    const pw = 10 + (name.length % 5);
    for (let i = 1; i <= pw && !stop; i++) { $("lg-pw").textContent = "•".repeat(i); await wait(55 + Math.random() * 40); }
    await wait(150);
    $("lg-pw").classList.remove("on");
    const steps = hack ? ["Contournement du pare-feu…", "Injection de jeton…", "ACCÈS NON AUTORISÉ · SESSION FANTÔME"] : ["Vérification de la puce…", "Chargement du profil…", "Accès accordé · Bienvenue, " + name];

      await wait(k === steps.length - 1 ? 650 : 380);
    }
    end();
  })();
}

/* Manuel de bord : mise en forme légère (titres, puces, étapes, dangers, notes, schémas). */
function manualHtml(t) {
  let out = "", list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of t.split("\n")) {
    const l = raw.trim();
    const sch = l.match(/^\[\[schema:([\w-]+)\]\]$/);
    if (sch) { close(); out += `<div class="svgw schema" style="margin:12px 0;overflow-x:auto">${DIAGRAMS[sch[1]] || ""}</div>`; continue; }
    if (/^- /.test(l)) { if (list !== "ul") { close(); out += "<ul class=\"man\">"; list = "ul"; } out += `<li>${esc(l.slice(2))}</li>`; continue; }
    if (/^\d+\. /.test(l)) { if (list !== "ol") { close(); out += "<ol class=\"man\">"; list = "ol"; } out += `<li>${esc(l.replace(/^\d+\. /, ""))}</li>`; continue; }
    close();
    if (!l) continue;
    if (l.startsWith("# ")) out += `<div class="lbl">${esc(l.slice(2))}</div>`;
    else if (l.startsWith("! ")) out += `<p class="man-warn">${esc(l.slice(2))}</p>`;
    else if (l.startsWith("> ")) out += `<p class="note">${esc(l.slice(2))}</p>`;
    else out += `<p>${esc(l)}</p>`;
  }
  close();
  return out;
}

const niceStep = (span) => { const r = span / 8, p = 10 ** Math.floor(Math.log10(r)); return [1, 2, 2.5, 5, 10].map(k => k * p).find(v => v >= r) || p * 10; };
function jumpBanner() {

function planetDimName(dim) {
