/* ---------- Cartes : zoom (molette, boutons) et déplacement (glisser), conservés entre deux rafraîchissements ---------- */
const MAPV = { asp: {} };
/** Cadre visible d'une carte : ajusté au contenu et au format de la zone, puis zoom et déplacement de l'utilisateur. */
function mapView(key, x0, y0, x1, y1) {
  const asp = MAPV.asp[key] || 1.5;
  let w = Math.max(1e-6, x1 - x0), h = Math.max(1e-6, y1 - y0);
  if (w / h < asp) w = h * asp; else h = w / asp;
  const st = MAPV[key], z = st ? st.z : 1, cx = st ? st.cx : (x0 + x1) / 2, cy = st ? st.cy : (y0 + y1) / 2;
  const vw = w / z, vh = h / z;
  return { x0: cx - vw / 2, y0: cy - vh / 2, x1: cx + vw / 2, y1: cy + vh / 2, w: vw, h: vh, fw: w, fcx: (x0 + x1) / 2, fcy: (y0 + y1) / 2, z };
}
function mapBox(key, v, svg, extra = "") {
  return `<div class="mapbox" data-map="${key}">${svg}<div class="mapctl"><button data-fn="mapZoom" data-arg="${key}:in" aria-label="Zoomer" title="Zoomer">+</button><button data-fn="mapZoom" data-arg="${key}:out" aria-label="Dézoomer" title="Dézoomer">−</button><button data-fn="mapZoom" data-arg="${key}:fit" aria-label="Tout voir" title="Tout voir">⤢</button>${extra}</div><div class="maphint">molette : zoom · glisser : déplacer${v.z !== 1 ? ` · ×${v.z.toFixed(1).replace(".", ",")}` : ""}</div></div>`;
}
function svgAttrs(v, label) { return `viewBox="${v.x0} ${v.y0} ${v.w} ${v.h}" preserveAspectRatio="xMidYMid meet" data-fw="${v.fw}" data-fcx="${v.fcx}" data-fcy="${v.fcy}" role="img" aria-label="${label}"`; }
function mapSet(key, svg, cx, cy, w) {
  const fw = +svg.dataset.fw, z = Math.max(0.5, Math.min(400, fw / w));
  MAPV[key] = { cx, cy, z };
}
let MAPRAF = 0;
const mapRender = () => { if (!MAPRAF) MAPRAF = requestAnimationFrame(() => { MAPRAF = 0; render(); }); };
function mapZoomAt(box, f, px, py) {
  const svg = box.querySelector("svg"); if (!svg) return;
  const vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect();
  const fx = px == null ? .5 : (px - r.left) / r.width, fy = py == null ? .5 : (py - r.top) / r.height;
  const wx = vb.x + fx * vb.width, wy = vb.y + fy * vb.height, nw = vb.width / f, nh = vb.height / f;
  const nx = wx - fx * nw, ny = wy - fy * nh;
  svg.setAttribute("viewBox", `${nx} ${ny} ${nw} ${nh}`);
  mapSet(box.dataset.map, svg, nx + nw / 2, ny + nh / 2, nw);
  mapRender();
}
FN.mapZoom = (el) => {
  const [key, op] = el.dataset.arg.split(":"), box = el.closest(".mapbox");
  if (op === "fit") { delete MAPV[key]; render(); return; }
  if (op === "ship") { const svg = box.querySelector("svg"), sh = NAVS().catalog.ship || { x: 0, z: 0 }, vb = svg.viewBox.baseVal; mapSet(key, svg, sh.x, sh.z, vb.width); render(); return; }
  mapZoomAt(box, op === "in" ? 1.6 : 1 / 1.6);
};
const MAPDRAG = { on: null, x: 0, y: 0, moved: 0, suppress: false };
document.addEventListener("wheel", (e) => {
  const box = e.target.closest && e.target.closest(".mapbox"); if (!box) return;
  e.preventDefault();
  mapZoomAt(box, Math.exp(-e.deltaY * 0.0016), e.clientX, e.clientY);
}, { passive: false });
document.addEventListener("pointerdown", (e) => {
  const box = e.target.closest && e.target.closest(".mapbox");
  if (!box || e.button !== 0 || e.target.closest(".mapctl")) return;
  Object.assign(MAPDRAG, { on: box, x: e.clientX, y: e.clientY, moved: 0 });
});
document.addEventListener("pointermove", (e) => {
  const box = MAPDRAG.on; if (!box) return;
  const dx = e.clientX - MAPDRAG.x, dy = e.clientY - MAPDRAG.y;
  MAPDRAG.moved += Math.abs(dx) + Math.abs(dy); MAPDRAG.x = e.clientX; MAPDRAG.y = e.clientY;
  if (MAPDRAG.moved < 5) return;
  box.classList.add("drag");
  const svg = box.querySelector("svg"), vb = svg.viewBox.baseVal, r = svg.getBoundingClientRect(), k = Math.max(vb.width / r.width, vb.height / r.height);
  const nx = vb.x - dx * k, ny = vb.y - dy * k;
  svg.setAttribute("viewBox", `${nx} ${ny} ${vb.width} ${vb.height}`);
  mapSet(box.dataset.map, svg, nx + vb.width / 2, ny + vb.height / 2, vb.width);
});
document.addEventListener("pointerup", () => {
  const box = MAPDRAG.on; if (!box) return;
  MAPDRAG.on = null; box.classList.remove("drag");
  if (MAPDRAG.moved >= 5) { MAPDRAG.suppress = true; setTimeout(() => { MAPDRAG.suppress = false; }, 0); mapRender(); }
});
document.addEventListener("click", (e) => { if (MAPDRAG.suppress) { e.stopPropagation(); e.preventDefault(); MAPDRAG.suppress = false; } }, true);
/* Format de chaque zone de carte, pour que la carte remplisse tout le cadre. */
function mapMeasure() {
  let again = false;
  document.querySelectorAll(".mapbox").forEach(b => {
    const w = b.clientWidth, h = b.clientHeight; if (!w || !h) return;
    const a = w / h, k = b.dataset.map;
    if (!MAPV.asp[k] || Math.abs(MAPV.asp[k] - a) / a > 0.03) { MAPV.asp[k] = a; again = true; }
  });
  if (again) mapRender();
}
window.addEventListener("resize", () => queueMicrotask(mapMeasure));

function starMap(s) {
  const n = NAVS(), cat = n.catalog, ship = cat.ship || { x: 0, z: 0 };
  const planets = n.jump || !s ? [] : s.planets, fields = n.jump || !s ? [] : s.fields || [];
  const coms = (n.comlinks || []).filter(c => c.dim === SPACE_DIM);
  let x0 = ship.x - 300, x1 = ship.x + 300, z0 = ship.z - 300, z1 = ship.z + 300;
  const grow = (x, z, r) => { x0 = Math.min(x0, x - r); x1 = Math.max(x1, x + r); z0 = Math.min(z0, z - r); z1 = Math.max(z1, z + r); };
  planets.forEach(p => grow(p.pos[0], p.pos[2], p.size * 0.62)); fields.forEach(f => grow(f.pos[0], f.pos[1], f.radius)); coms.forEach(c => grow(c.x, c.z, 60));
  const full = Math.max(x1 - x0, z1 - z0), pad = full * 0.08;
  const v = mapView("star", x0 - pad, z0 - pad, x1 + pad, z1 + pad);
  x0 = v.x0; x1 = v.x1; z0 = v.y0; z1 = v.y1;
  const W = v.w, H = v.h, span = Math.min(W, H), fs = span / 54, step = niceStep(Math.max(W, H));
  let g = `<defs>${planets.map(p => `<radialGradient id="pg-${esc(p.id)}" cx="35%" cy="35%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".35" stop-color="${esc(p.atmosphere)}"/><stop offset="1" stop-color="#050a10"/></radialGradient>`).join("")}</defs>`;
  g += `<rect x="${x0 - W}" y="${z0 - H}" width="${W * 3}" height="${H * 3}" fill="#02060a"/>`;
  for (let x = Math.ceil((x0 - W) / step) * step; x <= x1 + W; x += step) g += `<line x1="${x}" y1="${z0 - H}" x2="${x}" y2="${z1 + H}" stroke="var(--ln)" stroke-width="${fs * .06}"/>`;
  for (let z = Math.ceil((z0 - H) / step) * step; z <= z1 + H; z += step) g += `<line x1="${x0 - W}" y1="${z}" x2="${x1 + W}" y2="${z}" stroke="var(--ln)" stroke-width="${fs * .06}"/>`;
  for (const f of fields) {
    const sel = ui.field === f.id;
    g += `<g class="hit" data-fn="selField" data-arg="${esc(f.id)}"><circle cx="${f.pos[0]}" cy="${f.pos[1]}" r="${f.radius}" fill="var(--amb)" fill-opacity=".05" stroke="${sel ? "#fff" : "var(--amb)"}" stroke-width="${fs * .12}" stroke-dasharray="${fs * .6} ${fs * .4}"/>`;
    const k = f.density === "forte" ? 26 : f.density === "faible" ? 8 : 16;
    for (let i = 0; i < k; i++) { const a = i * 2.39996, r = f.radius * Math.sqrt((i + .5) / k); g += `<rect x="${f.pos[0] + Math.cos(a) * r}" y="${f.pos[1] + Math.sin(a) * r}" width="${fs * .35}" height="${fs * .35}" fill="var(--amb)" fill-opacity=".7" transform="rotate(${i * 37} ${f.pos[0] + Math.cos(a) * r} ${f.pos[1] + Math.sin(a) * r})"/>`; }
    g += `<text x="${f.pos[0]}" y="${f.pos[1] - f.radius - fs * .5}" fill="var(--amb)" font-size="${fs * .8}" text-anchor="middle">${esc(f.name)}</text><title>${esc(f.name)} · densité ${esc(f.density)}</title></g>`;
  }
  for (const p of planets) {
    const r = Math.max(p.size * 0.56, span * 0.014), sel = ui.planet === p.id, x = p.pos[0], z = p.pos[2];
    g += `<g class="hit" data-fn="selPlanet" data-arg="${esc(p.id)}"><circle cx="${x}" cy="${z}" r="${r * 1.18}" fill="${esc(p.atmosphere)}" fill-opacity=".12"/>`;
    if (p.ring) g += `<ellipse cx="${x}" cy="${z}" rx="${r * 1.9}" ry="${r * .55}" fill="none" stroke="${esc(p.atmosphere)}" stroke-opacity=".6" stroke-width="${fs * .25}"/>`;
    g += `<circle cx="${x}" cy="${z}" r="${r}" fill="url(#pg-${esc(p.id)})" stroke="${sel ? "#fff" : p.rethium ? "var(--vio)" : esc(p.atmosphere)}" stroke-width="${fs * (sel ? .28 : .14)}"${p.rethium ? ` stroke-dasharray="${fs * .5} ${fs * .3}"` : ""}/>`;
    g += `<text x="${x}" y="${z + r * 1.18 + fs * 1.1}" fill="${p.rethium ? "var(--vio)" : "var(--tx)"}" font-size="${fs}" text-anchor="middle">${esc(p.name)}${p.rethium ? " ⚠" : ""}</text><title>${esc(p.name)}${p.rethium ? " · Rethium" : ""}</title></g>`;
  }
  // Étoiles : dessinées si elles tiennent sur la carte, sinon flèche au bord avec la distance
  for (const st of (n.jump || !s ? [] : s.suns || [])) {
    const x = st.pos[0], z = st.pos[2], r = st.size / 2, inside = x - r > x0 && x + r < x1 && z - r > z0 && z + r < z1;
    if (inside) { g += `<g><circle cx="${x}" cy="${z}" r="${r * 1.6}" fill="${esc(st.color)}" fill-opacity=".12"/><circle cx="${x}" cy="${z}" r="${r}" fill="${esc(st.color)}"/><circle cx="${x}" cy="${z}" r="${r * 4}" fill="none" stroke="var(--red)" stroke-dasharray="${fs * .5} ${fs * .4}" stroke-width="${fs * .1}"/><text x="${x}" y="${z - r * 1.7}" fill="${esc(st.color)}" font-size="${fs}" text-anchor="middle">${esc(st.name)}</text></g>`; continue; }
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, dx = x - cx, dz = z - cz, t = Math.min((x1 - x0) * .46 / Math.abs(dx || 1e-9), (z1 - z0) * .46 / Math.abs(dz || 1e-9)), ex = cx + dx * t, ez = cz + dz * t, ang = Math.atan2(dz, dx) * 180 / Math.PI, d = Math.hypot(x - ship.x, z - ship.z);
    g += `<g><circle cx="${ex}" cy="${ez}" r="${fs * 1.3}" fill="${esc(st.color)}"/><path d="M${fs * 1.6} 0L${fs * .6} ${fs * .7}L${fs * .6} ${-fs * .7}Z" fill="${esc(st.color)}" transform="translate(${ex} ${ez}) rotate(${ang})"/><text x="${ex}" y="${ez - fs * 1.8}" fill="${esc(st.color)}" font-size="${fs * .85}" text-anchor="middle">${esc(st.name)} · ${(d / 1000).toFixed(1).replace(".", ",")} km</text><title>${esc(st.name)} : zone mortelle à ${Math.round(st.size * 0.8)} blocs du centre</title></g>`;
  }
  const sx = ship.x, sz = ship.z, k = fs * 1.6;
  g += `<g><polygon points="${sx},${sz - k * 1.5} ${sx + k * .7},${sz + k} ${sx},${sz + k * .55} ${sx - k * .7},${sz + k}" fill="var(--cy)" stroke="#fff" stroke-width="${fs * .08}"/><circle cx="${sx}" cy="${sz}" r="${k * 2.4}" fill="none" stroke="var(--cy2)" stroke-opacity=".5" stroke-width="${fs * .08}"/><text x="${sx}" y="${sz + k * 2.4 + fs * 1.2}" fill="var(--cy)" font-size="${fs * .9}" text-anchor="middle" font-family="IBM Plex Mono,monospace">${esc(V.ship.name.toUpperCase())}</text></g>`;
  for (const c of coms) {
    const d = fs * .7, sel = ui.comlink === c.id;
    g += `<g class="hit" data-fn="selCom" data-arg="${esc(c.id)}"><polygon points="${c.x},${c.z - d} ${c.x + d},${c.z} ${c.x},${c.z + d} ${c.x - d},${c.z}" fill="var(--ok)" stroke="${sel ? "#fff" : "var(--bg)"}" stroke-width="${fs * .12}"/><text x="${c.x + d * 1.4}" y="${c.z + fs * .3}" fill="var(--ok)" font-size="${fs * .8}">${esc(c.name)}</text><title>${esc(c.name)} · ${esc(c.id)}</title></g>`;
  }
  if (n.jump) g += `<text x="${(x0 + x1) / 2}" y="${z0 + H * .2}" fill="var(--amb)" font-size="${fs * 1.6}" text-anchor="middle" letter-spacing="${fs * .2}">EN HYPERESPACE</text>`;
  g += `<text x="${x0 + fs * .6}" y="${z0 + fs * 1.4}" fill="var(--dim)" font-size="${fs * .75}" font-family="IBM Plex Mono,monospace">grille ${step} blocs · nord en haut</text>`;
  return mapBox("star", v, `<svg ${svgAttrs(v, "Carte stellaire du système")}>${g}</svg>`, `<button class="w" data-fn="mapZoom" data-arg="star:ship" title="Centrer sur le vaisseau">VAISSEAU</button>`);
}

PAGE.starmap = () => {
  const n = NAVS(), s = curSys(), adm = V.me.admin, ship = n.catalog.ship || { x: 0, y: 100, z: 0 };
  const p = s && ui.planet ? s.planets.find(x => x.id === ui.planet) : null;
  const f = s && ui.field ? (s.fields || []).find(x => x.id === ui.field) : null;
  let side = panel("Système " + (s ? s.name : "inconnu"), "SYS." + (s ? s.id.toUpperCase() : "?"),
    kv("Étoile", esc(s ? s.star || "—" : "—")) + kv("Planètes", s ? s.planets.length + (s.planets.some(x => x.rethium) ? ` <span class="vio">(${s.planets.filter(x => x.rethium).length} à Rethium)</span>` : "") : "—") +
    kv("Antimatière", fmtG(n.fuel)) + (s && s.description ? `<p class="note">${esc(s.description)}</p>` : "") +
    (adm && s ? `<div class="btns" style="margin-top:10px">${btn("Ajouter une planète", null, { fn: "editPlanet", arg: "", cls: "sm" })}${btn("Ajouter un champ de météorites", null, { fn: "editField", arg: "", cls: "sm ghost" })}</div>` : ""));
  if (p) {
    const dist = Math.hypot(p.pos[0] - ship.x, p.pos[1] - ship.y, p.pos[2] - ship.z);
    let b = (p.rethium ? `<div class="banner red" style="margin:0 0 10px">Atmosphère chargée de Rethium : 15 s pour en ressortir, sinon la navette explose.</div>` : "") +
      kv("Distance du vaisseau", n0(dist) + " blocs") + kv("Diamètre", n0(p.size) + " blocs");
    if (adm) b += kv("Dimension", `<span class="m">${esc(p.dimension)}</span>`) + (p.env ? kv("Environnement", esc(`${p.env.g} g · ${p.env.t} °C · ` + Object.entries(p.env.atm || {}).map(([k, v]) => `${k} ${v}`).join(", ") + " kPa")) : "");
    b += (p.info || []).map(i => kv(i.k, esc(i.v) + (adm && i.show === false ? ` <span class="pill vio" style="color:var(--vio);border-color:var(--vio)">masqué</span>` : ""))).join("") || `<p class="empty">Aucune information transmise.</p>`;
    const here = (n.comlinks || []).filter(c => c.dim === p.dimension);
    if (here.length) b += `<div class="lbl">Navettes en surface</div>` + here.map(c => `<div class="vrow"><span>${esc(c.name)} <span class="m dim" style="font-size:11px">${esc(c.id)}</span></span><span class="mu" style="font-size:12px">${ago(c.seen)}</span></div>`).join("");
    if (adm) b += `<div class="btns" style="margin-top:10px">${btn("Modifier", null, { fn: "editPlanet", arg: p.id, cls: "sm" })}${btn("Retirer", { type: "admin.nav.planet.delete", system: s.id, id: p.id }, { cls: "sm red", confirm: `Retirer ${p.name} du système ${s.name} ?` })}</div>`;
    side += panel(p.name, "PLN." + p.id.toUpperCase().slice(0, 10), b);
  } else if (f) {
    side += panel(f.name, "AST", kv("Densité", esc(f.density)) + kv("Rayon", n0(f.radius) + " blocs") + kv("Position", `<span class="m">${n0(f.pos[0])} · ${n0(f.pos[1])}</span>`) +
      (adm ? `<div class="btns" style="margin-top:10px">${btn("Modifier", null, { fn: "editField", arg: f.id, cls: "sm" })}${btn("Supprimer", { type: "admin.nav.field.delete", system: s.id, id: f.id }, { cls: "sm red", confirm: "Supprimer ce champ ?" })}</div>` : ""));
  }
  const coms = (n.comlinks || []).map(c => {
    const where = c.dim === SPACE_DIM ? n0(Math.hypot(c.x - ship.x, c.y - ship.y, c.z - ship.z)) + " blocs du vaisseau" : planetDimName(c.dim);
    return `<div class="vrow${ui.comlink === c.id ? " sel" : ""}"><div style="min-width:0"><b style="font-weight:600">${esc(c.name)}</b> <span class="m dim" style="font-size:11px">${esc(c.id)}</span><div class="mu" style="font-size:12px">${esc(where)} · ${ago(c.seen)}</div></div>${perm("comlink.rename") ? `<span class="row" style="gap:6px;flex:none">${btn("Renommer", null, { fn: "renameCom", arg: c.id, cls: "sm ghost" })}${btn("Retirer", { type: "comlink.delete", id: c.id }, { cls: "sm ghost", confirm: `Retirer ${c.name} du suivi ? Si la liaison com existe encore, elle réapparaîtra à son prochain signal.` })}</span>` : ""}</div>`;
  }).join("") || `<p class="empty">Aucune liaison com posée. Posez un bloc « liaison com » sur une navette pour la suivre ici.</p>`;
  side += panel("Navettes suivies", "COM." + (n.comlinks || []).length, coms);
  queueMicrotask(mapMeasure);
  return `${jumpBanner()}<div class="grid g-map"><div class="stack">${panel("Carte stellaire · " + (s ? s.name : "?"), "NAV.MAP", `${starMap(s)}<div class="row" style="justify-content:center;gap:16px;margin-top:8px;flex-wrap:wrap"><span class="st ok">Navette (liaison com)</span><span class="st warn">Champ de météorites</span><span class="st vac">Planète à Rethium</span><span class="st" style="color:#ffd27a">Étoile (cercle rouge : danger)</span><span class="st" style="color:var(--cy)">Vaisseau</span></div>`)}</div><div class="stack">${side}</div></div>`;
};

function galaxyMap() {
  const n = NAVS(), cat = n.catalog, J = cat.jump || {}, sys = cat.systems || [], cur = curSys();
  if (!sys.length) return `<p class="empty">Aucun système au catalogue.</p>`;
  const xs = sys.map(s => s.x).sort((a, b) => a - b), ys = sys.map(s => s.y).sort((a, b) => a - b);
  const cx = xs[xs.length >> 1], cy = ys[ys.length >> 1];
  const far = (s) => Math.hypot(s.x - cx, s.y - cy) > 150;
  const near = sys.filter(s => !far(s));
  let x0 = Math.min(...near.map(s => s.x)), x1 = Math.max(...near.map(s => s.x)), y0 = Math.min(...near.map(s => s.y)), y1 = Math.max(...near.map(s => s.y));
  const span0 = Math.max(x1 - x0, y1 - y0, 20), pad = span0 * 0.12;
  const v = mapView("gal", x0 - pad, y0 - pad, x1 + pad, y1 + pad);
  const FW = v.fw, FH = FW / (MAPV.asp.gal || 1.5);
  x0 = v.x0; x1 = v.x1; y0 = v.y0; y1 = v.y1;
  const W = v.w, H = v.h, span = Math.min(W, H), fs = span / 46, mx = v.fcx, my = v.fcy;
  const place = (s) => { if (!far(s)) return [s.x, s.y]; const dx = s.x - mx, dy = s.y - my, t = Math.min((FW * .46) / Math.abs(dx || 1e-9), (FH * .42) / Math.abs(dy || 1e-9)); return [mx + dx * t, my + dy * t]; };
  let g = `<rect x="${x0 - W}" y="${y0 - H}" width="${W * 3}" height="${H * 3}" fill="#02060a"/>`;
  for (let i = 0; i < 160; i++) { const rx = mx - FW + ((i * 7919) % 997) / 997 * FW * 2, ry = my - FH + ((i * 104729) % 991) / 991 * FH * 2; g += `<circle cx="${rx}" cy="${ry}" r="${fs * .05}" fill="#fff" fill-opacity="${.15 + (i % 5) * .1}"/>`; }
  for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
    const a = near[i], b = near[j]; if (MC.navDistance(a, b) <= (J.maxLy ?? 12)) g += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--cy2)" stroke-opacity=".18" stroke-width="${fs * .06}"/>`;
  }
  if (cur && !far(cur)) {
    const fr = Math.min(J.maxLy ?? 12, (+n.fuel || 0) / (J.fuelPerLy || 0.5));
    g += `<circle cx="${cur.x}" cy="${cur.y}" r="${J.maxLy ?? 12}" fill="none" stroke="var(--cy)" stroke-opacity=".5" stroke-dasharray="${fs * .4} ${fs * .3}" stroke-width="${fs * .08}"/>`;
    if (fr > 0) g += `<circle cx="${cur.x}" cy="${cur.y}" r="${fr}" fill="var(--ok)" fill-opacity=".08" stroke="var(--ok)" stroke-opacity=".6" stroke-width="${fs * .08}"/>`;
  }
  if (n.jump && cur) { const t = MC.navSystem(cat, n.jump.to); if (t) { const [ax, ay] = place(cur), [bx, by] = place(t); g += `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="var(--amb)" stroke-width="${fs * .15}" stroke-dasharray="${fs * .5} ${fs * .3}"><animate attributeName="stroke-dashoffset" from="${fs * 4}" to="0" dur="1s" repeatCount="indefinite"/></line>`; } }
  for (const s of sys) {
    const [x, y] = place(s), isCur = cur && s.id === cur.id, r = MC.navReach(V, s.id), sel = ui.system === s.id, rad = fs * (far(s) ? 0.45 : 0.45 + Math.min(0.5, s.planets.length * 0.06));
    const col = isCur ? "var(--cy)" : r.ok ? "var(--ok)" : "var(--mu)";
    g += `<g class="hit" data-fn="selSys" data-arg="${esc(s.id)}">`;
    if (far(s)) g += `<line x1="${mx + (x - mx) * .9}" y1="${my + (y - my) * .9}" x2="${x}" y2="${y}" stroke="${col}" stroke-width="${fs * .1}" marker-end="url(#arr)"/>`;
    g += `<circle cx="${x}" cy="${y}" r="${rad * 2.2}" fill="${esc(s.color || "#ffd080")}" fill-opacity=".12"/><circle cx="${x}" cy="${y}" r="${rad}" fill="${esc(s.color || "#ffd080")}" stroke="${sel ? "#fff" : col}" stroke-width="${fs * (sel ? .22 : .12)}"/>`;
    if (isCur) g += `<circle cx="${x}" cy="${y}" r="${rad * 2.6}" fill="none" stroke="var(--cy)" stroke-width="${fs * .1}"><animate attributeName="r" values="${rad * 2};${rad * 3.2};${rad * 2}" dur="2.4s" repeatCount="indefinite"/></circle>`;
    g += `<text x="${x}" y="${y + rad + fs * 1.15}" fill="${col}" font-size="${fs * .9}" text-anchor="middle">${esc(s.name)}${far(s) ? " · " + fmtLy(cur ? MC.navDistance(cur, s) : Math.hypot(s.x - cx, s.y - cy)) : ""}</text>`;
    if (isCur) g += `<text x="${x}" y="${y - rad - fs * .6}" fill="var(--cy)" font-size="${fs * .65}" text-anchor="middle" font-family="IBM Plex Mono,monospace">VOUS ÊTES ICI</text>`;
    g += `<title>${esc(s.name)}${r.ok ? " · atteignable" : r.why ? " · " + esc(r.why) : ""}</title></g>`;
  }
  return mapBox("gal", v, `<svg ${svgAttrs(v, "Carte interstellaire")}><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--mu)"/></marker></defs>${g}</svg>`);
}

PAGE.galaxy = () => {
  const n = NAVS(), cat = n.catalog, J = cat.jump || {}, cur = curSys(), adm = V.me.admin;
  const range = Math.min(J.maxLy ?? 12, (+n.fuel || 0) / (J.fuelPerLy || 0.5));
  let side = panel("État de la navigation", "NAV.STAT", kv("Système actuel", esc(cur ? cur.name : "?")) + kv("Antimatière", fmtG(n.fuel) + ` <span class="dim" style="font-size:12px">${n.fuelMode === "manual" ? "fixée par l’ordinateur" : n.tanks + " cuve(s)"}</span>`) +
    kv("Portée actuelle", fmtLy(range) + ` <span class="dim" style="font-size:12px">max ${J.maxLy ?? 12} al par saut</span>`) + kv("Consommation", fmtG(J.fuelPerLy ?? .5) + " par année-lumière") +
    (n.jump ? kv("Saut en cours", `<span class="amb">→ ${esc((MC.navSystem(cat, n.jump.to) || {}).name || n.jump.to)}</span>`) : ""));
  const s = ui.system && MC.navSystem(cat, ui.system);
  if (s) {
    const r = MC.navReach(V, s.id), isCur = cur && cur.id === s.id;
    let b = (s.description ? `<p class="note" style="margin-top:0">${esc(s.description)}</p>` : "") + kv("Étoile", esc(s.star || "—")) +
      (isCur ? kv("Position", `<span class="cy">le vaisseau est ici</span>`) : kv("Distance", fmtLy(r.dist)) + kv("Antimatière nécessaire", fmtG(r.fuel)) + kv("Durée du saut", `${r.seconds} s`));
    b += `<div class="lbl">Planètes · ${s.planets.length}</div>` + (s.planets.map(p => `<span class="pill${p.rethium ? " vio" : ""}"${p.rethium ? ` style="color:var(--vio);border-color:var(--vio)"` : ""}>${esc(p.name)}${p.rethium ? " ⚠" : ""}</span>`).join("") || `<span class="dim">Aucune</span>`);
    if (!isCur) b += (r.ok ? "" : `<p class="note amb">${esc(r.why)}</p>`) + `<div class="btns" style="margin-top:10px">${btn("Sauter vers " + s.name, { type: "nav.jump", system: s.id }, { perm: "nav.jump", cls: "solid", disabled: !r.ok, confirm: `Lancer le saut vers ${s.name} ? ${fmtG(r.fuel)} d’antimatière, ${r.seconds} s d’hyperespace.` })}</div>`;
    if (adm) b += `<div class="lbl">Poste admin</div><div class="f2"><label class="f">Durée forcée (s)<input type="number" id="fj-s" min="1" placeholder="${r.seconds || 30}"></label><label class="f">Direction<select id="fj-d"><option value="">auto</option>${["north", "south", "east", "west", "up", "down"].map(d => `<option>${d}</option>`).join("")}</select></label></div><div class="btns">${btn("Saut forcé", null, { fn: "forceJump", arg: s.id, cls: "amb sm" })}${btn("Arrivée immédiate", { type: "admin.nav.set", system: s.id }, { cls: "ghost sm", confirm: `Placer le vaisseau dans ${s.name} sans animation ?` })}${btn("Modifier", null, { fn: "editSystem", arg: s.id, cls: "ghost sm" })}${isCur ? "" : btn("Supprimer", { type: "admin.nav.system.delete", id: s.id }, { cls: "red sm", confirm: `Supprimer le système ${s.name} et ses planètes ?` })}</div>`;
    side += panel(s.name, "SYS." + s.id.toUpperCase().slice(0, 12), b);
  } else side += panel("Système", "SYS", `<p class="empty">Cliquez sur un système de la carte.</p>`);
  if (adm) {
    side += panel("Carburant", "FUEL.ADM", `<div class="f2"><label class="f">Mode<select id="fu-m"><option value="tanks"${n.fuelMode !== "manual" ? " selected" : ""}>Somme des cuves à antimatière</option><option value="manual"${n.fuelMode === "manual" ? " selected" : ""}>Valeur fixée</option></select></label><label class="f">Antimatière (g)<input type="number" id="fu-v" min="0" step="0.1" value="${(+n.fuel || 0).toFixed(2)}"></label></div><div class="btns">${btn("Appliquer", null, { fn: "setFuel", cls: "sm" })}</div>`) +
      panel("Règles de saut", "JUMP.ADM", `<div class="f2"><label class="f">Saut maximal (al)<input type="number" id="jr-max" step="0.5" value="${J.maxLy ?? 12}"></label><label class="f">Antimatière par al (g)<input type="number" id="jr-fuel" step="0.05" value="${J.fuelPerLy ?? .5}"></label><label class="f">Durée de base (s)<input type="number" id="jr-base" value="${J.baseSeconds ?? 300}"></label><label class="f">Secondes par al<input type="number" id="jr-per" step="0.5" value="${J.secondsPerLy ?? 120}"></label><label class="f">Durée maximale d’un saut (s)<input type="number" id="jr-maxs" value="${J.maxSeconds ?? 3600}"></label></div><p class="note">Par défaut : 5 min + 2 min par année-lumière, plafonné à 1 h. Un saut de 10 al dure environ 25 min, un saut interrompu par la fin de session reprend à la session suivante.</p><div class="btns">${btn("Enregistrer", null, { fn: "saveRules", cls: "sm" })}${btn("Nouveau système", null, { fn: "editSystem", arg: "", cls: "sm ghost" })}</div>`) +
      panel("Catalogue", "CAT.JSON", `<p class="note" style="margin-top:0">Systèmes, planètes et champs de météorites au format JSON (même format que le mod). Copiez-le pour le sauvegarder ou collez-en un autre pour le remplacer.</p><div class="btns">${btn("Exporter / importer", null, { fn: "catalogJson", cls: "sm" })}${btn("Catalogue par défaut", { type: "admin.nav.reset" }, { cls: "sm red", confirm: "Remplacer tout le catalogue par celui d’origine ?" })}</div>`);
  }
  queueMicrotask(mapMeasure);
  return `${jumpBanner()}<div class="grid g-map"><div class="stack">${panel("Carte interstellaire", "NAV.GAL", `${galaxyMap()}<div class="row" style="justify-content:center;gap:16px;margin-top:8px;flex-wrap:wrap"><span class="st" style="color:var(--cy)">Vaisseau</span><span class="st ok">Atteignable</span><span class="st gone">Hors de portée</span></div><p class="note" style="text-align:center;margin-inline:auto">Cercle pointillé : saut maximal. Disque vert : portée avec l’antimatière à bord. Les systèmes très lointains sont indiqués au bord de la carte avec leur distance.</p>`)}</div><div class="stack">${side}</div></div>`;
};


Object.assign(FN, {
  selPlanet(el) { ui.planet = el.dataset.arg; ui.field = null; ui.comlink = null; render(); },
  selField(el) { ui.field = el.dataset.arg; ui.planet = null; ui.comlink = null; render(); },
  selCom(el) { ui.comlink = el.dataset.arg; render(); },
  selSys(el) { ui.system = el.dataset.arg; render(); },
  renameCom(el) {
    const c = (NAVS().comlinks || []).find(x => x.id === el.dataset.arg); if (!c) return;
    openModal(() => `<h3>Renommer la navette</h3><p class="mu m">${esc(c.id)}</p><label class="f">Nom<input type="text" id="cm-n" maxlength="40" value="${esc(c.name)}"></label>${mfoot()}`,
      () => { act({ type: "comlink.rename", id: c.id, name: val("cm-n") }, "Navette renommée."); return true; });
  },
  forceJump(el) { act({ type: "admin.nav.force", system: el.dataset.arg, seconds: +val("fj-s") || null, direction: val("fj-d") || null }, "Saut forcé lancé."); },
  setFuel() { act({ type: "admin.nav.fuel", mode: val("fu-m"), value: +val("fu-v") }, "Carburant mis à jour."); },
  saveRules() { act({ type: "admin.nav.rules", maxLy: +val("jr-max"), fuelPerLy: +val("jr-fuel"), baseSeconds: +val("jr-base"), secondsPerLy: +val("jr-per"), maxSeconds: +val("jr-maxs") }, "Règles de saut enregistrées."); },

let BRAND_FONTS = null;
async function brandFontCss() {
  if (BRAND_FONTS !== null) return BRAND_FONTS;
  try {
    const css = await (await fetch("https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap")).text();
    let out = "";
    for (const blk of css.split("@font-face").slice(1)) {
      if (!/unicode-range:[^;]*U\+0000-00FF/.test(blk)) continue;
      const url = (blk.match(/url\((https:[^)]+)\)/) || [])[1]; if (!url) continue;
      const buf = new Uint8Array(await (await fetch(url)).arrayBuffer());
      let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      out += "@font-face" + blk.replace(/url\([^)]+\)/, `url(data:font/woff2;base64,${btoa(bin)})`).replace(/}\s*$/, "}");
    }
    BRAND_FONTS = out;
  } catch { BRAND_FONTS = ""; }
  return BRAND_FONTS;
}

/* Enregistrement d'un message au micro du navigateur (ou depuis un fichier), converti en PCM 16 kHz mono. */
const REC = { stream: null, rec: null, chunks: [], t0: 0, pcm: null, dur: 0, timer: 0, url: null };
async function blobToPcm16k(blob) {
  const buf = await blob.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const audio = await ctx.decodeAudioData(buf); ctx.close();
  const len = Math.min(20, audio.duration);
  const off = new OfflineAudioContext(1, Math.ceil(len * 16000), 16000), src = off.createBufferSource();
  src.buffer = audio; src.connect(off.destination); src.start(0);
  const out = (await off.startRendering()).getChannelData(0);
  let peak = 0; for (const v of out) peak = Math.max(peak, Math.abs(v));
  const g = peak > 0 ? Math.min(4, 0.9 / peak) : 1, i16 = new Int16Array(out.length);
  for (let i = 0; i < out.length; i++) i16[i] = Math.max(-32768, Math.min(32767, Math.round(out[i] * g * 32767)));
  let bin = ""; const u8 = new Uint8Array(i16.buffer);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return { b64: btoa(bin), dur: Math.round(out.length / 16000 * 10) / 10, i16 };
}
/* Écoute avec l'effet intercom (même esprit que le filtre du mod). */
function playIntercom(i16) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)(), b = ctx.createBuffer(1, i16.length, 16000), d = b.getChannelData(0);
  for (let i = 0; i < i16.length; i++) d[i] = i16[i] / 32768;
  const src = ctx.createBufferSource(); src.buffer = b;
  const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 350;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200;
  const ws = ctx.createWaveShaper(), curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(2.4 * x) / Math.tanh(2.4); } ws.curve = curve;
  src.connect(hp); hp.connect(lp); lp.connect(ws); ws.connect(ctx.destination); src.start(); src.onended = () => ctx.close();
}
function recKeep() { const n = document.getElementById("rec-n"), i = document.getElementById("rec-i"); if (n) REC.name = n.value; if (i) REC.interval = i.value; }
function recStop() {
  clearInterval(REC.timer);
  if (REC.rec && REC.rec.state !== "inactive") REC.rec.stop();
  if (REC.stream) REC.stream.getTracks().forEach(t => t.stop());
  REC.stream = null;
}
Object.assign(FN, {
  paKind(el) { ui.q[el.dataset.arg + "k"] = el.value; render(); },
  paAlert(el) {
    const l = el.dataset.arg, t = readTarget("al");
    confirmModal(`Déclarer l’alerte ${MC.PA_LEVELS[l][0].toLowerCase()} (${MC.paTargetLabel(V, t)}) ?`, () => act({ type: "alarm.general", level: l, target: t }, "Alerte déclarée."));
  },
  paPlay(el) { act({ type: "pa.play", sound: el.dataset.arg, target: readTarget("sg") }, "Signal diffusé."); },
  spPick(el) { const id = el.dataset.arg, s = ui.spSel || (ui.spSel = []); const i = s.indexOf(id); if (i < 0) s.push(id); else s.splice(i, 1); render(); },
  spMeta() {
    const ids = (ui.spSel || []).slice(), one = ids.length === 1 ? spMeta(ids[0]) : {}, groups = [...new Set(Object.values(PAV().meta || {}).map(m => m.group).filter(Boolean))];
    openModal(() => `<h3>${ids.length === 1 ? "Haut-parleur " + esc(ids[0]) : ids.length + " haut-parleurs"}</h3>${ids.length === 1 ? `<label class="f">Nom<input type="text" id="spm-n" maxlength="40" value="${esc(one.name || "")}"></label>` : ""}<label class="f">Groupe<input type="text" id="spm-g" maxlength="40" list="spm-gl" value="${esc(one.group || "")}" placeholder="aucun"><datalist id="spm-gl">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist></label>${mfoot()}`,
      () => { const a = { type: "admin.pa.meta", ids, group: val("spm-g") }; if (ids.length === 1) a.name = val("spm-n"); act(a, "Haut-parleurs enregistrés."); return true; });
  },
  micSet(el) {
    const id = el.dataset.arg, m = spMeta(id); ui.q.mck = (m.target || {}).kind || "all";
    openModal(() => `<h3>Micro ${esc(id)}</h3><label class="f">Nom<input type="text" id="mc-n" maxlength="40" value="${esc(m.name || "")}"></label>${paTargetPicker("mc")}${mfoot()}`,
      () => { act({ type: "admin.pa.mic", id, name: val("mc-n"), target: readTarget("mc") }, "Micro réglé."); return true; });
  },
  paRec(el) {
    const level = el.dataset.arg, old = (PAV().msgs || {})[level];
    REC.pcm = null; REC.dur = 0; REC.name = null; REC.interval = null;
    openModal(() => `<h3>Message · niveau ${esc(level)}</h3><p class="note" style="margin-top:0">${esc(MC.PA_LEVELS[level][0])}. 20 s au plus.</p>
<div class="btns"><button class="b red" data-fn="recGo" type="button">${REC.stream ? "■ Arrêter" : "● Enregistrer au micro"}</button><label class="b ghost" style="cursor:pointer">Importer un fichier<input type="file" accept="audio/*" id="rec-file" data-fn="recFile" hidden></label>${REC.pcm ? `<button class="b" data-fn="recPlay" type="button">▶ Écouter (effet intercom)</button>` : ""}</div>
<p class="m ${REC.stream ? "red" : "mu"}" id="rec-st">${REC.stream ? "● Enregistrement…" : REC.pcm ? `Prêt : ${String(REC.dur).replace(".", ",")} s` : "Aucun enregistrement."}</p>
<div class="f2"><label class="f">Nom<input type="text" id="rec-n" maxlength="60" value="${esc(REC.name ?? (old ? old.name : "Alerte niveau " + level))}"></label><label class="f">Répéter toutes les (s)<input type="number" id="rec-i" min="10" max="600" value="${REC.interval ?? (old ? old.interval : 30)}"></label></div>${mfoot("Enregistrer")}`,
      () => {
        if (!REC.pcm) { toast("Enregistrez ou importez d’abord un message.", "err"); return false; }
        recStop();
        act({ type: "admin.pa.msg.save", level, pcm: REC.pcm.b64, name: val("rec-n"), interval: +val("rec-i") || 30 }, "Message enregistré.");
        return true;
      });
  },
  async recGo() {
    if (REC.stream) { recStop(); return; }
    try {
      REC.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      REC.chunks = []; REC.rec = new MediaRecorder(REC.stream); REC.t0 = Date.now();
      REC.rec.ondataavailable = (e) => REC.chunks.push(e.data);
      REC.rec.onstop = async () => { try { REC.pcm = await blobToPcm16k(new Blob(REC.chunks, { type: REC.rec.mimeType })); REC.dur = REC.pcm.dur; } catch (e) { toast("Enregistrement illisible : " + e.message, "err"); } recKeep(); drawModal(); };
      REC.rec.start();
      REC.timer = setInterval(() => { const s = (Date.now() - REC.t0) / 1000; const st = document.getElementById("rec-st"); if (st) st.textContent = "● Enregistrement… " + s.toFixed(1).replace(".", ",") + " s"; if (s >= 20) recStop(); }, 200);
      recKeep(); drawModal();
    } catch (e) { REC.stream = null; toast("Micro inaccessible : " + e.message, "err"); }
  },
  async recFile(el) {
    const f = el.files && el.files[0]; if (!f) return;
    try { REC.pcm = await blobToPcm16k(f); REC.dur = REC.pcm.dur; recKeep(); drawModal(); } catch (e) { toast("Fichier audio illisible : " + e.message, "err"); }
  },
  recPlay() { if (REC.pcm) playIntercom(REC.pcm.i16); }
});


/* =====================================================================
   Vue de face : ponts et coursives au centre, sections d'anneau autour.
   C'est de là qu'on agit sur un pont ou une section entière.
   ===================================================================== */
const hullAndCorridors = () => V.decks.filter(d => d.kind !== "ring").slice().sort((a, b) => (b.y0 ?? -1e9) - (a.y0 ?? -1e9) || (a.order ?? 0) - (b.order ?? 0));
const ringDecks = () => V.decks.filter(d => d.kind === "ring");
const ringSections = (did) => Object.values(V.sections).filter(s => s.ring === did).sort((a, b) => (a.index | 0) - (b.index | 0));
const roomsOfSection = (sid) => Object.values(V.rooms).filter(r => r.section === sid);
function worst(list) { return list.map(rs).reduce((a, s) => RANK[s] > RANK[a] ? s : a, "ok"); }
function sectionStatus(s) { return s.state === "ejected" ? "gone" : worst(roomsOfSection(s.id)); }

function frontView() {
  const C = 300, rings = ringDecks(), rows = hullAndCorridors();
  let g = "";
  let ticks = "";
  for (let i = 0; i < 120; i++) { const a = i * Math.PI / 60, l = i % 10 === 0 ? 12 : i % 5 === 0 ? 7 : 3; ticks += `<line x1="${C + 288 * Math.cos(a)}" y1="${C + 288 * Math.sin(a)}" x2="${C + (288 - l) * Math.cos(a)}" y2="${C + (288 - l) * Math.sin(a)}" stroke="var(--ln2)" stroke-width="1"/>`; }
  g += `<g class="spin">${ticks}<circle cx="${C}" cy="${C}" r="272" fill="none" stroke="var(--cyd)" stroke-dasharray="2 9"/></g>`;
  g += `<line x1="${C}" y1="6" x2="${C}" y2="594" stroke="var(--ln)" stroke-dasharray="3 6"/><line x1="6" y1="${C}" x2="594" y2="${C}" stroke="var(--ln)" stroke-dasharray="3 6"/>`;
  ["000", "090", "180", "270"].forEach((t, i) => { const a = -Math.PI / 2 + i * Math.PI / 2; g += `<text x="${C + 296 * Math.cos(a) + (i === 1 ? -4 : i === 3 ? 4 : 0)}" y="${C + 296 * Math.sin(a) + (i === 0 ? 10 : i === 2 ? -3 : 3)}" fill="var(--dim)" font-family="IBM Plex Mono,monospace" font-size="9" text-anchor="${i === 1 ? "end" : i === 3 ? "start" : "middle"}">${t}</text>`; });
  const step = rings.length ? Math.min(48, 128 / rings.length) : 40, band = step * .72;
  rings.forEach((d, i) => {
    const r1 = 142 + i * step, r2 = r1 + band, secs = ringSections(d.id), gap = 0.03;
    g += `<circle cx="${C}" cy="${C}" r="${r2 + 4}" fill="none" stroke="var(--ln)" stroke-width="1"/>`;
    if (secs.length) {
      const n = (d.ring && d.ring.sections) || secs.length;
      secs.forEach(s => {
        const k = s.index | 0, a0 = -Math.PI / 2 + k * 2 * Math.PI / n + gap, a1 = -Math.PI / 2 + (k + 1) * 2 * Math.PI / n - gap, st = sectionStatus(s), sel = ui.sec === s.id;
        const am = (a0 + a1) / 2, rm = (r1 + r2) / 2;
        g += `<path class="hit" data-sec="${esc(s.id)}" d="${arcPath(C, C, r1, r2, a0, a1)}" fill="${COL[st]}" fill-opacity="${st === "gone" ? .1 : st === "ok" ? .3 : .75}" stroke="${sel ? "#fff" : COL[st]}" stroke-width="${sel ? 2.4 : 1}"${st === "gone" ? ' stroke-dasharray="3 4"' : ""}><title>${esc(s.name)} · ${st === "gone" ? "éjectée" : ST[st]} · ${roomsOfSection(s.id).length} pièce(s)</title></path>`;
        g += `<text x="${C + rm * Math.cos(am)}" y="${C + rm * Math.sin(am) + 3.5}" fill="var(--tx)" font-size="10" font-family="IBM Plex Mono,monospace" text-anchor="middle" pointer-events="none">${k + 1}</text>`;
      });
    } else {
      const list = roomsOf(d.id), n = list.length || 1;
      list.forEach((r, k) => {
        const a0 = -Math.PI / 2 + k * 2 * Math.PI / n + gap, a1 = -Math.PI / 2 + (k + 1) * 2 * Math.PI / n - gap, s = rs(r);
        g += `<path class="hit" data-room="${esc(r.id)}" data-deck="${esc(d.id)}" d="${arcPath(C, C, r1, r2, a0, a1)}" fill="${COL[s]}" fill-opacity="${s === "ok" ? .3 : .75}" stroke="${COL[s]}"><title>${esc(r.name)}</title></path>`;
      });
    }
    g += `<text x="${C}" y="${C - r2 - 7}" fill="${ui.deck === d.id && !ui.sec ? "var(--cy)" : "var(--mu)"}" font-size="9.5" letter-spacing="1.5" text-anchor="middle" class="hit" data-deck="${esc(d.id)}">${esc(d.name.toUpperCase().slice(0, 30))}</text>`;
  });
  const hr = 124, n = Math.max(1, rows.length), hasM = rows.some(d => d.kind === "maintenance");
  const unit = Math.min(26, 206 / (rows.filter(d => d.kind !== "maintenance").length + (hasM ? rows.filter(d => d.kind === "maintenance").length * .42 : 0) || 1));
  g += `<circle cx="${C}" cy="${C}" r="${hr + 8}" fill="var(--bg)" stroke="var(--cy2)" stroke-width="1.5"/><circle cx="${C}" cy="${C}" r="${hr}" fill="var(--pn)" stroke="var(--ln2)"/>`;
  g += `<defs><pattern id="mhatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ln2)" stroke-width="2"/></pattern></defs>`;
  g += `<clipPath id="core"><circle cx="${C}" cy="${C}" r="${hr - 4}"/></clipPath><g clip-path="url(#core)">`;
  const total = rows.reduce((a, d) => a + (d.kind === "maintenance" ? unit * .42 : unit), 0);
  let y = C - total / 2;
  for (const d of rows) {
    const m = d.kind === "maintenance", h = m ? unit * .42 : unit, s = deckStatus(d.id), sel = ui.deck === d.id && !ui.sec;
    const dy = Math.max(Math.abs(y - C), Math.abs(y + h - C)), hw = Math.max(40, Math.sqrt(Math.max(0, (hr - 6) ** 2 - dy * dy)));
    g += `<g class="hit" data-deck="${esc(d.id)}"><rect x="${C - hw}" y="${y + .8}" width="${2 * hw}" height="${h - 1.6}" fill="${m ? "url(#mhatch)" : COL[s]}" fill-opacity="${m ? 1 : s === "ok" ? .22 : .6}" stroke="${sel ? "#fff" : m ? "var(--ln2)" : COL[s]}" stroke-width="${sel ? 2 : 1}" stroke-opacity=".9"/>`;
    const fit = Math.max(4, Math.floor((2 * hw - 52) / 6.4));
    if (!m) g += `<text x="${C - hw + 8}" y="${y + h / 2 + 4}" fill="var(--tx)" font-size="11" font-weight="600" pointer-events="none" font-family="IBM Plex Mono,monospace">${esc(String(d.id).slice(0, 6))}</text><text x="${C - hw + 42}" y="${y + h / 2 + 4}" fill="var(--tx)" font-size="11" pointer-events="none">${esc(d.name.length > fit ? d.name.slice(0, fit - 1) + "…" : d.name)}</text>`;
    else if (s !== "ok") g += `<rect x="${C - hw}" y="${y + .8}" width="${2 * hw}" height="${h - 1.6}" fill="${COL[s]}" fill-opacity=".5" pointer-events="none"/>`;
    g += `<title>${esc(d.name)}${d.y0 != null ? ` · Y ${d.y0}–${d.y1}` : ""}${m ? " · coursives d’entretien" : ""}</title></g>`;
    y += h;
  }
  g += `</g>`;
  if (!V.decks.length) g += `<text x="${C}" y="${C}" fill="var(--mu)" text-anchor="middle" font-size="13">Aucune structure reçue</text>`;
  return `<svg viewBox="0 0 600 600" role="img" aria-label="Vue de face : ponts au centre, sections d’anneau autour">${g}</svg>`;
}

/* Ce qui est sélectionné sur la vue de face : un pont, une coursive ou une section d'anneau. */
function groupPanel() {
  const sec = ui.sec && V.sections[ui.sec], deck = V.decks.find(d => d.id === ui.deck);
  if (!sec && !deck) return panel("Sélection", "—", `<p class="empty">Cliquez un pont, une coursive ou une section d’anneau.</p>`);
  const scope = sec ? "section" : "deck", id = sec ? sec.id : deck.id;
  const rooms = (sec ? roomsOfSection(sec.id) : roomsOf(deck.id)).filter(r => rs(r) !== "gone");
  const ids = new Set(rooms.map(r => r.id));
  const doors = Object.values(V.doors).filter(d => d.rooms.some(x => ids.has(x)) || (!sec && d.deck === deck.id));
  const occ = perm("crew.vitals") ? people().filter(p => p.room && ids.has(p.room)) : null;
  const st = sec ? sectionStatus(sec) : deckStatus(deck.id);
  const kind = sec ? "Section d’anneau" : deck.kind === "maintenance" ? "Coursives d’entretien" : deck.kind === "ring" ? "Anneau" : "Pont";
  const locked = doors.some(d => d.state.lockdown), alarm = rooms.some(r => r.alarm);
  const G = (op) => ({ type: "group.act", scope, id, op });
  let b = `<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="st ${st}">${st === "gone" ? "Éjectée" : ST[st]}</span><span class="mu m" style="font-size:12px">${esc(kind)}${!sec && deck.y0 != null ? ` · Y ${deck.y0}–${deck.y1}` : ""}${sec ? " · " + esc(deckName(sec.ring)) : ""}</span></div>`;
  b += kv("Pièces", rooms.length) + kv("Portes", doors.length) + (occ ? kv("Personnes présentes", `<span class="${occ.length ? "amb" : ""}">${occ.length}</span>`) : "");
  if (sec && sec.state === "ejected") return panel(sec.name, sec.id, b + `<p class="empty">Section éjectée.</p>`);
  b += `<div class="lbl">Agir sur tout${sec ? "e la section" : " le " + (deck.kind === "maintenance" ? "niveau" : "pont")}</div><div class="btns">`;
  b += locked ? btn("Lever l’isolement", G("unlockdown"), { perm: "deck.act", cls: "ghost" }) : btn("Isoler (sceller les portes)", G("lockdown"), { perm: "deck.act", cls: "red", confirm: `Sceller les ${doors.length} portes de ${sec ? sec.name : deck.name} ?` });
  b += btn("Verrouiller les portes", G("lock"), { perm: "deck.act", cls: "amb" }) + btn("Déverrouiller", G("unlock"), { perm: "deck.act", cls: "ghost" });
  b += `</div><div class="btns" style="margin-top:8px">`;
  b += alarm ? btn("Couper l’alarme", G("alarmOff"), { perm: "deck.act", cls: "ghost" }) : btn("Alarme", G("alarm"), { perm: "deck.act", cls: "amb" });
  b += btn("Pressuriser", G("pressurize"), { perm: "deck.act" }) + btn("Vider l’air", G("vent"), { perm: "deck.act", cls: "red", confirm: `Vider l’air de ${rooms.length} pièce(s) de ${sec ? sec.name : deck.name} ?${occ && occ.length ? " " + occ.length + " personne(s) présente(s)." : ""}` });
  if (sec && sec.ejectable) b += btn("Éjecter (code 1)", { type: "proc.eject.start", section: sec.id }, { perm: "proc.eject", cls: "red", confirm: `Lancer l’éjection de ${sec.name} ? Un second officier devra confirmer.` });
  b += `</div>`;
  b += `<div class="lbl">Pièces</div>` + (rooms.length ? rooms.slice(0, 40).map(r => `<div class="vrow" data-room="${esc(r.id)}" style="cursor:pointer"><span>${esc(r.name)}</span><span class="st ${rs(r)}">${ST[rs(r)]}</span></div>`).join("") : `<p class="empty">Aucune pièce connue ici.${sec ? " Nommez-en avec /rebirth ClRoom dans l’anneau." : ""}</p>`);
  return panel(sec ? sec.name : deck.name, (sec ? sec.id : deck.id).toUpperCase(), b);
}

/* Écran des alertes de la passerelle : lisible de loin, pensé pour un écran en jeu. */

FN.brkSel = (el) => { ui.brk = el.dataset.arg; render(); };
FN.brkRating = (el) => { const w = parseFloat(String(val("brk-w")).replace(",", ".")); if (!(w > 0)) return toast("Calibre invalide.", "err"); act({ type: "power.rating", breaker: el.dataset.arg, watts: w * 1000 }, "Calibre transmis."); };

/* =====================================================================
   Réseaux : câbles, gaz, eau, chaleur, respirabilité, sur le plan des ponts
   ===================================================================== */
const LAYERS = [["cables", "Câbles électriques"], ["gas", "Conduites de gaz"], ["water", "Conduites d’eau"], ["heat", "Chaleur"], ["breath", "Respirabilité"]];
const GAS_COL = { O2: "#4aa3ff", H2: "#ff6b5a", N2: "#a8b4bf", CO2: "#b58a5a", CH4: "#f5a83a", NH3: "#c9e06a", AIR: "#62e6f2", H2O: "#3a8fe0", vide: "#4f6b74", "?": "#7f9fa9" };

const DIRV = { 2: [0, -1], 3: [0, 1], 4: [-1, 0], 5: [1, 0] };

/* Respirabilité : 0 = vide, 1 = mortel, 2 = difficile, 3 = bon. */
function breathScore(e) {
  if (!e || e.p == null) return -1;
  if (e.p < 15) return 0;
  const po2 = e.p * (e.o2 || 0) / 100;
  if (po2 < 10 || (e.co2 || 0) > 5 || (e.h2 || 0) > 4) return 1;

const BREATH = [["#a88dff", "Vide"], ["#ff5266", "Irrespirable"], ["#f5a83a", "Difficile"], ["#43d9a8", "Respirable"]];

const BODY_R = [[2, 0, 4, 4], [2, 4, 4, 6], [6, 4, 2, 6], [0, 4, 2, 6], [4, 10, 2, 6], [2, 10, 2, 6]];

  return `<svg viewBox="-.2 -.2 8.4 16.4" width="${size / 2}" height="${size}" style="flex:none;width:${size / 2}px;height:${size}px;max-width:none">${g}</svg>`;

/* ----------------------------------------------------------------- Serpent orbital */
let SNAKE = null, snakeTimer = 0;
function snakeStart() { SNAKE = { body: [[8, 8], [7, 8], [6, 8]], dir: [1, 0], next: [1, 0], food: [12, 8], score: 0, dead: false, best: Math.max(SNAKE ? SNAKE.best : 0, +(lsGet("mw.snake") || 0)) }; clearInterval(snakeTimer); snakeTimer = setInterval(snakeStep, 120); }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function snakeStep() {

  if (!ui.wins.some(w => w.app === "serpent" && !w.min)) return;
  S.dir = S.next; const N = 20; const h = [(S.body[0][0] + S.dir[0] + N) % N, (S.body[0][1] + S.dir[1] + N) % N];
  if (S.body.some(b => b[0] === h[0] && b[1] === h[1])) { S.dead = true; if (S.score > S.best) { S.best = S.score; lsSet("mw.snake", S.best); } snakeDraw(); render(); return; }
  S.body.unshift(h);
  if (h[0] === S.food[0] && h[1] === S.food[1]) { S.score++; do { S.food = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)]; } while (S.body.some(b => b[0] === S.food[0] && b[1] === S.food[1])); }
  else S.body.pop();
  snakeDraw();
}
function snakeDraw() {

  for (let i = 0; i < 40; i++) { g.fillStyle = "rgba(255,255,255," + ((i * 37) % 10) / 40 + ")"; g.fillRect((i * 97) % cv.width, (i * 53) % cv.height, 1, 1); }

  return hits.find(h => h.object.userData.room) || hits[0] || null;
}
function hover3d(e) {
  if (!V3.pick.length) return;
  const h = ray3d(e), ud = h && h.object.userData;
  V3.tip.textContent = !ud ? "" : ud.room && V.rooms[ud.room] ? V.rooms[ud.room].name + " · " + deckName(V.rooms[ud.room].deck) : ud.sec && V.sections[ud.sec] ? V.sections[ud.sec].name : "";
}
function click3d(e) {
  const h = ray3d(e), ud = h && h.object.userData;
  if (!ud) return;
  if (ud.room) { ui.room = ud.room; ui.sec = null; ui.door = null; ui.deck = V.rooms[ud.room] ? V.rooms[ud.room].deck : ui.deck; }
  else if (ud.sec) { ui.sec = ud.sec; ui.room = null; ui.deck = V.sections[ud.sec] ? V.sections[ud.sec].ring : ui.deck; }
  render();
}
FN.v3view = (el) => {
  const k = el.dataset.arg;
  const ax = (HULL && HULL.axis === "z") || (ringDecks()[0] && ringDecks()[0].ring && ringDecks()[0].ring.axis === "z");
  const along = ax ? 0 : Math.PI / 2;
  if (k === "face") { V3.yaw = along; V3.pitch = 0.02; }
  if (k === "side") { V3.yaw = along + Math.PI / 2; V3.pitch = 0.02; }
  if (k === "top") { V3.pitch = 1.49; }
  if (k === "iso") { V3.yaw = along + 0.8; V3.pitch = 0.42; }
  V3.dirty = true;
};
FN.v3hull = () => { V3.hideHull = !V3.hideHull; render(); };

/* =====================================================================
   Discussion avec l'ordinateur de bord. Le staff incarne l'ordinateur ;
   chaque membre du staff peut se faire notifier (en jeu et sur ce navigateur).
   ===================================================================== */
const CHAT = { seen: null, to: null };
PAGE.chat = () => {
  const chats = V.chats || {};
  const bubble = (m, mine, who) => `<div style="display:flex;justify-content:${mine ? "flex-end" : "flex-start"};margin:6px 0"><div style="max-width:78%;padding:7px 10px;border:1px solid ${mine ? "var(--cy2)" : "var(--ln2)"};background:${mine ? "rgba(98,230,242,.08)" : "rgba(3,8,12,.5)"}"><div class="m" style="font-size:10.5px;color:${m.from === "ai" ? "var(--cy)" : "var(--mu)"};letter-spacing:.08em">${esc(who)} · ${fmtT(m.t)}</div><div style="white-space:pre-wrap;word-break:break-word">${esc(m.text)}</div></div></div>`;
  const box = (ph) => `<div class="row" style="margin-top:10px;align-items:stretch"><textarea id="chat-in" rows="2" maxlength="500" placeholder="${esc(ph)}" style="flex:1;min-width:0;resize:vertical"></textarea>${btn("Envoyer", null, { fn: "chatSend", cls: "solid" })}</div>`;
  if (!V.me.admin) {
    const list = chats[V.me.id] || [];
    return panel("Ordinateur de bord", "AI.LINK", `<p class="note" style="margin-top:0">Parlez à l’ordinateur du Meridian. Il vous répondra ici.</p><div id="chat-log" style="max-height:52vh;overflow:auto;padding-right:4px">${list.length ? list.map(m => bubble(m, m.from === "p", m.from === "ai" ? "ORDINATEUR" : V.me.name)).join("") : `<p class="empty">Aucun échange. Écrivez votre premier message.</p>`}</div>${box("Votre message à l’ordinateur…")}`);
  }
  const me = V.people[V.me.id] || {};
  const threads = Object.entries(chats).filter(([, l]) => l.length).map(([pid, l]) => ({ pid, l, last: l[l.length - 1], unread: (V.chatUnread || {})[pid] })).sort((a, b) => b.last.t - a.last.t);
  if (!CHAT.to || !chats[CHAT.to]) CHAT.to = threads[0] ? threads[0].pid : null;
  const nm = (pid) => V.people[pid] ? V.people[pid].name : pid.slice(0, 8);
  const left = `<div class="vrow" style="border:0"><span>Me notifier des nouveaux messages<div class="mu" style="font-size:12px">En jeu (si vous êtes connecté) et sur ce navigateur.</div></span><button class="sw" role="switch" aria-checked="${!!me.notifyAi}" data-fn="chatNotify" aria-label="Notifications"></button></div>
<div class="lbl">Conversations</div>${threads.length ? threads.map(t => `<div class="vrow" data-fn="chatTo" data-arg="${esc(t.pid)}" style="cursor:pointer;${CHAT.to === t.pid ? "background:rgba(98,230,242,.08)" : ""}"><span style="min-width:0"><b style="font-weight:600">${esc(nm(t.pid))}</b>${t.unread ? ` <span class="pill amb">nouveau</span>` : ""}<div class="mu" style="font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.last.text)}</div></span><span class="m dim" style="font-size:11px">${fmtT(t.last.t)}</span></div>`).join("") : `<p class="empty">Aucune conversation.</p>`}`;
  const cur = CHAT.to ? chats[CHAT.to] : null;
  const right = cur ? `<div id="chat-log" style="max-height:52vh;overflow:auto;padding-right:4px">${cur.map(m => bubble(m, m.from === "ai", m.from === "ai" ? "ORDINATEUR" + (m.who ? " (" + m.who + ")" : "") : nm(CHAT.to))).join("")}</div>${box("Répondre en tant qu’ordinateur de bord…")}` : `<p class="empty">Sélectionnez une conversation.</p>`;
  if (CHAT.to && (V.chatUnread || {})[CHAT.to] && CHAT.reading !== CHAT.to) { CHAT.reading = CHAT.to; const to = CHAT.to; queueMicrotask(() => act({ type: "chat.read", to }).finally(() => { CHAT.reading = null; })); }
  return `<div class="grid g-2">${panel("Discussion · " + (CHAT.to ? nm(CHAT.to) : "—"), "AI.LINK", right)}${panel("Ordinateur de bord · staff", "AI.STAFF", left)}</div>`;
};
FN.chatSend = () => {
  const el = document.getElementById("chat-in"), text = el ? el.value.trim() : "";
  if (!text) return;
  const a = { type: "chat.send", text };
  if (V.me.admin && CHAT.to) a.to = CHAT.to;
  act(a).then(r => { if (r.ok && el) { el.value = ""; } });
};
FN.chatTo = (el) => { CHAT.to = el.dataset.arg; render(); };
FN.chatNotify = () => {
  const me = V.people[V.me.id] || {}, on = !me.notifyAi;
  if (on && "Notification" in window && Notification.permission === "default") try { Notification.requestPermission(); } catch {}
  act({ type: "chat.notify", on }, on ? "Notifications activées." : "Notifications coupées.");
};
/* Nouveau message d'un joueur : avertir le staff qui a activé le réglage. */
function chatWatch() {
  if (!V || !V.me || !V.me.admin) return;
  let n = 0, last = null;
  for (const [pid, l] of Object.entries(V.chats || {})) for (const m of l) if (m.from === "p") { n++; if (!last || m.t > last.t) last = Object.assign({ pid }, m); }
  if (CHAT.seen !== null && n > CHAT.seen && last) {
    const me = V.people[V.me.id] || {}, who = V.people[last.pid] ? V.people[last.pid].name : "Quelqu’un";
    if (me.notifyAi) {
      toast("Message pour l’ordinateur · " + who + " : " + last.text.slice(0, 80));
      try { if ("Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") new Notification("MERIDIAN · " + who, { body: last.text.slice(0, 160) }); } catch {}
    }
  }
  CHAT.seen = n;
}

/* =====================================================================
   Événements
   ===================================================================== */
document.addEventListener("click", (e) => {
  const m = e.target.closest("#modal [data-m]");
  if (m) { if (m.dataset.m === "cancel") return closeModal(); const ok = modal.onOk && modal.onOk(m.dataset.m); if (ok !== false) closeModal(); return; }
  const add = e.target.closest("#modal [data-add]");
  if (add) { readClauses(); const t = val("cl-add"); ui.draft.rule.any.push({ t, v: t === "min" ? 3 : t === "lv" ? [] : t === "grp" ? MC.GROUPS[0] : t === "team" ? "jour" : "" }); drawModal(); return; }
  const rm = e.target.closest("#modal [data-rm]");
  if (rm) { readClauses(); ui.draft.rule.any.splice(+rm.dataset.rm, 1); drawModal(); return; }
  const cra = e.target.closest("#modal [data-cr]");
  if (cra) { readCraft(); FN.crEdit2(cra.dataset.cr, cra.dataset.i); return; }
  if (e.target.id === "modal") return closeModal();
  const el = e.target.closest("[data-cmd],[data-fn],[data-go],[data-room],[data-door],[data-person],[data-deck],[data-sec]");
  if (!el || el.disabled) return;
  if (el.tagName === "SELECT" || el.tagName === "INPUT") return;
  if (el.dataset.cmd) {
    const a = JSON.parse(el.dataset.cmd);
    if (el.dataset.confirm) return confirmModal(el.dataset.confirm, () => act(a, "Ordre transmis."));
    return act(a);
  }
  if (el.dataset.fn && FN[el.dataset.fn]) { FN[el.dataset.fn](el); if (el.dataset.fn !== "sec") return; }
  if (el.dataset.room) { ui.room = el.dataset.room; ui.door = null; const r = V.rooms[ui.room]; if (r) { ui.deck = r.deck; if (ui.sec && r.section !== ui.sec) ui.sec = null; } }
  else if (el.dataset.door) { ui.door = el.dataset.door; if (ui.page === "plan") ui.room = null; }
  else if (el.dataset.sec) { ui.sec = el.dataset.sec; ui.room = null; ui.door = null; if (V.sections[ui.sec] && V.sections[ui.sec].ring) ui.deck = V.sections[ui.sec].ring; if (ui.page !== "plan" && ui.page !== "vue3d") ui.page = "plan"; }
  else if (el.dataset.deck) { if (ui.deck !== el.dataset.deck || ui.sec) { ui.room = null; ui.door = null; } ui.sec = null; ui.deck = el.dataset.deck; if (ui.page !== "plan" && ui.page !== "vue3d") ui.page = "plan"; }
  if (el.dataset.person) ui.person = el.dataset.person;
  if (el.dataset.go) ui.page = el.dataset.go;
  else if (el.dataset.room && ui.page === "overview") ui.page = "plan";
  render();
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.closest("#modal") && !["scrMode", "paKind", "recFile", "crRedraw"].includes(el.dataset.fn)) return;
  if (el.dataset.fn === "paKind" && el.closest("#modal")) { ui.q[el.dataset.arg + "k"] = el.value; drawModal(); return; }
  if (el.dataset.fn === "crRedraw" && el.closest("#modal")) { readCraft(); drawModal(); return; }
  if (el.dataset.fn && FN[el.dataset.fn] && (el.tagName === "SELECT" || el.type === "range" || el.type === "checkbox" || el.type === "file")) FN[el.dataset.fn](el);
});
let qTimer = null;
document.addEventListener("input", (e) => { const el = e.target; if (el.dataset.fn === "q" || el.dataset.fn === "kbQ") { clearTimeout(qTimer); qTimer = setTimeout(() => FN[el.dataset.fn](el), 220); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.getElementById("modal").hidden) closeModal();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("nav a,tbody tr,svg .hit,.al,[data-go]:not(button)")) { e.preventDefault(); e.target.click(); }
});

/* Horloge et comptes à rebours, sans redessiner la page. */
setInterval(() => {
  const c = document.querySelector("[data-clock]"); if (c && c.firstChild) c.firstChild.nodeValue = fmtT(now());
  document.querySelectorAll("[data-cd]").forEach(el => { el.textContent = String(Math.max(0, Math.ceil((+el.dataset.cd - now()) / 1000))).padStart(2, "0"); });
}, 250);

renderChrome();
boot();
</script>
