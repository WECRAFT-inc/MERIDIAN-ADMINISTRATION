<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Meridian · Console de bord</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Console HUD : rail de navigation à gauche, bandeau d'état en haut, téléscripteur du journal en bas.
   Thème unique sombre (console de vaisseau), choisi délibérément. */
:root{
  --bg:#03080c;--bg2:#06121a;--pn:#081720;--pn2:#0b1f2a;--ln:#14303b;--ln2:#22505e;
  --cy:#62e6f2;--cy2:#2fb3c2;--cyd:#0d3c47;--tx:#d3ebef;--mu:#7f9fa9;--dim:#405c66;
  --amb:#f5a83a;--red:#ff5266;--vio:#a88dff;--ok:#43d9a8;
  --f-disp:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--f-disp);overflow:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1100px 600px at 55% -10%,rgba(47,179,194,.10),transparent 70%),
  linear-gradient(rgba(98,230,242,.035) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(98,230,242,.035) 1px,transparent 1px) 0 0/32px 32px}
.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.dim{color:var(--dim)}.cy{color:var(--cy)}.amb{color:var(--amb)}.red{color:var(--red)}.vio{color:var(--vio)}.okc{color:var(--ok)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* ---------- Coque de l'application ---------- */
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:200px 1fr}
.top{grid-column:1/-1;min-width:0}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ln);background:linear-gradient(180deg,rgba(8,23,32,.95),rgba(6,18,26,.85))}
.brand{font-weight:700;font-size:26px;letter-spacing:.24em;line-height:1;color:var(--tx);text-shadow:0 0 18px rgba(98,230,242,.25)}
.brand small{display:block;margin-top:5px;font-size:10.5px;font-weight:500;letter-spacing:.2em;color:var(--mu)}
.hsep{width:1px;align-self:stretch;background:var(--ln)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;font:600 12px/1.2 var(--f-disp);letter-spacing:.12em;text-transform:uppercase;border:1px solid currentColor;clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
.chip i{width:7px;height:7px;background:currentColor;display:block}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--amb)}.chip.crit{color:var(--red);animation:blink 1.2s steps(2) infinite}.chip.off{color:var(--dim)}.chip.cy{color:var(--cy)}
@keyframes blink{50%{background:rgba(255,82,102,.16)}}
.clock{font:500 20px/1 var(--f-mono);letter-spacing:.06em}
.clock small{display:block;font:500 10px var(--f-disp);letter-spacing:.18em;color:var(--mu);margin-top:4px}
.sp{flex:1}
.who{display:flex;align-items:center;gap:10px;text-align:right}
.who b{display:block;font-weight:600;font-size:14px}
.who span{font-size:11.5px;color:var(--mu);letter-spacing:.04em}
.lvl{font:600 18px/1 var(--f-mono);color:var(--cy);border:1px solid var(--cy2);padding:6px 9px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;padding-block:6px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--ln);background:rgba(98,230,242,.04)}
.demo b{color:var(--cy);letter-spacing:.14em;font-size:11px;font-weight:600;margin-right:6px}
.demo select{min-height:30px;padding:4px 8px}
select,input[type=text],input[type=number],input[type=time],input[type=search],input[type=password],textarea{background:var(--bg2);border:1px solid var(--ln2);padding:7px 9px;min-height:36px;border-radius:0;max-width:100%}
select:hover,input:hover{border-color:var(--cy2)}

nav{border-right:1px solid var(--ln);padding:14px 0;overflow:auto;background:rgba(6,18,26,.6)}
nav a{display:flex;align-items:center;gap:10px;padding:9px 18px;color:var(--mu);text-decoration:none;font-weight:500;letter-spacing:.06em;font-size:13.5px;border-left:2px solid transparent;cursor:pointer}
nav a:hover{color:var(--tx);background:rgba(98,230,242,.04)}
nav a[aria-current=page]{color:var(--cy);border-left-color:var(--cy);background:linear-gradient(90deg,rgba(98,230,242,.12),transparent)}
nav a .n{font:500 10.5px var(--f-mono);color:var(--dim);width:18px}
nav a .bad{margin-left:auto;font:600 11px var(--f-mono);background:var(--red);color:var(--bg);padding:1px 6px}
nav .navsep{margin:14px 18px 6px;font-size:10px;letter-spacing:.2em;color:var(--dim)}

main{overflow:auto;padding-block:16px 24px;padding-left:16px;padding-right:max(18px,env(safe-area-inset-right,0px));min-width:0}
footer{grid-column:1/-1;border-top:1px solid var(--ln);background:rgba(6,18,26,.92);font:12px var(--f-mono);color:var(--mu);display:flex;overflow:hidden;white-space:nowrap;padding-bottom:env(safe-area-inset-bottom,0px)}
footer .tl{padding:7px 14px;color:var(--cy);border-right:1px solid var(--ln);letter-spacing:.12em;flex:none}
footer .tk{overflow:hidden;flex:1;position:relative}
footer .tk div{display:inline-block;padding:7px 0;animation:tick 70s linear infinite}
footer .tk span{margin-right:42px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.banner{padding:8px 18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px}
.banner.red{background:rgba(255,82,102,.14);color:var(--red);border-bottom:1px solid var(--red)}
.banner.amb{background:rgba(245,168,58,.12);color:var(--amb);border-bottom:1px solid rgba(245,168,58,.5)}

/* ---------- Panneaux chanfreinés ---------- */
.pn{--c:12px;position:relative;padding:1px;background:linear-gradient(160deg,var(--ln2),var(--ln) 40%,var(--ln) 70%,var(--ln2));clip-path:polygon(var(--c) 0,100% 0,100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,0 100%,0 var(--c));min-width:0}
.pn>.pi{height:100%;background:linear-gradient(180deg,rgba(98,230,242,.035),transparent 120px),var(--pn);clip-path:inherit;padding:14px 16px 16px;min-width:0}
.ph{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.ph h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cy)}
.ph .code{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--dim);letter-spacing:.08em}
.grid{display:grid;gap:14px}
.g-ov{grid-template-columns:minmax(240px,1fr) minmax(360px,1.7fr) minmax(260px,1fr)}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
.g-2b{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.login-ov{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:radial-gradient(ellipse at center,#06141c 0%,#020507 75%);transition:opacity .45s;padding:16px}
.login-ov.out{opacity:0;pointer-events:none}
.login-box{width:min(420px,100%);text-align:left}
.login-box svg{display:block;margin:0 auto 10px}
.login-brand{text-align:center;font:600 26px/1 "IBM Plex Sans",system-ui,sans-serif;letter-spacing:.42em;color:var(--tx);padding-left:.42em}
.login-sub{text-align:center;font:11px "IBM Plex Mono",monospace;letter-spacing:.2em;color:var(--mu);margin:10px 0 28px}
.login-l{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px;letter-spacing:.06em}
.login-f{min-height:38px;padding:9px 11px;border:1px solid var(--ln2);background:var(--bg2);color:var(--cy);font-size:14px;word-break:break-all}
.login-f.on::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--cy)}
.login-bar{height:2px;background:var(--ln);margin:22px 0 10px}.login-bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .3s}
.login-st{font-size:12px;color:var(--mu);letter-spacing:.06em;min-height:1.4em}
.intrus-b{margin:0 0 14px;padding:8px 12px;border:1px solid var(--red);color:var(--red);font:600 12px "IBM Plex Mono",monospace;letter-spacing:.16em;background:rgba(255,82,102,.08);animation:blink 1.6s steps(2) infinite}
.brand-board{display:flex;justify-content:center;background:repeating-conic-gradient(var(--ln) 0 25%,transparent 0 50%) 0 0/18px 18px;border-radius:6px;padding:12px}.brand-board svg{max-width:100%;height:auto;max-height:360px}.brand-board.wide svg{width:100%}
.man-body{max-width:78ch;line-height:1.6}.man-body p{margin:.5em 0}ul.man,ol.man{margin:.4em 0 .8em;padding-left:1.4em}ul.man li,ol.man li{margin:.25em 0}.man-warn{border-left:3px solid var(--red);padding:6px 10px;background:rgba(255,82,102,.08);color:var(--tx)}.schema svg{min-width:640px;width:100%;height:auto}
.planwide svg{max-height:72vh;display:block;margin-inline:auto}
.g-map{grid-template-columns:minmax(0,1fr) minmax(300px,380px)}
@media (max-width:1100px){.g-map{grid-template-columns:1fr}}
.mapbox{position:relative;height:clamp(420px,calc(100vh - 290px),920px);background:#02060a;border:1px solid var(--ln);overflow:hidden;touch-action:none;cursor:grab;user-select:none}
.mapbox.drag{cursor:grabbing}
.mapbox>svg{width:100%;height:100%}
.mapctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.mapctl button{width:34px;height:34px;border:1px solid var(--ln2);background:rgba(3,10,15,.85);color:var(--cy);font:600 17px/1 "IBM Plex Mono",monospace;cursor:pointer}
.mapctl button:hover{border-color:var(--cy)}
.mapctl button.w{width:auto;padding:0 9px;font-size:11px;letter-spacing:.08em}
.maphint{position:absolute;left:10px;bottom:8px;font:11px "IBM Plex Mono",monospace;color:var(--dim);pointer-events:none}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1180px){.g-ov{grid-template-columns:1fr 1fr}.g-ov>.center{grid-column:1/-1;order:-1}}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:0}
  nav a{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:10px 14px}
  nav a[aria-current=page]{border-bottom-color:var(--cy)}
  nav .navsep,nav a .n{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g-ov,.g-2,.g-2b{grid-template-columns:1fr}
  .brand{font-size:22px}.hsep{display:none}}

/* ---------- Éléments ---------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--ln);align-items:baseline}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--mu);font-size:13px}
.kv>b{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.big{font:500 30px/1 var(--f-mono);letter-spacing:.02em}
.big small{font-size:13px;color:var(--mu);margin-left:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--ln);padding:10px 12px;background:rgba(3,8,12,.4)}
.tile span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.bar{height:5px;background:var(--cyd);margin:5px 0 2px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--cy2)}
.bar.seg{background:repeating-linear-gradient(90deg,var(--cyd) 0 6px,transparent 6px 8px);height:8px}
.bar.seg i{background:repeating-linear-gradient(90deg,var(--cy) 0 6px,transparent 6px 8px)}
.bar.warn i{background:var(--amb)}.bar.crit i{background:var(--red)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.b{--bc:var(--cy2);--bt:var(--cy);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;background:rgba(98,230,242,.06);border:1px solid var(--bc);color:var(--bt);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.b:hover:not(:disabled){background:rgba(98,230,242,.16)}
.b.amb{--bc:var(--amb);--bt:var(--amb);background:rgba(245,168,58,.07)}.b.amb:hover:not(:disabled){background:rgba(245,168,58,.18)}
.b.red{--bc:var(--red);--bt:var(--red);background:rgba(255,82,102,.08)}.b.red:hover:not(:disabled){background:rgba(255,82,102,.2)}
.b.solid{background:var(--cy);color:var(--bg);border-color:var(--cy)}.b.solid:hover:not(:disabled){background:#8af0f8}
.b.ghost{--bc:var(--ln2);--bt:var(--mu);background:transparent}
.b.sm{min-height:28px;padding:3px 10px;font-size:11px}
.b:disabled{--bc:var(--ln);--bt:var(--dim);cursor:not-allowed;background:transparent}
.b .lk{font:500 10px var(--f-mono);letter-spacing:0;text-transform:none}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tab{padding:6px 12px;border:1px solid var(--ln);background:transparent;cursor:pointer;font-size:12px;letter-spacing:.08em;color:var(--mu)}
.tab[aria-pressed=true]{border-color:var(--cy);color:var(--cy);background:rgba(98,230,242,.1)}
.tab .s{display:inline-block;width:7px;height:7px;margin-right:6px;vertical-align:1px}
.st{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--f-disp);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;background:currentColor}
.st.ok{color:var(--ok)}.st.warn{color:var(--amb)}.st.fire,.st.crit{color:var(--red)}.st.vac{color:var(--vio)}.st.gone{color:var(--dim)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu);padding:6px 8px;border-bottom:1px solid var(--ln2);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}
td.m,th.r,td.r{text-align:right}
.tbl td:first-child{min-width:150px}
tr.sel td{background:rgba(98,230,242,.08)}
tbody tr{cursor:pointer}tbody tr:hover td{background:rgba(98,230,242,.04)}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.al:last-child{border-bottom:0}
.al .dot{width:9px;height:9px;flex:none;margin-top:5px}
.al b{font-weight:600;display:block}
.al small{color:var(--mu);font:12px var(--f-mono)}
.al.ack{opacity:.5}
.empty{color:var(--dim);padding:10px 0;font-size:13px}
.note{color:var(--mu);font-size:12.5px;margin:8px 0 0;max-width:70ch}
.lbl{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin:14px 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{flex:1;min-width:160px}
.pill{display:inline-block;padding:1px 7px;border:1px solid var(--ln2);font:500 11px var(--f-mono);color:var(--mu);margin:2px 4px 2px 0}
.pill.cy{border-color:var(--cy2);color:var(--cy)}.pill.amb{border-color:var(--amb);color:var(--amb)}.pill.red{border-color:var(--red);color:var(--red)}
.svgw{width:100%;overflow:hidden}
svg{display:block;width:100%;height:auto}
svg .hit{cursor:pointer}
svg .hit:hover{filter:brightness(1.45)}
.spin{transform-origin:300px 300px;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cd{font:600 54px/1 var(--f-mono);color:var(--red);letter-spacing:.04em;text-shadow:0 0 20px rgba(255,82,102,.4)}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.code{border:1px dashed var(--ln2);padding:10px;font:500 13px var(--f-mono)}
.code.ok{border:1px solid var(--ok);color:var(--ok)}
.gauge{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px;margin-bottom:12px}
.gauge div{border:1px solid var(--ln);padding:8px 10px;background:rgba(3,8,12,.35)}
.gauge span{display:block;font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase}
.gauge b{font:500 19px var(--f-mono)}
.gauge b.warn{color:var(--amb)}.gauge b.crit{color:var(--red)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--ln)}
.sw{position:relative;width:46px;height:22px;border:1px solid var(--ln2);background:var(--bg2);cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;background:var(--dim);transition:left .15s}
.sw[aria-checked=true]{border-color:var(--cy2)}.sw[aria-checked=true]::after{left:27px;background:var(--cy)}
.sw:disabled{opacity:.4;cursor:not-allowed}
.logl{display:grid;grid-template-columns:64px 130px 1fr;gap:10px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:13px}
.logl .t{font:12px var(--f-mono);color:var(--dim)}
.logl .w{color:var(--cy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logl.crit .w,.logl.crit .x{color:var(--red)}.logl.admin .w{color:var(--vio)}.logl.sys .w{color:var(--mu)}
@media(max-width:600px){.logl{grid-template-columns:54px 1fr}.logl .w{grid-column:2}.logl .x{grid-column:1/-1}}
.hp{display:inline-block;width:60px;height:5px;background:var(--cyd);vertical-align:middle;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.hp.warn i{background:var(--amb)}.hp.crit i{background:var(--red)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 14px;max-height:260px;overflow:auto;border:1px solid var(--ln);padding:8px}
.clause{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
@media(max-width:520px){.clause{grid-template-columns:1fr}}
.feed{font:12px var(--f-mono);max-height:220px;overflow:auto;color:var(--mu)}
.feed div{padding:3px 0;border-bottom:1px solid var(--ln);white-space:pre-wrap;word-break:break-word}

/* ---------- Fenêtre modale et notifications ---------- */
/* Écrans en jeu (kiosque) */
body.kiosk #app{display:block}
body.kiosk::after{display:none}
.kio{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column}
.kio .khead{display:flex;align-items:center;gap:14px;padding:1.6vh 2.4vw;border-bottom:1px solid var(--ln);font-family:var(--f-mono);letter-spacing:.14em;font-size:max(11px,1.7vh);color:var(--mu)}
.kio .khead b{color:var(--cy);font-family:var(--f-disp);letter-spacing:.32em;font-size:max(13px,2.4vh)}
.kio .kbody{flex:1;min-height:0;overflow:hidden;padding:2vh 2vw;pointer-events:none}
.kio .kbody main{padding:0;overflow:visible;height:auto}
.kio .ktext{flex:1;display:grid;place-items:center;text-align:center;padding:4vh 4vw;white-space:pre-line;font-weight:500;letter-spacing:.04em;line-height:1.25}
.kio iframe{flex:1;border:0;width:100%;height:100%;background:#fff}
.kstat{flex:1;display:grid;place-items:center;text-align:center;gap:2vh;padding:3vh}
.kstat .big{font-size:8vh;letter-spacing:.3em;color:var(--cy);font-weight:300}
.kstat .clk{font-family:var(--f-mono);font-size:11vh;letter-spacing:.08em}
.kstat .sub{font-size:2.6vh;letter-spacing:.18em;color:var(--mu)}

  "1": ["Niveau 1 · rassemblement", "warn"], "2": ["Niveau 2 · dépressurisation ou manœuvre technique", "warn"],
  "3": ["Niveau 3 · pressurisation non garantie, verrouillage des portes imminent", "crit"],
  "4": ["Niveau 4 · incendie ou brèche, évacuez", "crit"], "5": ["Niveau 5 · évacuation vers une zone sécurisée", "crit"]

function paEmpty() { return { list: {}, mics: {}, meta: {}, msgs: {}, alert: null }; }
/* Message « speakers » du mod : liste complète des haut-parleurs et micros. */
function applySpeakers(S, m, now = Date.now()) {
  const pa = S.pa || (S.pa = paEmpty());
  const one = (x) => ({ id: clean(x.id, 24), dim: clean(x.dim, 80), x: +x.x || 0, y: +x.y || 0, z: +x.z || 0, room: x.room ? clean(x.room, 60) : null, seen: now });
  if (Array.isArray(m.list)) { pa.list = {}; for (const x of m.list.slice(0, 1000)) if (x && x.id) { const o = one(x); pa.list[o.id] = o; } }
  if (Array.isArray(m.mics)) { pa.mics = {}; for (const x of m.mics.slice(0, 200)) if (x && x.id) { const o = one(x); o.onAir = x.onAir ? clean(x.onAir, 40) : null; pa.mics[o.id] = o; } }
}
const paMeta = (S, id) => (S.pa.meta[id] || {});
/* Cible → identifiants des haut-parleurs actifs. target : {kind:"all"} | {kind:"group", value} | {kind:"room", value} | {kind:"ids", value:[...]} */
function paTargets(S, target) {
  const pa = S.pa || paEmpty(), t = target || { kind: "all" };
  return Object.values(pa.list).filter(sp => paMeta(S, sp.id).enabled !== false && (
    t.kind === "group" ? paMeta(S, sp.id).group === t.value :
    t.kind === "room" ? sp.room === t.value :
    t.kind === "ids" ? (t.value || []).includes(sp.id) : true)).map(sp => sp.id);
}
function cleanTarget(t) {

  return kind === "ids" ? { kind, value: (Array.isArray(t.value) ? t.value : []).map(x => clean(x, 24)).slice(0, 500) } : kind === "all" ? { kind } : { kind, value: clean(t.value, 60) };
}
function paTargetLabel(S, t) {
  if (!t || t.kind === "all") return "tout le vaisseau";
  if (t.kind === "group") return "groupe « " + t.value + " »";
  if (t.kind === "room") return (S.rooms[t.value] ? S.rooms[t.value].name : t.value);

/* ============================ Fabrication ============================= */
/* Règles d'artisanat par objet : libre, interdit, ou réservé à des métiers / personnes ; recettes de remplacement
   (grille 3×3 d'identifiants d'objets) ouvertes à tous ou à certains seulement. Le mod applique les règles compilées
   dans l'ACL (liste des UUID autorisés). */
const CRAFT_MODES = { all: "Libre (tout le monde)", restricted: "Réservé (métiers / personnes)", forbidden: "Interdit à tous" };
function craftEmpty() { return { rules: {} }; }
const itemId = (v) => { const x = clean(v, 80).toLowerCase().replace(/\s+/g, ""); return /^[a-z0-9_.-]+:[a-z0-9_./-]+$/.test(x) ? x : (/^[a-z0-9_./-]+$/.test(x) ? "minecraft:" + x : ""); };
const strList = (a, n, max) => [...new Set((Array.isArray(a) ? a : []).map(x => clean(x, n)).filter(Boolean))].slice(0, max);
function cleanCraftRule(r) {
  r = r || {};
  const mode = CRAFT_MODES[r.mode] ? r.mode : "all";
  const alts = (Array.isArray(r.alts) ? r.alts : []).slice(0, 8).map(a => {
    const grid = Array.from({ length: 9 }, (_, i) => itemId((a.grid || [])[i] || ""));
    const all = a.all !== false && !(a.jobs || []).length && !(a.people || []).length;
    return { grid, count: Math.max(1, Math.min(64, a.count | 0 || 1)), all, jobs: all ? [] : strList(a.jobs, 40, 30), people: all ? [] : strList(a.people, 64, 200) };
  }).filter(a => a.grid.some(Boolean));
  return { mode, jobs: mode === "restricted" ? strList(r.jobs, 40, 30) : [], people: mode === "restricted" ? strList(r.people, 64, 200) : [], alts, note: clean(r.note || "", 120) };
}
/* Personnes concernées par une liste métiers + personnes. */
function craftAudience(S, jobs, people) {
  const js = new Set((jobs || []).map(j => j.toLowerCase()));
  return Object.values(S.people).filter(p => (people || []).includes(p.id) || (p.job && js.has(p.job.toLowerCase()))).map(p => p.id);
}
function craftLabel(S, r) {
  if (r.mode === "forbidden") return "interdit à tous";
  if (r.mode === "all") return "libre";
  const parts = [];
  if (r.jobs.length) parts.push("métiers : " + r.jobs.join(", "));
  if (r.people.length) parts.push(r.people.map(id => (S.people[id] || {}).name || id.slice(0, 8)).join(", "));
  return "réservé à " + (parts.join(" · ") || "personne");
}
function compileCraft(S) {
  const out = {};
  for (const [item, r] of Object.entries((S.craft || craftEmpty()).rules)) {
    out[item] = { mode: r.mode, allow: r.mode === "restricted" ? craftAudience(S, r.jobs, r.people) : [],
      alts: r.alts.map(a => ({ grid: a.grid, count: a.count, all: a.all, allow: a.all ? [] : craftAudience(S, a.jobs, a.people) })) };
  }
  return out;
}

/* État complet envoyé au mod (idempotent). */
function paStateCmd(S) {

  const msgs = Object.fromEntries(Object.entries(pa.msgs).map(([lv, m]) => [lv, { id: m.audio, interval: m.interval }]));

function navSimulate(S, now) {

  if (now - n.jump.startAt >= JUMP_INTRO_MS + n.jump.seconds * 1000) { n.system = n.jump.to; n.jump = null; log(S, "NAVIGATION", "Sortie d’hyperespace : système " + (navSystem(n.catalog, n.system) || {}).name + ".", "nav", now); }

function log(state, who, text, kind = "info", now = Date.now()) {

/* ---------------------------- Permissions --------------------------- */
function levelOf(p) { return p ? (p.admin ? 99 : (p.level | 0)) : -1; }

function can(state, actor, action, term) {
  if (!actor) return false;
  if (actor.admin) return true;
  if (state.computer.refuse) return false;
  const meta = ACTIONS[action];
  if (!meta) return false;
  if (term && (state.terminals[term] || wsJob(term)) && !termPages(state, term).includes(meta[2])) return false;
  return levelOf(actor) >= (state.perms[action] ?? meta[1]);
}

function effectiveRule(state, door) {
  if (door.rule) return door.rule;
  if (door.group && state.accessGroups[door.group]) return state.accessGroups[door.group].rule || null;
  return null;
}

function clauseMatch(c, p) {
  switch (c.t) {
    case "min": return levelOf(p) >= c.v;
    case "lv": return (c.v || []).includes(p.level | 0);
    case "p": return p.id === c.v;
    case "role": return (p.role || "") === c.v;
    case "job": return (p.job || "") === c.v;
    case "grp": return (p.group || "") === c.v;
    case "team": return (p.team || "") === c.v;
    case "tag": return (p.tags || []).includes(c.v);
    case "none": return false;
    default: return false;
  }
}

/* Peut-on ouvrir cette porte avec sa puce ? */
function canOpenDoor(state, p, door) {
  if (!p || !door) return { ok: false, why: "Inconnu" };
  if (p.admin) return { ok: true, why: "Admin" };
  if (p.vitals && p.vitals.alive === false) return { ok: false, why: "Puce inactive" };
  if (door.broken) return { ok: false, why: "Lecteur hors service" };
  if (door.state.lockdown) return { ok: false, why: "Porte scellée" };
  if (door.state.locked) return { ok: false, why: "Verrouillée" };
  if ((door.managers || []).includes(p.id)) return { ok: true, why: "Gestionnaire" };
  if ((door.grants || []).includes(p.id)) return { ok: true, why: "Autorisation spéciale" };
  const r = effectiveRule(state, door);
  if (!r || !r.any || !r.any.length) return { ok: true, why: "Accès libre" };
  return r.any.some(c => clauseMatch(c, p)) ? { ok: true, why: "Règle" } : { ok: false, why: "Accès refusé" };
}

function ruleText(state, rule) {
  if (!rule || !rule.any || !rule.any.length) return "Accès libre";
  return rule.any.map(c => {
    switch (c.t) {
      case "min": return "niv. " + c.v + " et plus";
      case "lv": return "niv. " + (c.v || []).join(", ");
      case "p": return state.people[c.v] ? state.people[c.v].name : "personne inconnue";
      case "role": return "rôle « " + c.v + " »";
      case "job": return "métier « " + c.v + " »";
      case "grp": return c.v;
      case "team": return "équipe de " + c.v;
      case "tag": return "#" + c.v;
      case "none": return "personne (gestionnaires seulement)";
      default: return "?";
    }
  }).join(" · ou ");
}

/* Liste d'accès compilée, envoyée au mod pour un contrôle local instantané. */
function compileAcl(state) {
  const people = Object.values(state.people);
  const doors = {};
  for (const d of Object.values(state.doors)) {
    const r = effectiveRule(state, d);
    doors[d.id] = {
      locked: !!d.state.locked, lockdown: !!d.state.lockdown, broken: !!d.broken,
      public: !r || !r.any || !r.any.length,
      allow: people.filter(p => !p.admin && canOpenDoor(state, p, d).ok).map(p => p.id)
    };
  }
  netState(state);
  const sections = {};
  for (const r of Object.values(state.rooms)) if (r.section) sections[r.id] = r.section;
  return { type: "acl", admins: people.filter(p => p.admin).map(p => p.id), doors, craft: compileCraft(state), uniforms: compileUniforms(state),
    power: { sections, ratings: state.power.ratings }, thermal: state.thermal, airlocks: state.airlocks.cfg, diseases: { defs: state.diseases }, chip: compileChip(state) };
}

/* ------------------------------ Alertes ----------------------------- */
function roomStatus(state, r) {
  if (!r) return "ok";
  const sec = r.section && state.sections[r.section];
  if (sec && sec.state === "ejected") return "gone";
  const e = r.env || {};
  if (r.flags && r.flags.fire) return "fire";
  if ((r.flags && r.flags.breach) || e.p < 60 || r.mode === "vent") return "vac";
  if (r.alarm || e.o2 < 18 || e.co2 > 1 || e.t < 5 || e.t > 40 || e.power === false || (r.flags && r.flags.alarm)) return "warn";
  return "ok";
}

function computeAlerts(state, withSilent = false) {
  const out = [];
  if (state.ship.alert) out.push({ key: "ship", lvl: (PA_LEVELS[state.ship.alert] || [0, "warn"])[1], text: "Alerte générale · " + (PA_LEVELS[state.ship.alert] ? PA_LEVELS[state.ship.alert][0] : state.ship.alert), room: null });
  for (const r of Object.values(state.rooms)) {
    const st = roomStatus(state, r), e = r.env || {};
    if (st === "gone") continue;
    if (r.flags && r.flags.fire) out.push({ key: "fire:" + r.id, lvl: "crit", text: "Incendie", room: r.id });
    if ((r.flags && r.flags.breach) || e.p < 60) out.push({ key: "vac:" + r.id, lvl: "crit", text: "Dépressurisation · " + Math.round(e.p) + " kPa", room: r.id });
    if (r.mode === "vent") out.push({ key: "vent:" + r.id, lvl: "warn", text: "Vidage en cours", room: r.id });
    if (e.o2 < 18) out.push({ key: "o2:" + r.id, lvl: e.o2 < 15 ? "crit" : "warn", text: "Oxygène bas · " + (+e.o2).toFixed(1) + " %", room: r.id });
    if (e.t < 5) out.push({ key: "cold:" + r.id, lvl: "warn", text: "Température · " + Math.round(e.t) + " °C", room: r.id });
    if (e.power === false) out.push({ key: "pwr:" + r.id, lvl: "warn", text: "Hors alimentation", room: r.id });
    if (r.alarm) out.push({ key: "man:" + r.id, lvl: "warn", text: "Alarme manuelle", room: r.id });
  }
  for (const f of state.faults) if (f.active && (withSilent || !f.silent) && f.target && f.target.kind === "door")
    out.push({ key: "f:" + f.id, lvl: "warn", text: FAULT_INDEX[f.key]?.name || f.key, room: null, door: f.target.id });
  for (const p of Object.values(state.people)) if (p.vitals && p.vitals.alive === false && !p.vitals.reported)
    out.push({ key: "dead:" + p.id, lvl: "crit", text: "Signal vital perdu · " + p.name, room: p.room || null });
  for (const r of (state.security && state.security.intrusions) || []) if (r.detected && (r.status === "running" || (r.ended && Date.now() - r.ended < 600000)))
    out.push({ key: "intr:" + r.id, lvl: "crit", text: r.status === "running" ? "Intrusion informatique en cours" : "Intrusion informatique", room: r.room || null });
  out.forEach(a => a.ack = state.acks.includes(a.key));
  return out;
}

function gradesOf(state) {

  if (!state.gradesV || state.gradesV < 2) {

    for (const g of gradesDefault()) if (!have.has(g.id)) state.grades.push(g);

}

function compileUniforms(state) {
  const grades = Object.fromEntries(gradesOf(state).map(g => [g.id, g])), out = {};

}



/* =========================== Inventaire automatique ===========================
   Le mod compte les coffres et réservoirs du vaisseau. Les objets (vivres, médical, pièces) peuvent être mal comptés :
   une erreur apparaît de temps en temps et reste jusqu’au recompte d’un magasinier ou du chef de soute. Les réservoirs
   (eau, ergols, O₂, antimatière) sont jaugés : jamais d’erreur. */
const INV_RES = {
  food: ["Vivres", "pts", true], meds: ["Fournitures médicales", "u.", true], parts: ["Pièces de rechange", "u.", true],
  water: ["Eau", "m³", false], fuel: ["Ergols (carburant)", "m³", false], o2: ["Oxygène en cuves", "kg", false], am: ["Antimatière", "g", false]
};
const INV_REF = { food: 4000, meds: 80, parts: 300, water: 256, fuel: 64, o2: 600, am: 100 };
const INV_ERR_P = 30 / 5400;   // ≈ une erreur par ressource toutes les 1 h 30 de jeu
function invState(state) { if (!state.inv) state.inv = { real: null, err: {}, ref: Object.assign({}, INV_REF), t: 0, log: [] }; if (!state.inv.ref) state.inv.ref = Object.assign({}, INV_REF); if (!state.inv.err) state.inv.err = {}; return state.inv; }
function invCounted(state) {
  const I = invState(state), r = I.real; if (!r) return null;
  const out = {};
  for (const [k, [, , items]] of Object.entries(INV_RES)) {
    const real = +r[k] || 0, e = items ? I.err[k] : null;
    out[k] = e ? Math.max(0, Math.round(real * (1 + e.f) + e.d)) : real;
  }
  out.rations = r.rations | 0; out.containers = r.containers | 0;
  out.cap = { water: +r.waterCap || 0, fuel: +r.fuelCap || 0, am: +r.amCap || 0 };
  return out;
}
function applyInventory(state, m, now = Date.now(), rnd = Math.random) {
  const I = invState(state);
  I.real = m; I.t = now;
  for (const [k, [, , items]] of Object.entries(INV_RES)) {
    if (!items || I.err[k] || !(+m[k] > 0)) continue;
    if (rnd() < INV_ERR_P) I.err[k] = { f: (rnd() < .5 ? -1 : 1) * (0.06 + rnd() * 0.2), d: Math.round((rnd() - .5) * 12), since: now };
  }
  const c = invCounted(state), pct = (k, cap) => Math.max(0, Math.min(100, Math.round((c[k] / Math.max(1e-9, cap || I.ref[k] || 1)) * 100)));
  state.stocks = Object.assign(state.stocks || {}, { food: pct("food"), meds: pct("meds"), parts: pct("parts"), water: pct("water", c.cap.water), fuel: pct("fuel", c.cap.fuel), o2: pct("o2"), am: pct("am", c.cap.am) });
}

/* Déroulé d’une session (heure de Paris). Chaque phase règle l’ambiance lumineuse du vaisseau. */
const PHASES = { briefing: ["Briefing", "#ffd9a0"], jour: ["Quart de jour", "#f2f6ff"], releve: ["Relève", "#ffc27a"], nuit: ["Quart de nuit", "#4a6cff"], rapport: ["Rapport", "#ffb070"], hors: ["Hors session", "#9fb3c8"] };
function scheduleDefault() { return { tz: "Europe/Paris", slots: [["briefing", "19:00"], ["jour", "19:10"], ["releve", "20:30"], ["nuit", "20:45"], ["rapport", "22:20"], ["hors", "22:30"]], force: null, cycle: 30 }; }
function scheduleOf(state) { if (!state.schedule) state.schedule = scheduleDefault(); return state.schedule; }
function minutesIn(tz, now) {
  try { const f = new Intl.DateTimeFormat("fr-FR", { timeZone: tz, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date(now)); const g = (t) => +(f.find(x => x.type === t) || { value: 0 }).value; return g("hour") * 60 + g("minute") + g("second") / 60; }
  catch { const d = new Date(now); return d.getUTCHours() * 60 + d.getUTCMinutes() + 60; }
}
const hm = (t) => { const [h, m] = String(t).split(":").map(Number); return (h | 0) * 60 + (m | 0); };
/* Phase courante, minutes restantes, et pour chaque quart les bornes. */
function phaseNow(state, now = Date.now()) {
  const sc = scheduleOf(state), m = minutesIn(sc.tz, now), slots = sc.slots.map(([k, t]) => [k, hm(t)]);
  let cur = ["hors", 0, slots[0][1]];
  for (let i = 0; i < slots.length; i++) { const end = i + 1 < slots.length ? slots[i + 1][1] : slots[0][1] + 1440; if (m >= slots[i][1] && m < end) cur = [slots[i][0], slots[i][1], end]; }
  if (cur[0] === "hors" && m < slots[0][1]) cur = ["hors", slots[slots.length - 1][1] - 1440, slots[0][1]];
  const key = sc.force && PHASES[sc.force] ? sc.force : cur[0];
  const shift = (k) => { const s = slots.find(x => x[0] === k); const i = slots.indexOf(s); return s ? [s[1], i + 1 < slots.length ? slots[i + 1][1] : s[1]] : null; };
  return { key, name: PHASES[key][0], color: PHASES[key][1], forced: !!sc.force, left: Math.max(0, Math.round(cur[2] - m)), minute: m, day: shift("jour"), night: shift("nuit"), cycle: sc.cycle | 0 || 30 };
}

  if (m.op === "ack") { const x = B.mob.find(y => y.id === m.id && y.active); if (x && p && !x.acks.includes(p.id)) x.acks.push(p.id); }
  if (m.op === "volunteer" && p) { B.volunteers = (B.volunteers || []).filter(x => x !== p.id); if (m.on) B.volunteers.push(p.id); }
  if (m.op === "call" && p) log(state, "STANDARD", String(m.text || "").slice(0, 160), "info", now);
}
function compileChip(state, now = Date.now()) {
  const B = bordState(state), sc = scheduleOf(state), people = {};
  for (const p of Object.values(state.people)) {
    if (p.demo || p.id === "admin" || p.id === "intrus") continue;
    const post = postOf(p.job);
    people[p.id] = { n: String(p.name || "").slice(0, 40), job: p.job || "", team: p.team || "aucune", grp: p.group || "", crew: isCrew(p),
      only: post && post[4] ? post[4] : "", op: can(state, p, "switchboard"), vol: (B.volunteers || []).includes(p.id) };
  }
  const deckName = (id) => ((state.decks || []).find(d => d.id === id) || {}).name || "";
  const rooms = Object.values(state.rooms).filter(r => (r.named || r.name !== r.id) && !(r.section && state.sections[r.section] && state.sections[r.section].state === "ejected"))
    .map(r => ({ id: r.id, n: r.name, d: deckName(r.deck) })).slice(0, 400);
  const alarms = { ship: state.ship.alert || null, rooms: Object.fromEntries(Object.values(state.rooms).filter(r => r.alarm).map(r => [r.id, "4"])) };
  /* Modèle 3D (le même que la vue 3D de la console) : ponts et pièces extrudées, pour le GPS de la puce. */
  const model = { decks: (state.decks || []).filter(d => d.y0 != null && d.kind !== "ring").map(d => [d.id, d.y0, d.y1]),
    rooms: Object.values(state.rooms).filter(r => r.rects && r.rects.length && !(r.section && state.sections[r.section] && state.sections[r.section].state === "ejected"))
      .map(r => [r.id, r.deck, r.kind === "corridor" ? 1 : 0, r.rects.slice(0, 12)]) };
  return { sched: { tz: sc.tz, slots: sc.slots, force: sc.force, cycle: sc.cycle }, general: B.general.slice(-15), crew: B.crew.slice(-15), model,
    mob: B.mob.filter(m => m.active).map(m => ({ id: m.id, t: m.t, text: m.text, by: m.by, groups: m.groups, room: m.room || null, acks: m.acks || [] })),
    people, rooms, alarms, services: SERVICES };
}

/* =========================== Sécurité informatique ===========================
   Intrusion par boîtier : durée et risque d'être repéré selon le pare-feu réglé par l'admin. */
const FIREWALL = { "1": ["Faible", 120, 0.25], "2": ["Standard", 240, 0.5], "3": ["Renforcé", 420, 0.85] };
function securityOf(state) {
  const s = state.security || (state.security = {});
  if (!s.firewall) s.firewall = "2";
  if (!s.hackLevel) s.hackLevel = 4;
  if (!Array.isArray(s.intrusions)) s.intrusions = [];
  return s;
}
function intrusionStart(state, b, now = Date.now()) {
  const sec = securityOf(state), fw = FIREWALL[sec.firewall] || FIREWALL["2"];
  const seconds = fw[1], spotted = Math.random() < fw[2];
  const rec = { id: "INT-" + Math.random().toString(16).slice(2, 6).toUpperCase(), uuid: String(b.uuid || ""), name: clean(b.name, 40), room: b.room && state.rooms[b.room] ? b.room : null,
    pos: [b.x | 0, b.y | 0, b.z | 0], start: now, end: now + seconds * 1000, status: "running", detectAt: spotted ? now + Math.round((0.25 + Math.random() * 0.7) * seconds * 1000) : null, detected: false };
  sec.intrusions.unshift(rec);
  sec.intrusions = sec.intrusions.slice(0, 40);
  return { id: rec.id, seconds };
}
/* À chaque télémétrie : l'ordinateur repère-t-il une intrusion en cours ? */
function intrusionCheck(state, now = Date.now()) {
  const sec = state.security; if (!sec || !sec.intrusions) return false;
  let hit = false;
  for (const r of sec.intrusions) if (r.status === "running" && !r.detected && r.detectAt && now >= r.detectAt) {
    r.detected = true; r.detectedAt = now; hit = true;
    const room = r.room && state.rooms[r.room];
    log(state, "SYSTÈME", `Intrusion détectée sur un ordinateur de bord${room ? " (" + room.name + ")" : ""}. Origine inconnue.`, "crit", now);
  }
  return hit;
}
function intrusionEnd(state, id, op, now = Date.now()) {
  const sec = securityOf(state), r = sec.intrusions.find(x => x.id === id);
  if (!r || r.status !== "running") return null;
  r.status = op === "done" ? "done" : "aborted"; r.ended = now;
  if (r.detected) log(state, "SYSTÈME", op === "done" ? "L’intrusion repérée a abouti : des données ont été copiées." : "L’intrusion repérée s’est interrompue.", "crit", now);
  return r;
}
/* Fragment de données : ce que le boîtier a pu copier (registre, journal récent, accès). */
function hackDump(state, now = Date.now()) {
  const ref = Math.random().toString(16).slice(2, 6).toUpperCase(), pages = [];
  const page = (t) => { pages.push(t.length > 1000 ? t.slice(0, 997) + "…" : t); };
  page(`DONNÉES MERIDIAN\nExtrait ${ref}\n${new Date(now).toISOString().slice(0, 16).replace("T", " ")}\n\nRegistre de l’équipage\nJournal de bord\nRègles d’accès\n\nSource : ordinateur de bord, accès non autorisé.`);
  const people = Object.values(state.people).filter(p => !p.demo && p.id !== "admin").sort((a, b) => (b.level | 0) - (a.level | 0));
  for (let i = 0; i < people.length; i += 6) page("REGISTRE\n\n" + people.slice(i, i + 6).map(p => `${p.name}\nniv. ${p.level | 0} · ${p.rank || p.role || "—"}${p.job ? " · " + p.job : ""}`).join("\n\n"));
  const logs = state.log.slice(0, 24);
  for (let i = 0; i < logs.length; i += 6) page("JOURNAL\n\n" + logs.slice(i, i + 6).map(l => `${new Date(l.t).toISOString().slice(11, 16)} ${l.who} : ${l.text}`).join("\n"));
  const doors = Object.values(state.doors).filter(d => { const r = effectiveRule(state, d); return r && r.any && r.any.length; }).slice(0, 30);
  for (let i = 0; i < doors.length; i += 8) page("ACCÈS RESTREINTS\n\n" + doors.slice(i, i + 8).map(d => { const r = effectiveRule(state, d); return `${d.name} : ${ruleText(state, r)}`; }).join("\n"));
  return { ref, title: "Données Meridian " + ref, pages: pages.slice(0, 60) };
}

/* ------------------------- Données du mod --------------------------- */
/* structure : { decks:[{id,name,kind,order,y0,y1}], rooms:[{id,name,deck,kind,rects:[[x1,z1,x2,z2]],volume}],
   doors:[{id,name,deck,x,z,rooms:[a,b],size,airtight}], valves:[{id,name,room,kind}],
   sections:[{id,name,ejectable,rooms:[]}], terminals:[{id,name,room}] } */
function mergeStructure(state, s, now = Date.now()) {
  if (state.ship.demo) {
    const keepPerms = state.perms, admins = Object.values(state.people).filter(p => p.admin && !p.demo);
    const fresh = emptyShip(state.ship.name);
    Object.assign(state, fresh);
    state.perms = keepPerms;
    for (const a of admins) state.people[a.id] = a;
    log(state, "SYSTÈME", "Première structure reçue du mod : la démo est remplacée.", "sys", now);
  }
  const keep = (old, neu, fields) => { if (old) for (const f of fields) if (old[f] !== undefined) neu[f] = old[f]; return neu; };
  const decks = [];
  for (const d of s.decks || []) {
    const old = state.decks.find(x => x.id === d.id);
    const n = { id: d.id, name: d.name || ("Pont " + d.id), kind: d.kind || "hull", order: d.order ?? decks.length, y0: d.y0, y1: d.y1 };
    if (d.ring) n.ring = d.ring;                       // anneau : axe, centre, rayons, sections (vue de face)
    if (old && old.named) { n.name = old.name; n.named = true; }
    decks.push(n);
  }
  state.decks = decks.sort((a, b) => a.order - b.order);

  const rooms = {};
  for (const r of s.rooms || []) {
    const old = state.rooms[r.id];
    const n = { id: r.id, name: r.name || r.id, deck: r.deck, kind: r.kind || "room", rects: r.rects || [], volume: r.volume || 0,
      env: old ? old.env : envDefault(), flags: old ? old.flags : {}, alarm: old ? old.alarm : false, mode: old ? old.mode : null, section: r.section || null };
    if (old && old.named) { n.name = old.name; n.named = true; }
    if (old && old.sectionSet) { n.section = old.section; n.sectionSet = true; }
    rooms[r.id] = n;
  }
  state.rooms = rooms;

  const doors = {};
  for (const d of s.doors || []) {
    const old = state.doors[d.id];
    const n = { id: String(d.id), name: d.name || ("Porte " + d.id), deck: d.deck, x: d.x, z: d.z, rooms: d.rooms || [], size: d.size || "",
      airtight: d.airtight !== false, state: old ? old.state : { open: false, locked: false, lockdown: false },
      rule: null, group: null, managers: [], grants: [] };
    keep(old, n, ["rule", "group", "managers", "grants", "broken"]);
    if (old && old.named) { n.name = old.name; n.named = true; }
    doors[n.id] = n;
  }
  state.doors = doors;

  const valves = {};
  for (const v of s.valves || []) {
    const old = state.valves[v.id];
    valves[v.id] = { id: v.id, name: (old && old.named) ? old.name : (v.name || v.id), named: !!(old && old.named), room: v.room, kind: v.kind || "gas", open: old ? old.open : !!v.open };
  }
  state.valves = valves;

  for (const sec of s.sections || []) {
    const old = state.sections[sec.id];
    state.sections[sec.id] = { id: sec.id, name: (old && old.named) ? old.name : (sec.name || sec.id), named: !!(old && old.named),
      ejectable: old ? old.ejectable : !!sec.ejectable, state: old ? old.state : "attached", fromMod: true };
    if (sec.ring) { state.sections[sec.id].ring = sec.ring; state.sections[sec.id].index = sec.index | 0; }
    for (const rid of sec.rooms || []) if (state.rooms[rid] && !state.rooms[rid].sectionSet) state.rooms[rid].section = sec.id;
  }
  for (const t of s.terminals || []) {
    const old = state.terminals[t.id];
    state.terminals[t.id] = { id: t.id, name: (old && old.named) ? old.name : (t.name || t.id), named: !!(old && old.named), room: t.room || null,
      pages: old ? old.pages : Object.keys(PAGES).filter(k => !ADMIN_PAGES.includes(k)) };
  }
  state.ship.lastStructure = now;
  log(state, "SYSTÈME", `Structure synchronisée : ${state.decks.length} ponts, ${Object.keys(rooms).length} pièces, ${Object.keys(doors).length} portes.`, "sys", now);
}

/* Un joueur a saisi son nom à la connexion. */
/* name : nom à bord choisi par le joueur. mcName : pseudo Minecraft, utilisé tant qu'aucun nom n'est choisi. */
function registerPlayer(state, { uuid, name, mcName }, now = Date.now()) {
  if (!uuid) return null;
  let p = state.people[uuid];
  if (!p) {
    p = state.people[uuid] = { id: uuid, name: name || mcName || "Inconnu", mcName: mcName || "", level: 0, rank: "", job: "", role: "Non assigné", group: "", team: "aucune", tags: [], online: true, room: null, vitals: null, joined: now };
    log(state, "SYSTÈME", `Nouvel arrivant : ${p.name}. Affectation en attente.`, "crew", now);
  } else if (mcName && p.mcName !== mcName) p.mcName = mcName;
  if (p && name && p.name !== name) {
    log(state, "SYSTÈME", `${p.name} s’identifie désormais comme ${name}.`, "crew", now);
    p.name = name;
  }
  return p;
}

/* Réinitialisation d'un joueur (poste admin ou menu admin en jeu) : retour à « nouvel arrivant ». */
function resetPerson(state, uuid, now = Date.now()) {
  const p = state.people[uuid]; if (!p) return null;
  Object.assign(p, { name: p.mcName || "Inconnu", level: 0, rank: "", job: "", role: "Non assigné", group: "", team: "aucune", tags: [], notifyAi: false });
  delete p.chip; delete p.carriedBy;
  if (state.chats) delete state.chats[uuid];
  if (state.chatUnread) delete state.chatUnread[uuid];
  log(state, "SYSTÈME", `Dossier de ${p.name} remis à zéro.`, "crew", now);
  return p;
}

/* telemetry : { rooms:{id:{p,o2,co2,t,g,power,fire,breach}}, doors:{id:{open}}, players:[{uuid,name,room,vitals}], stocks:{} , full:true } */
function applyTelemetry(state, m, now = Date.now()) {
  const cmds = [], fired = [];
  for (const [id, e] of Object.entries(m.rooms || {})) {
    const r = state.rooms[id]; if (!r) continue;
    const { fire, breach, ...env } = e;
    Object.assign(r.env, env);
    if (fire && !r.flags.fire) fired.push(r);
    if (fire !== undefined) r.flags.fire = !!fire;
    if (breach !== undefined) r.flags.breach = !!breach;
    if (r.mode === "pressurize" && r.env.p >= 100) r.mode = null;
    if (r.mode === "vent" && r.env.p <= 0.5) r.mode = null;
  }
  for (const [id, d] of Object.entries(m.doors || {})) if (state.doors[id]) Object.assign(state.doors[id].state, { open: !!d.open });
  if (m.players) {
    const seen = new Set();
    for (const pl of m.players) {
      const p = registerPlayer(state, pl, now); if (!p) continue;
      seen.add(p.id);
      const wasAlive = !p.vitals || p.vitals.alive !== false;
      p.online = pl.online !== false; p.room = pl.room || null; p.vitals = Object.assign(p.vitals || {}, pl.vitals || {});
      if (wasAlive && p.vitals.alive === false) log(state, "SYSTÈME", `Signal vital perdu : ${p.name}${p.room && state.rooms[p.room] ? " (" + state.rooms[p.room].name + ")" : ""}.`, "crit", now);
      if (!wasAlive && p.vitals.alive !== false) { p.vitals.reported = false; log(state, "SYSTÈME", `${p.name} est de nouveau en vie.`, "crew", now); }
    }
    if (m.full) for (const p of Object.values(state.people)) if (!seen.has(p.id) && !p.demo) p.online = false;
    // Puces : qui porte la puce de qui (visible du poste admin seulement)
    for (const pl of m.players) if (pl.chip !== undefined && state.people[pl.uuid]) state.people[pl.uuid].chip = pl.chip || null;
    for (const p of Object.values(state.people)) delete p.carriedBy;
    for (const p of Object.values(state.people))
      if (p.online && p.chip && p.chip !== p.id && state.people[p.chip]) state.people[p.chip].carriedBy = p.id;
  }
  if (m.stocks) Object.assign(state.stocks, m.stocks);
  if (m.inv) applyInventory(state, m.inv, now);
  if (Array.isArray(m.cams)) state.cameras = Object.fromEntries(m.cams.slice(0, 200).map(c => [String(c.id), { id: String(c.id), name: String(c.name || c.id).slice(0, 40), room: c.room || null, x: c.x, y: c.y, z: c.z, yaw: c.yaw, pitch: c.pitch, fov: c.fov }]));
  netState(state);
  if (Array.isArray(m.damage)) state.damage = m.damage.slice(0, 300);   // les événements arrivent déjà par le journal du mod
  if (m.power) {
    const prevMode = state.power.telem && state.power.telem.mode;
    state.power.telem = m.power;
    for (const e of m.power.events || []) { state.power.events.unshift({ t: now, text: e }); log(state, "RÉSEAU", e, "power", now); }
    if (state.power.events.length > 60) state.power.events.length = 60;
    if (prevMode && prevMode !== m.power.mode && m.power.mode !== "normal") log(state, "RÉSEAU", `Alimentation : ${m.power.mode}.`, "crit", now);
  }
  if (m.networks) state.networks = m.networks;
  if (m.airlocks) state.airlocks.list = m.airlocks;
  /* Détecteur incendie : l'alarme de toute la section (ou de la pièce seule) se déclenche, l'alerte apparaît à la passerelle. */
  for (const r of fired) {
    const sec = r.section && state.sections[r.section];
    const zone = sec ? Object.values(state.rooms).filter(x => x.section === sec.id) : [r];
    for (const x of zone) if (!x.alarm) { x.alarm = true; x.alarmBy = "fire"; cmds.push({ type: "alarm.set", room: x.id, on: true, level: "4" }); }
    state.acks = state.acks.filter(k => k !== "fire:" + r.id);
    log(state, "SYSTÈME", `Détecteur incendie : ${r.name}. Alarme ${sec ? "de la section " + sec.name : "de la pièce"} déclenchée.`, "crit", now);
  }
  if (fired.length) cmds.push(paStateCmd(state));
  intrusionCheck(state, now);
  return cmds;
}

/* ------------------------------ Actions ----------------------------- */
const ERR = (error) => ({ ok: false, error, cmds: [] });

function apply(state, actor, a, ctx = {}) {
  const now = ctx.now || Date.now(), term = ctx.term || null;
  if (!actor) return ERR("Session inconnue.");
  if (!a || !a.type) return ERR("Action vide.");
  if (state.computer.refuse && !actor.admin) return ERR(state.computer.message || "ORDINATEUR : commande refusée.");
  const who = actor.name, cmds = [];
  const need = (perm) => { if (!can(state, actor, perm, term)) throw new Error("Niveau ou terminal insuffisant : " + ACTIONS[perm][0].toLowerCase() + "."); };
  const room = (id) => { const r = state.rooms[id]; if (!r) throw new Error("Pièce inconnue."); if (roomStatus(state, r) === "gone") throw new Error("Pièce éjectée."); return r; };
  const door = (id) => { const d = state.doors[id]; if (!d) throw new Error("Porte inconnue."); return d; };
  const person = (id) => { const p = state.people[id]; if (!p) throw new Error("Personne inconnue."); return p; };
  const L = (t, k) => log(state, who, t, k, now);
  try {
    switch (a.type) {
      /* Portes */
      case "door.open": {
        const d = door(a.door); need("door.remote");
        if (d.state.lockdown && !can(state, actor, "door.lockdown", term)) throw new Error("Porte scellée.");
        d.state.open = !!a.open; cmds.push({ type: "door.set", door: d.id, open: d.state.open });
        L(`${d.state.open ? "ouvre" : "ferme"} ${d.name}.`, "door"); break;
      }
      case "door.lock": {
        const d = door(a.door);
        if (!(d.managers || []).includes(actor.id)) need("door.lock");
        d.state.locked = !!a.locked; if (a.locked) d.state.open = false;
        cmds.push({ type: "door.set", door: d.id, locked: d.state.locked, open: d.state.open });
        L(`${d.state.locked ? "verrouille" : "déverrouille"} ${d.name}.`, "door"); break;
      }
      case "door.lockdown": {
        need("door.lockdown");
        const ids = a.room ? Object.values(state.doors).filter(d => d.rooms.includes(a.room)).map(d => d.id) : [a.door];
        for (const id of ids) { const d = door(id); d.state.lockdown = !!a.on; if (a.on) d.state.open = false; cmds.push({ type: "door.set", door: d.id, lockdown: d.state.lockdown, open: d.state.open }); }
        L(`${a.on ? "scelle" : "lève le scellé de"} ${a.room ? "toutes les portes de " + state.rooms[a.room].name : state.doors[a.door].name}.`, "door"); break;
      }
      case "door.setRule": { const d = door(a.door); need("access.edit"); d.rule = sanitizeRule(a.rule); L(`règle de ${d.name} : ${ruleText(state, effectiveRule(state, d))}.`, "access"); break; }
      case "door.setGroup": { const d = door(a.door); need("access.edit"); if (a.group && !state.accessGroups[a.group]) throw new Error("Groupe inconnu."); d.group = a.group || null; L(`${d.name} → groupe ${a.group ? state.accessGroups[a.group].name : "aucun"}.`, "access"); break; }
      case "door.setManagers": { const d = door(a.door); need("access.edit"); d.managers = (a.managers || []).filter(id => state.people[id]); L(`gestionnaires de ${d.name} : ${d.managers.map(id => state.people[id].name).join(", ") || "aucun"}.`, "access"); break; }
      case "door.grant": {
        const d = door(a.door), p = person(a.person);
        if (!(d.managers || []).includes(actor.id)) need("access.edit");
        d.grants = (d.grants || []).filter(x => x !== p.id); if (a.on) d.grants.push(p.id);
        L(`${a.on ? "autorise" : "retire l’autorisation de"} ${p.name} sur ${d.name}.`, "access"); break;
      }
      case "door.rename": { const d = door(a.door); need("structure.edit"); d.name = clean(a.name, 40) || d.name; d.named = true; break; }
      case "group.save": {
        need("access.edit");
        const id = a.id && state.accessGroups[a.id] ? a.id : "g" + (state.seq++);
        const g = state.accessGroups[id] = { id, name: clean(a.name, 40) || "Groupe " + id, rule: sanitizeRule(a.rule) };
        const set = new Set((a.doors || []).map(String));
        for (const d of Object.values(state.doors)) { if (set.has(d.id)) d.group = id; else if (d.group === id) d.group = null; }
        L(`enregistre le groupe d’accès « ${g.name} » (${set.size} portes, ${ruleText(state, g.rule)}).`, "access"); break;
      }
      case "group.delete": {
        need("access.edit"); const g = state.accessGroups[a.id]; if (!g) throw new Error("Groupe inconnu.");
        for (const d of Object.values(state.doors)) if (d.group === a.id) d.group = null;
        delete state.accessGroups[a.id]; L(`supprime le groupe « ${g.name} ».`, "access"); break;
      }
      /* Atmosphère */
      case "valve.set": {
        need("valve.set"); const v = state.valves[a.valve]; if (!v) throw new Error("Vanne inconnue."); room(v.room);
        v.open = !!a.open; cmds.push({ type: "valve.set", valve: v.id, open: v.open });
        L(`${v.open ? "ouvre" : "ferme"} la vanne ${v.name} (${state.rooms[v.room].name}).`, "atmos"); break;
      }

      /* Discussion avec l'ordinateur de bord (le staff incarne l'ordinateur) */
      case "chat.send": {

        } else {

        }
        for (const k of Object.keys(state.chats)) if (state.chats[k].length > 200) state.chats[k].splice(0, state.chats[k].length - 200);
        break;
      }
      case "chat.read": { if (!actor.admin) throw new Error("Réservé au staff."); state.chatUnread = state.chatUnread || {}; state.chatUnread[a.to] = false; break; }
      case "chat.notify": {
        if (!actor.admin) throw new Error("Réservé au staff.");
        const p = state.people[actor.id]; if (!p) throw new Error("Identité inconnue.");
        p.notifyAi = !!a.on;

      }
      case "crew.remove": { need("crew.assign"); const p = person(a.person); if (!actor.admin && levelOf(p) >= levelOf(actor)) throw new Error("Vous ne pouvez pas retirer un supérieur."); delete state.people[p.id]; for (const d of Object.values(state.doors)) { d.managers = d.managers.filter(x => x !== p.id); d.grants = d.grants.filter(x => x !== p.id); } L(`retire ${p.name} du registre.`, "crew"); break; }
      /* Admin */
      case "admin.fault": {

      }
      case "admin.clearFault": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const fault = state.faults.find(x => x.id === a.id); if (!fault) throw new Error("Avarie inconnue.");
        fault.active = false; faultEffect(state, fault, false); cmds.push({ type: "fault", id: fault.id, key: fault.key, target: fault.target, on: false });
        log(state, "ORDINATEUR", `avarie « ${FAULT_INDEX[fault.key]?.name} » résolue.`, "admin", now); break;
      }
      case "admin.computer": { if (!actor.admin) throw new Error("Réservé au poste admin."); state.computer.refuse = !!a.refuse; state.computer.message = clean(a.message, 140); log(state, "ORDINATEUR", a.refuse ? "refuse désormais les commandes de l’équipage." : "obéit de nouveau à l’équipage.", "admin", now); break; }
      case "admin.setAdmin": { if (!actor.admin) throw new Error("Réservé au poste admin."); const p = person(a.person); p.admin = !!a.on; log(state, "ORDINATEUR", `${p.name} ${a.on ? "reçoit" : "perd"} l’accès admin.`, "admin", now); break; }
      case "admin.env": { if (!actor.admin) throw new Error("Réservé au poste admin."); const r = room(a.room); cmds.push({ type: "env.set", room: r.id, env: a.env }); Object.assign(r.env, a.env); log(state, "ORDINATEUR", `force l’environnement de ${r.name}.`, "admin", now); break; }
      case "cam.move": {
        need("cam.move"); const c = (state.cameras || {})[a.id]; if (!c) throw new Error("Caméra inconnue.");
        const k = { type: "cam.set", cam: c.id };
        for (const f of ["dyaw", "dpitch", "dfov"]) if (isFinite(+a[f]) && +a[f]) k[f] = Math.max(-90, Math.min(90, +a[f]));
        // Mise à jour immédiate (le mod renverra les valeurs réelles à la prochaine télémétrie).
        if (k.dyaw) c.yaw = Math.max(-80, Math.min(80, (+c.yaw || 0) + k.dyaw));
        if (k.dpitch) c.pitch = Math.max(-70, Math.min(30, (+c.pitch || 0) + k.dpitch));
        if (k.dfov) c.fov = Math.max(25, Math.min(100, (+c.fov || 70) + k.dfov));
        cmds.push(k); break;
      }
      case "damage.clear": { if (!actor.admin) throw new Error("Réservé au poste admin."); const d = (state.damage || []).find(x => x.id === a.id); if (!d) throw new Error("Avarie inconnue."); state.damage = state.damage.filter(x => x.id !== a.id); cmds.push({ type: "damage.clear", id: a.id, clear: true }); log(state, "ORDINATEUR", `lève l’avarie de ${d.label} (${d.room}).`, "admin", now); break; }
      case "cam.rename": { need("cam.move"); const c = (state.cameras || {})[a.id]; if (!c) throw new Error("Caméra inconnue."); c.name = clean(a.name, 40) || c.id; cmds.push({ type: "cam.set", cam: c.id, name: c.name }); L(`renomme la caméra ${c.id} : ${c.name}.`, "info"); break; }
      case "cam.screen": {
        need("cam.screen"); const sc = state.screens || (state.screens = screensEmpty());
        const ids = (Array.isArray(a.ids) ? a.ids : []).map(x => clean(x, 24)).filter(x => sc.list[x]).slice(0, 40);
        if (!ids.length) throw new Error("Aucun écran choisi.");
        if (a.cam) { if (!(state.cameras || {})[a.cam]) throw new Error("Caméra inconnue."); for (const id of ids) sc.cfg[id] = { mode: "camera", cam: a.cam }; L(`affiche la caméra ${state.cameras[a.cam].name} sur ${ids.length} écran(s).`, "info"); }
        else { for (const id of ids) if (sc.cfg[id] && sc.cfg[id].mode === "camera") delete sc.cfg[id]; L(`retire la caméra de ${ids.length} écran(s).`, "info"); }
        break;
      }
      case "info.post": {
        const ch = a.channel === "crew" ? "crew" : "general"; need(ch === "crew" ? "info.crew" : "info.general");
        const text = clean(a.text, 280); if (!text) throw new Error("Message vide.");
        const B = bordState(state); B[ch].push({ t: now, from: actor.name, text }); if (B[ch].length > 60) B[ch].splice(0, B[ch].length - 60);
        L(`publie sur le canal ${ch === "crew" ? "de l’équipage" : "général"} : « ${text.slice(0, 80)} ».`, "info"); break;
      }
      case "info.delete": {
        const ch = a.channel === "crew" ? "crew" : "general"; need(ch === "crew" ? "info.crew" : "info.general");
        const B = bordState(state); B[ch] = B[ch].filter(m => m.t !== a.t); break;
      }
      case "mob.start": {
        need("mobilize");
        const groups = (Array.isArray(a.groups) ? a.groups : []).filter(g => MOB_GROUPS[g]); if (!groups.length) throw new Error("Choisissez au moins un groupe.");
        const text = clean(a.text, 200) || "Rejoignez votre poste immédiatement.";
        const r = a.room && state.rooms[a.room] ? a.room : null;
        const B = bordState(state); const m = { id: "mob" + (B.seq++), t: now, text, groups, room: r, by: actor.name, active: true, acks: [] };
        B.mob.push(m); if (B.mob.length > 30) B.mob.splice(0, B.mob.length - 30);
        L(`MOBILISATION (${groups.map(g => MOB_GROUPS[g]).join(", ")}) : ${text}${r ? " · rendez-vous " + state.rooms[r].name : ""}`, "crit"); break;
      }
      case "mob.end": { need("mobilize"); const m = bordState(state).mob.find(x => x.id === a.id); if (!m) throw new Error("Mobilisation introuvable."); m.active = false; L(`lève la mobilisation « ${m.text.slice(0, 60)} » (${(m.acks || []).length} réponse(s)).`, "info"); break; }
      case "mob.volunteer": { const B = bordState(state); B.volunteers = (B.volunteers || []).filter(x => x !== actor.id); if (a.on) B.volunteers.push(actor.id); break; }
      case "schedule.set": {
        need("schedule.edit"); const sc = scheduleOf(state);
        if (Array.isArray(a.slots)) { const ok = a.slots.filter(x => Array.isArray(x) && PHASES[x[0]] && /^\d{1,2}:\d{2}$/.test(x[1])); if (ok.length >= 2) sc.slots = ok.map(([k, t]) => [k, t.padStart(5, "0")]).sort((x, y) => hm(x[1]) - hm(y[1])); }
        if (a.force !== undefined) sc.force = a.force && PHASES[a.force] ? a.force : null;
        if (a.cycle !== undefined) sc.cycle = Math.max(5, Math.min(120, a.cycle | 0));
        if (a.tz) sc.tz = clean(a.tz, 40);
        L(sc.force ? `impose l’ambiance « ${PHASES[sc.force][0]} ».` : "règle le déroulé de session.", "struct"); break;
      }
      case "stock.recount": {
        if (!canRecount(actor)) throw new Error("Recompte réservé aux magasiniers et au chef de soute.");
        const I = invState(state), k = a.res; if (!INV_RES[k]) throw new Error("Ressource inconnue.");
        if (!INV_RES[k][2]) throw new Error("Ressource jaugée en réservoir : pas de recompte manuel.");
        const before = invCounted(state); delete I.err[k]; const after = invCounted(state);
        const diff = before && after ? after[k] - before[k] : 0;
        L(`recompte ${INV_RES[k][0].toLowerCase()} : ${diff ? "écart de " + (diff > 0 ? "+" : "") + diff + " " + INV_RES[k][1] + " corrigé" : "aucun écart"}.`, "info");
        applyInventory(state, I.real || {}, now, () => 1); break;
      }
      case "stock.ref": { if (!actor.admin) throw new Error("Réservé au poste admin."); const I = invState(state); for (const k of Object.keys(INV_REF)) if (a.ref && +a.ref[k] > 0) I.ref[k] = +a.ref[k]; if (I.real) applyInventory(state, I.real, now, () => 1); break; }
      case "admin.stocks": { if (!actor.admin) throw new Error("Réservé au poste admin."); for (const k of Object.keys(state.stocks)) if (a.stocks && a.stocks[k] !== undefined) state.stocks[k] = Math.max(0, Math.min(100, +a.stocks[k])); cmds.push({ type: "stocks.set", stocks: state.stocks }); break; }
      /* Navigation */
      case "nav.jump": {
        need("nav.jump"); const r = navReach(state, a.system); if (!r.ok) throw new Error(r.why);
        const to = navSystem(state.nav.catalog, a.system);
        state.nav.jump = { to: to.id, seconds: r.seconds, startAt: now, pending: true };
        if (state.nav.fuelMode === "manual" || state.ship.demo) state.nav.fuel = Math.max(0, state.nav.fuel - r.fuel);
        cmds.push({ type: "nav.jump", system: to.id, by: who });
        L(`ordonne le saut vers ${to.name} (${r.dist.toFixed(1)} al, ${r.fuel.toFixed(2)} g d’antimatière).`, "nav"); break;
      }
      case "comlink.delete": {
        need("comlink.rename"); const i = (state.nav.comlinks || []).findIndex(x => x.id === a.id); if (i < 0) throw new Error("Liaison com inconnue.");
        const c = state.nav.comlinks.splice(i, 1)[0]; cmds.push({ type: "comlink.delete", id: c.id }); L(`retire la navette ${c.name || c.id} du suivi.`, "nav"); break;
      }
      case "comlink.rename": {
        need("comlink.rename"); const c = (state.nav.comlinks || []).find(x => x.id === a.id); if (!c) throw new Error("Liaison com inconnue.");
        c.name = clean(a.name, 40) || c.name; cmds.push({ type: "comlink.rename", id: c.id, name: c.name }); L(`renomme la navette ${c.id} : ${c.name}.`, "nav"); break;
      }
      case "admin.nav.force": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const to = navSystem(state.nav.catalog, a.system); if (!to) throw new Error("Système inconnu.");
        const seconds = a.seconds ? Math.max(1, Math.min(86400, a.seconds | 0)) : null;
        const dir = ["north", "south", "east", "west", "up", "down"].includes(a.direction) ? a.direction : null;
        state.nav.jump = { to: to.id, seconds: seconds || navReach(state, to.id).seconds || 30, startAt: now, pending: true };
        cmds.push({ type: "nav.force", system: to.id, seconds, direction: dir, by: who });
        log(state, "ORDINATEUR", `saut forcé vers ${to.name}${seconds ? " (" + seconds + " s)" : ""}.`, "admin", now); break;
      }
      case "admin.nav.set": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const to = navSystem(state.nav.catalog, a.system); if (!to) throw new Error("Système inconnu.");
        state.nav.system = to.id; state.nav.jump = null; cmds.push({ type: "nav.set", system: to.id });
        log(state, "ORDINATEUR", `place le vaisseau dans le système ${to.name}.`, "admin", now); break;
      }
      case "admin.nav.fuel": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const mode = a.mode === "manual" ? "manual" : "tanks"; const value = Math.max(0, +a.value || 0);

      }
      case "admin.craft.save": case "admin.craft.delete": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const cr = state.craft || (state.craft = craftEmpty());
        const item = itemId(a.item); if (!item) throw new Error("Identifiant d’objet invalide (ex. minecraft:iron_ingot).");
        if (a.type === "admin.craft.delete") { delete cr.rules[item]; L(`rend la fabrication de ${item} libre (règle retirée).`, "admin"); break; }
        const r = cleanCraftRule(a.rule);
        if (r.mode === "all" && !r.alts.length) { delete cr.rules[item]; L(`rend la fabrication de ${item} libre.`, "admin"); break; }
        if (Object.keys(cr.rules).length >= 2000 && !cr.rules[item]) throw new Error("Trop de règles (2000 au plus).");
        cr.rules[item] = r;
        L(`règle la fabrication de ${item} : ${craftLabel(state, r)}${r.alts.length ? " + " + r.alts.length + " recette(s) de remplacement" : ""}.`, "admin");
        break;
      }
      case "admin.screen.set": case "admin.screen.reset": case "admin.screen.meta": {
        if (!actor.admin) throw new Error("Réservé au poste admin.");
        const sc = state.screens || (state.screens = screensEmpty());
        const ids = (Array.isArray(a.ids) ? a.ids : []).map(x => clean(x, 24)).filter(Boolean).slice(0, 500);

        } else if (a.type === "admin.screen.reset") {
          if (a.all) { sc.cfg = {}; sc.groups = {}; L("remet tous les écrans par défaut.", "admin"); }
          else if (grp && !ids.length) { delete sc.groups[grp]; for (const [id, m] of Object.entries(sc.meta)) if (m.group === grp) delete sc.cfg[id]; L(`remet le groupe d’écrans « ${grp} » par défaut.`, "admin"); }
          else { for (const id of ids) delete sc.cfg[id]; L(`remet ${ids.length} écran(s) par défaut.`, "admin"); }
        } else {
          for (const id of ids) { const m = sc.meta[id] || (sc.meta[id] = {}); if (a.name !== undefined) m.name = clean(a.name, 40); if (a.group !== undefined) m.group = grp || ""; }
        }

      case "admin.nav.system.save": case "admin.nav.system.delete": case "admin.nav.planet.save": case "admin.nav.planet.delete":
      case "admin.nav.field.save": case "admin.nav.field.delete": case "admin.nav.rules": case "admin.nav.catalog": case "admin.nav.reset": {
